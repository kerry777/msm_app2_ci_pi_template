<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="https://unpkg.com/@univerjs/preset-sheets-core/lib/index.css">

    <style>
        body { margin: 0; padding: 0; font-family: system-ui; }
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white; padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .toolbar {
            background: #34495e; padding: 10px 20px;
            display: flex; gap: 10px; align-items: center;
        }
        .btn {
            background: #3498db; color: white; border: none;
            padding: 8px 16px; border-radius: 4px; cursor: pointer;
            font-size: 14px; transition: all 0.2s;
        }
        .btn:hover { background: #2980b9; transform: translateY(-1px); }
        .btn-success { background: #27ae60; }
        .btn-success:hover { background: #229954; }
        #container { height: calc(100vh - 120px); margin: 0; }
        .footer {
            background: #2c3e50; color: white; padding: 10px 20px;
            text-align: center; font-size: 12px;
        }
    </style>
</head>

                setStatus('Univer 초기화 중...');

                let attempts = 0;

                    if (window.UniverPresets && window.UniverPresetSheetsCore) break;

                    throw new Error('Univer 라이브러리 로드 실패');

                const { UniverPresets } = window;

            } catch (error) {
                setStatus('❌ 초기화 실패: ' + error.message);

            }
