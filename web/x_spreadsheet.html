<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Spreadsheet Excel Viewer</title>

    <!-- X-Spreadsheet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/x-data-spreadsheet@latest/dist/xspreadsheet.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        #spreadsheet { width: 100%; height: 100%; }
        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border-radius: 5px;
            z-index: 999999;
        }
        .status.error { background: #dc3545; }
    </style>
</head>
<body>
    <div class="status" id="status">Loading...</div>
    <div id="spreadsheet"></div>

    <!-- X-Spreadsheet JS -->
    <script src="https://unpkg.com/x-data-spreadsheet@latest/dist/xspreadsheet.js"></script>

    <script>
        const status = document.getElementById('status');

        try {
            // Initialize x-spreadsheet
            const s = x_spreadsheet('#spreadsheet', {
                mode: 'edit',
                showToolbar: true,
                showGrid: true,
                showContextmenu: true,
                view: {
                    height: () => document.documentElement.clientHeight,
                    width: () => document.documentElement.clientWidth,
                },
                row: {
                    len: 100,
                    height: 25,
                },
                col: {
                    len: 26,
                    width: 100,
                    indexWidth: 60,
                    minWidth: 60,
                },
                style: {
                    bgcolor: '#ffffff',
                    align: 'left',
                    valign: 'middle',
                    textwrap: false,
                    strike: false,
                    underline: false,
                    color: '#0a0a0a',
                    font: {
                        name: 'Arial',
                        size: 10,
                        bold: false,
                        italic: false,
                    },
                },
            });

            // Load sample data
            s.loadData([
                {
                    name: '견적서',
                    freeze: 'A1',
                    styles: [
                        {
                            bgcolor: '#f4f5f8',
                            textwrap: true,
                            color: '#900b09',
                            border: {
                                top: ['thin', '#0366d6'],
                                bottom: ['thin', '#0366d6'],
                                right: ['thin', '#0366d6'],
                                left: ['thin', '#0366d6'],
                            },
                            font: {
                                bold: true,
                            },
                        },
                    ],
                    merges: [],
                    rows: {
                        0: { height: 30 },
                        len: 100,
                    },
                    cols: {
                        0: { width: 100 },
                        1: { width: 200 },
                        2: { width: 100 },
                        3: { width: 100 },
                        4: { width: 120 },
                        len: 20,
                    },
                    cells: {
                        0: {
                            0: { text: '품목코드', style: 0 },
                            1: { text: '품목명', style: 0 },
                            2: { text: '규격', style: 0 },
                            3: { text: '수량', style: 0 },
                            4: { text: '단가', style: 0 },
                            5: { text: '금액', style: 0 },
                        },
                        1: {
                            0: { text: 'MD-001' },
                            1: { text: '수술용 메스' },
                            2: { text: '일회용' },
                            3: { text: '100', type: 'number' },
                            4: { text: '5000', type: 'number' },
                            5: { text: '500000', type: 'number' },
                        },
                        2: {
                            0: { text: 'MD-002' },
                            1: { text: '의료용 거즈' },
                            2: { text: '10x10cm' },
                            3: { text: '500', type: 'number' },
                            4: { text: '1000', type: 'number' },
                            5: { text: '500000', type: 'number' },
                        },
                        3: {
                            0: { text: 'MD-003' },
                            1: { text: '주사기' },
                            2: { text: '5ml' },
                            3: { text: '200', type: 'number' },
                            4: { text: '3000', type: 'number' },
                            5: { text: '600000', type: 'number' },
                        },
                    },
                },
            ]);

            // Update status
            status.textContent = '✅ X-Spreadsheet is ready!';
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);

            console.log('✅ X-Spreadsheet initialized successfully!');

            // Store globally
            window.spreadsheet = s;

            // Flutter integration
            if (window.parent !== window) {
                window.parent.postMessage('xspreadsheet_ready', '*');
            }

            // Message handler
            window.addEventListener('message', function(event) {
                if (event.data && event.data.action === 'loadExcel') {
                    console.log('Loading Excel file:', event.data.filePath);
                    // Add Excel load logic here
                }

                if (event.data && event.data.action === 'getData') {
                    const data = s.getData();
                    window.parent.postMessage({ action: 'data', data: data }, '*');
                }
            });

            // Add change listener
            s.change = function(data) {
                console.log('Spreadsheet changed:', data);
                if (window.parent !== window) {
                    window.parent.postMessage({ action: 'change', data: data }, '*');
                }
            };

        } catch (error) {
            console.error('X-Spreadsheet init error:', error);
            status.textContent = '❌ Error: ' + error.message;
            status.className = 'status error';
        }
    </script>
</body>
</html>
