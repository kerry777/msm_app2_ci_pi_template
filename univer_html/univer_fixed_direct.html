<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 MSM Excel 뷰어 - 직접 수정 버전</title>

    <!-- Univer 0.1.17 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/design@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/ui@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/docs-ui@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-formula-ui@0.1.17/lib/index.css" />

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .back-button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .status {
            background: #e3f2fd;
            color: #1976d2;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
            font-weight: 500;
        }

        #univer {
            width: 100%;
            height: 700px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Univer 스타일 강제 표시 */
        .univer-container,
        [data-u-comp] {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        /* 스프레드시트 그리드 강제 표시 */
        .univer-render-canvas,
        .univer-canvas,
        .univer-grid,
        canvas {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏥 MSM Excel 뷰어 - 직접 수정 버전</h1>
        <div style="display: flex; align-items: center; gap: 16px;">
            <div id="status">시스템 초기화 중...</div>
            <button class="back-button" onclick="goBackToMain()">
                ← 메인 메뉴로 돌아가기
            </button>
        </div>
    </div>

    <div id="univer"></div>

    <!-- Univer 0.1.17 Scripts -->
    <script src="https://unpkg.com/@univerjs/core@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/design@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/docs@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/docs-ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-formula@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-formula-ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-numfmt@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/facade@0.1.17/lib/umd/index.js"></script>

    <script>
        function setStatus(message) {
            document.getElementById('status').textContent = message;
            console.log('📋 상태:', message);
        }

        function goBackToMain() {
            if (window.parent && window.parent !== window) {
                // iframe 내부에서 실행 중인 경우
                window.parent.postMessage('goBack', '*');
            } else {
                // 직접 브라우저에서 실행 중인 경우
                window.history.back();
            }
        }

        // 전역 getLocation 에러 방지
        Object.defineProperty(Object.prototype, 'getLocation', {
            value: function() {
                return {
                    startRow: 0,
                    startColumn: 0,
                    endRow: 0,
                    endColumn: 0
                };
            },
            writable: true,
            configurable: true,
            enumerable: false
        });

        console.log('🚀 MSM Univer 직접 수정 버전 초기화 시작');
        setStatus('🔧 Univer 모듈 로딩 중...');

        function waitForScripts() {
            const requiredModules = [
                'UniverCore',
                'UniverUi',
                'UniverSheets',
                'UniverSheetsUi'
            ];

            const missingModules = requiredModules.filter(module => typeof window[module] === 'undefined');

            if (missingModules.length > 0) {
                console.log('⏳ 모듈 로딩 대기 중:', missingModules);
                setTimeout(waitForScripts, 100);
                return;
            }

            console.log('✅ 모든 모듈 로드 완료');
            initUniver();
        }

        async function initUniver() {
            try {
                setStatus('🎯 Univer 인스턴스 생성 중...');

                const { createUniver, LocaleType, UniverInstanceType } = UniverCore;

                // Univer 인스턴스 생성 - 한국 시스템이므로 영어 사용
                const univer = createUniver({
                    locale: 'en-US',
                    theme: 'default'
                });

                console.log('✅ Univer 인스턴스 생성 완료:', univer);

                // 컨테이너 확인
                const container = document.getElementById('univer');
                if (!container) {
                    throw new Error('Univer 컨테이너를 찾을 수 없습니다');
                }

                setStatus('🔧 플러그인 등록 중...');

                // 1. UI 플러그인 등록
                univer.registerPlugin(UniverUi.UniverUIPlugin, {
                    container: container,
                    header: true,
                    toolbar: true,
                    footer: true
                });
                console.log('✅ UI 플러그인 등록 완료');

                // 2. Sheets 플러그인 등록
                univer.registerPlugin(UniverSheets.UniverSheetsPlugin);
                console.log('✅ Sheets 플러그인 등록 완료');

                // 3. Sheets UI 플러그인 등록
                univer.registerPlugin(UniverSheetsUi.UniverSheetsUIPlugin);
                console.log('✅ Sheets UI 플러그인 등록 완료');

                // 4. Formula 플러그인 등록 (선택적)
                try {
                    univer.registerPlugin(UniverSheetsFormula.UniverSheetsFormulaPlugin);
                    univer.registerPlugin(UniverSheetsFormulaUi.UniverSheetsFormulaUIPlugin);
                    console.log('✅ Formula 플러그인 등록 완료');
                } catch (e) {
                    console.warn('⚠️ Formula 플러그인 등록 실패 (선택적):', e.message);
                }

                setStatus('📊 워크북 생성 중...');

                // 워크북 데이터 생성
                const workbookData = {
                    id: 'msm-workbook',
                    locale: 'en-US',
                    name: 'MSM Excel Workbook',
                    sheetOrder: ['sheet-01'],
                    sheets: {
                        'sheet-01': {
                            id: 'sheet-01',
                            name: 'MSM 데이터',
                            cellData: {
                                0: {
                                    0: { v: '품목코드' },
                                    1: { v: '품목명' },
                                    2: { v: '수량' },
                                    3: { v: '단가' },
                                    4: { v: '금액' }
                                },
                                1: {
                                    0: { v: 'A001' },
                                    1: { v: '의료기기 A' },
                                    2: { v: 10 },
                                    3: { v: 50000 },
                                    4: { v: 500000 }
                                },
                                2: {
                                    0: { v: 'B002' },
                                    1: { v: '의료기기 B' },
                                    2: { v: 5 },
                                    3: { v: 80000 },
                                    4: { v: 400000 }
                                },
                                3: {
                                    0: { v: 'C003' },
                                    1: { v: '의료기기 C' },
                                    2: { v: 8 },
                                    3: { v: 30000 },
                                    4: { v: 240000 }
                                },
                                4: {
                                    0: { v: '' },
                                    1: { v: '합계' },
                                    2: { v: 23 },
                                    3: { v: '' },
                                    4: { v: 1140000 }
                                }
                            },
                            rowCount: 100,
                            columnCount: 20,
                            defaultRowHeight: 25,
                            defaultColumnWidth: 100
                        }
                    }
                };

                // 워크북 생성
                const workbook = univer.createUnit(UniverCore.UniverInstanceType.UNIVER_SHEET, workbookData);
                console.log('✅ 워크북 생성 완료:', workbook);

                setStatus('✅ MSM Excel 뷰어 준비 완료!');

                // 추가 확인
                setTimeout(() => {
                    const containerChildren = container.children.length;
                    console.log('🔍 컨테이너 자식 요소:', containerChildren);

                    if (containerChildren > 0) {
                        setStatus('🎉 MSM Excel 뷰어가 성공적으로 로드되었습니다!');

                        // Flutter에게 준비 완료 알림
                        if (window.FlutterChannel) {
                            window.FlutterChannel.postMessage('univer_ready');
                        }

                        // 일반 메시지도 전송
                        window.postMessage('univer_ready', '*');
                    } else {
                        console.warn('⚠️ UI 컴포넌트가 렌더링되지 않았습니다');
                        setStatus('⚠️ UI 렌더링 확인 중...');
                    }
                }, 2000);

            } catch (error) {
                console.error('❌ Univer 초기화 실패:', error);
                setStatus('❌ 초기화 실패: ' + error.message);
            }
        }

        // 스크립트 로딩 완료 후 초기화 시작
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', waitForScripts);
        } else {
            waitForScripts();
        }

        // 페이지 언로드 시 정리
        window.addEventListener('beforeunload', function() {
            console.log('🧹 Univer 정리 중...');
        });
    </script>
</body>
</html>
