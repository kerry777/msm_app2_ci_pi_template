<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 MSM Excel 뷰어 - 간단한 작동 버전</title>

    <!-- Univer CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/design@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/ui@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/docs-ui@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-formula-ui@0.1.17/lib/index.css" />

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .status {
            background: #e3f2fd;
            color: #1976d2;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
            font-weight: 500;
        }

        #app {
            width: 100%;
            height: 600px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* Univer 기본 스타일 오버라이드 */
        .univer-container {
            height: 100% !important;
        }

        /* 그리드가 표시되도록 강제 */
        .univer-render-canvas,
        .luckysheet-grid-container,
        .univer-grid,
        canvas {
            display: block !important;
            visibility: visible !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏥 MSM Excel 뷰어 - 간단한 작동 버전</h1>
        <p>Univer 기본 기능 테스트</p>
    </div>

    <div class="status" id="status">초기화 중...</div>

    <div id="app"></div>

    <!-- Univer Core Scripts -->
    <script src="https://unpkg.com/@univerjs/core@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/design@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/docs@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/docs-ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-formula@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-formula-ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-numfmt@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/facade@0.1.17/lib/umd/index.js"></script>

    <script>
        function setStatus(message) {
            document.getElementById('status').textContent = message;
            console.log('📋 상태:', message);
        }

        // 안전한 getLocation 메서드를 전역에 추가
        Object.defineProperty(Object.prototype, 'getLocation', {
            value: function() {
                return {
                    startRow: 0,
                    startColumn: 0,
                    endRow: 0,
                    endColumn: 0
                };
            },
            writable: true,
            configurable: true,
            enumerable: false
        });

        console.log('🚀 Univer 간단 버전 초기화 시작');
        setStatus('🔧 Univer 모듈 로딩 중...');

        function waitForScripts() {
            if (
                typeof UniverCore === 'undefined' ||
                typeof UniverUi === 'undefined' ||
                typeof UniverSheets === 'undefined' ||
                typeof UniverSheetsUi === 'undefined'
            ) {
                console.log('⏳ 스크립트 로딩 대기 중...');
                setTimeout(waitForScripts, 100);
                return;
            }

            console.log('✅ 모든 스크립트 로드 완료');
            initUniver();
        }

        function initUniver() {
            try {
                setStatus('🎯 Univer 인스턴스 생성 중...');

                const { createUniver, LocaleType } = UniverCore;

                // Univer 인스턴스 생성
                const univer = createUniver({
                    locale: LocaleType.ZH_CN,
                    theme: 'default'
                });

                console.log('✅ Univer 인스턴스 생성 완료');

                // 컨테이너 가져오기
                const container = document.getElementById('app');
                if (!container) {
                    throw new Error('앱 컨테이너를 찾을 수 없습니다');
                }

                // 플러그인 등록
                setStatus('🔧 플러그인 등록 중...');

                // UI 플러그인
                univer.registerPlugin(UniverUi.UniverUIPlugin, {
                    container: container,
                    header: true,
                    toolbar: true,
                    footer: true
                });

                // Sheets 플러그인
                univer.registerPlugin(UniverSheets.UniverSheetsPlugin);
                univer.registerPlugin(UniverSheetsUi.UniverSheetsUIPlugin);

                // Formula 플러그인 (선택적)
                try {
                    univer.registerPlugin(UniverSheetsFormula.UniverSheetsFormulaPlugin);
                    univer.registerPlugin(UniverSheetsFormulaUi.UniverSheetsFormulaUIPlugin);
                } catch (e) {
                    console.warn('⚠️ Formula 플러그인 등록 실패 (선택적):', e.message);
                }

                console.log('✅ 플러그인 등록 완료');

                // 워크북 생성
                setStatus('📊 워크북 생성 중...');

                const workbookData = {
                    id: 'msm-workbook',
                    locale: LocaleType.ZH_CN,
                    name: 'MSM Excel Workbook',
                    sheetOrder: ['sheet-01'],
                    sheets: {
                        'sheet-01': {
                            id: 'sheet-01',
                            name: 'MSM 데이터',
                            cellData: {
                                0: {
                                    0: { v: '품목코드' },
                                    1: { v: '품목명' },
                                    2: { v: '수량' },
                                    3: { v: '단가' },
                                    4: { v: '금액' }
                                },
                                1: {
                                    0: { v: 'A001' },
                                    1: { v: '의료기기 A' },
                                    2: { v: 10 },
                                    3: { v: 50000 },
                                    4: { v: 500000 }
                                },
                                2: {
                                    0: { v: 'B002' },
                                    1: { v: '의료기기 B' },
                                    2: { v: 5 },
                                    3: { v: 80000 },
                                    4: { v: 400000 }
                                },
                                3: {
                                    0: { v: 'C003' },
                                    1: { v: '의료기기 C' },
                                    2: { v: 8 },
                                    3: { v: 30000 },
                                    4: { v: 240000 }
                                },
                                4: {
                                    0: { v: '' },
                                    1: { v: '합계' },
                                    2: { v: 23 },
                                    3: { v: '' },
                                    4: { v: 1140000 }
                                }
                            },
                            rowCount: 100,
                            columnCount: 20,
                            defaultRowHeight: 25,
                            defaultColumnWidth: 100
                        }
                    }
                };

                // 워크북 생성 및 활성화
                univer.createUnit(UniverCore.UniverInstanceType.UNIVER_SHEET, workbookData);

                console.log('✅ 워크북 생성 완료');
                setStatus('✅ Univer Excel 뷰어 준비 완료!');

                // 성공 메시지
                setTimeout(() => {
                    setStatus('🎉 MSM Excel 뷰어가 성공적으로 로드되었습니다!');
                }, 1000);

            } catch (error) {
                console.error('❌ Univer 초기화 실패:', error);
                setStatus('❌ 초기화 실패: ' + error.message);
            }
        }

        // 스크립트 로딩 대기 시작
        waitForScripts();
    </script>
</body>
</html>
