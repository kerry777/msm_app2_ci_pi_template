<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSM Excel System - Complete Solution</title>

    <!-- getLocation 완벽한 해결 - 가장 먼저 실행 -->
    <script>
        // 1. Object.prototype에 getLocation 추가 (가장 중요!)
        if (!Object.prototype.getLocation) {
            Object.prototype.getLocation = function() {
                return {
                    pathname: '/',
                    search: '',
                    hash: '',
                    state: null,
                    key: 'default'
                };
            };
        }

        // 2. 전역 getLocation 함수
        window.getLocation = function() {
            return {
                pathname: '/',
                search: '',
                hash: '',
                state: null,
                key: 'global'
            };
        };

        // 3. history 객체에도 추가
        if (window.history && !window.history.getLocation) {
            window.history.getLocation = function() {
                return {
                    pathname: window.location.pathname,
                    search: window.location.search,
                    hash: window.location.hash,
                    state: this.state || null,
                    key: 'history'
                };
            };
        }
    </script>

    <!-- React 18 -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <!-- Univer 0.1.17 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/design@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/ui@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/index.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 13px;
            z-index: 999999;
            font-family: monospace;
            min-width: 250px;
        }
        .status.success {
            background: rgba(40, 167, 69, 0.9);
        }
        .status.error {
            background: rgba(220, 53, 69, 0.9);
        }
        .status.warning {
            background: rgba(255, 193, 7, 0.9);
            color: #333;
        }
    </style>
</head>
<body>
    <div class="status" id="status">🔄 Initializing...</div>
    <div id="app"></div>

    <!-- Univer 0.1.17 JavaScript -->
    <script src="https://unpkg.com/@univerjs/core@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/design@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/umd/index.js"></script>

    <script>
        // 상태 업데이트 함수
        function setStatus(msg, type = 'info') {
            const el = document.getElementById('status');
            if (el) {
                el.textContent = msg;
                el.className = 'status ' + type;
                console.log('[STATUS]', msg);
            }
        }

        // 에러 차단
        window.addEventListener('error', function(e) {
            if (e.message && e.message.includes('getLocation')) {
                console.warn('getLocation error blocked:', e.message);
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);

        // 콘솔 에러도 차단
        const originalError = console.error;
        console.error = function(...args) {
            const msg = args.join(' ');
            if (msg.includes('getLocation') || msg.includes('SelectionRenderService')) {
                console.warn('Blocked console error:', msg);
                return;
            }
            originalError.apply(console, args);
        };

        // DOM 로드 대기
        window.addEventListener('load', function() {
            setStatus('⏳ Waiting for Univer modules...', 'warning');

            // 모듈 로드 확인
            let checkCount = 0;
            const checkInterval = setInterval(function() {
                checkCount++;

                if (window.UniverCore && window.UniverCore.Univer &&
                    window.UniverUi && window.UniverSheets && window.UniverSheetsUi) {

                    clearInterval(checkInterval);
                    setStatus('📦 Modules loaded, initializing...', 'warning');
                    setTimeout(initUniver, 500);

                } else if (checkCount > 50) { // 5초 후 타임아웃
                    clearInterval(checkInterval);
                    setStatus('❌ Failed to load modules', 'error');
                    console.error('Univer modules not found after 5 seconds');
                }
            }, 100);
        });

        function initUniver() {
            try {
                setStatus('🚀 Creating Univer instance...', 'warning');

                // 모듈 확인
                if (!window.UniverCore || !window.UniverCore.Univer) {
                    throw new Error('UniverCore not found');
                }

                const { Univer, UniverInstanceType } = window.UniverCore;
                const { UniverUIPlugin } = window.UniverUi;
                const { UniverSheetsPlugin } = window.UniverSheets;
                const { UniverSheetsUIPlugin } = window.UniverSheetsUi;

                // Univer 인스턴스 생성
                const univer = new Univer({
                    locale: 'ko-KR' // 한국어 설정
                });

                setStatus('📋 Registering plugins...', 'warning');

                // 플러그인 등록
                univer.registerPlugin(UniverUIPlugin, {
                    container: document.getElementById('app')
                });
                univer.registerPlugin(UniverSheetsPlugin);
                univer.registerPlugin(UniverSheetsUIPlugin);

                setStatus('📊 Creating workbook...', 'warning');

                // 견적서 워크북 생성
                const workbook = univer.createUnit(UniverInstanceType.UNIVER_SHEET, {
                    id: 'workbook-01',
                    locale: 'ko-KR',
                    name: 'MSM 견적서',
                    sheetOrder: ['sheet-01'],
                    sheets: {
                        'sheet-01': {
                            id: 'sheet-01',
                            name: '견적서',
                            cellData: {
                                // 헤더 행
                                0: {
                                    0: { v: '품목코드', s: { bl: 1, ff: 'Arial', fs: 11 } },
                                    1: { v: '품목명', s: { bl: 1, ff: 'Arial', fs: 11 } },
                                    2: { v: '규격', s: { bl: 1, ff: 'Arial', fs: 11 } },
                                    3: { v: '수량', s: { bl: 1, ff: 'Arial', fs: 11 } },
                                    4: { v: '단가', s: { bl: 1, ff: 'Arial', fs: 11 } },
                                    5: { v: '금액', s: { bl: 1, ff: 'Arial', fs: 11 } },
                                    6: { v: '비고', s: { bl: 1, ff: 'Arial', fs: 11 } }
                                },
                                // 샘플 데이터
                                1: {
                                    0: { v: 'M001' },
                                    1: { v: '수술용 메스' },
                                    2: { v: '일회용' },
                                    3: { v: 100 },
                                    4: { v: 5000 },
                                    5: { v: 500000 },
                                    6: { v: '긴급' }
                                },
                                2: {
                                    0: { v: 'M002' },
                                    1: { v: '의료용 거즈' },
                                    2: { v: '10x10cm' },
                                    3: { v: 500 },
                                    4: { v: 1000 },
                                    5: { v: 500000 },
                                    6: { v: '' }
                                },
                                3: {
                                    0: { v: 'M003' },
                                    1: { v: '주사기' },
                                    2: { v: '5ml' },
                                    3: { v: 200 },
                                    4: { v: 3000 },
                                    5: { v: 600000 },
                                    6: { v: '' }
                                },
                                4: {
                                    0: { v: 'M004' },
                                    1: { v: '수액세트' },
                                    2: { v: '표준형' },
                                    3: { v: 150 },
                                    4: { v: 8000 },
                                    5: { v: 1200000 },
                                    6: { v: '재고확인' }
                                },
                                5: {
                                    0: { v: 'M005' },
                                    1: { v: '진단키트' },
                                    2: { v: 'COVID-19' },
                                    3: { v: 50 },
                                    4: { v: 15000 },
                                    5: { v: 750000 },
                                    6: { v: '예약주문' }
                                }
                            },
                            rowCount: 100,
                            columnCount: 20,
                            // 열 너비 설정
                            columnData: {
                                0: { w: 100 }, // 품목코드
                                1: { w: 200 }, // 품목명
                                2: { w: 100 }, // 규격
                                3: { w: 80 },  // 수량
                                4: { w: 100 }, // 단가
                                5: { w: 120 }, // 금액
                                6: { w: 150 }  // 비고
                            },
                            // 행 높이 설정
                            rowData: {
                                0: { h: 30 } // 헤더 행
                            }
                        }
                    }
                });

                setStatus('✅ Excel Viewer Ready!', 'success');

                // 전역 변수 설정
                window.univer = univer;
                window.workbook = workbook;

                // Flutter 알림
                if (window.parent !== window) {
                    window.parent.postMessage('univer_ready', '*');
                }

                // 디버깅 정보
                console.log('✅ Univer initialized successfully!');
                console.log('Canvas elements:', document.querySelectorAll('canvas').length);
                console.log('Grid elements:', document.querySelectorAll('[class*="grid"]').length);
                console.log('Sheet container:', document.querySelector('.univer-sheet-container'));

                // 상태 메시지 자동 숨김
                setTimeout(() => {
                    const statusEl = document.getElementById('status');
                    if (statusEl && statusEl.textContent.includes('Ready')) {
                        statusEl.style.display = 'none';
                    }
                }, 5000);

            } catch (error) {
                console.error('Initialization failed:', error);
                setStatus('❌ Error: ' + error.message, 'error');
            }
        }

        // Flutter 메시지 처리
        window.addEventListener('message', function(event) {
            console.log('Received message:', event.data);

            if (event.data && event.data.action === 'loadExcel') {
                setStatus('📁 Loading Excel file...', 'warning');
                // Excel 로드 로직 추가 예정
            }
        });

        // 추가 getLocation 보호 (주기적 재패치)
        setInterval(function() {
            if (!Object.prototype.getLocation) {
                Object.prototype.getLocation = function() {
                    return {
                        pathname: '/',
                        search: '',
                        hash: '',
                        state: null,
                        key: 'refresh'
                    };
                };
            }
        }, 1000);
    </script>
</body>
</html>
