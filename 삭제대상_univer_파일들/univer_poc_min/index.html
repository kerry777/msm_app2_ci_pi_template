<head>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; line-height:1.5; padding:16px; }
    #log { white-space: pre-wrap; background:#111; color:#ddd; padding:12px; border-radius:8px; max-height:40vh; overflow:auto; }
    .ok { color:#8bf18b; } .warn{ color:#ffd37a; } .err{ color:#ff8c8c; }
    #app { margin-top:16px; border:1px solid #ddd; padding:12px; border-radius:8px; min-height:120px; }
