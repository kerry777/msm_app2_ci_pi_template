<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univer Excel - Final Working Version</title>

    <!-- Univer UMD Build - Complete Bundle -->
    <script src="https://unpkg.com/@univerjs/umd@0.1.17/lib/univer.full.umd.js"></script>
    <script src="https://unpkg.com/@univerjs/umd@0.1.17/lib/locale/en-US.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/umd@0.1.17/lib/univer.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
        }

        #app {
            position: absolute;
            width: 100%;
            height: 100vh;
            left: 0;
            top: 0;
        }

        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border-radius: 5px;
            font-size: 14px;
            z-index: 999999;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.error {
            background: #dc3545;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="status" id="status">Loading...</div>

    <script>
        // Show status
        const status = document.getElementById('status');
        status.className = 'status show';

        try {
            // Get Univer components from window
            const {
                UniverCore,
                UniverDesign,
                UniverEngineRender,
                UniverEngineFormula,
                UniverSheetsFormulaUi,
                UniverDocs,
                UniverDocsUi,
                UniverUi,
                UniverSheets,
                UniverSheetsUi,
                UniverSheetsNumfmt,
                UniverSheetsFormula,
                UniverFacade,
            } = window;

            console.log('Univer components loaded:', {
                Core: !!UniverCore,
                UI: !!UniverUi,
                Sheets: !!UniverSheets
            });

            // Initialize Univer
            const univer = new UniverCore.Univer({
                theme: UniverDesign.defaultTheme,
                locale: UniverCore.LocaleType.EN_US,
                locales: {
                    [UniverCore.LocaleType.EN_US]: UniverUMD['en-US'],
                },
            });

            // Register required plugins
            univer.registerPlugin(UniverEngineRender.UniverRenderEnginePlugin);
            univer.registerPlugin(UniverEngineFormula.UniverFormulaEnginePlugin);

            univer.registerPlugin(UniverUi.UniverUIPlugin, {
                container: 'app',
                header: true,
                toolbar: true,
                footer: false
            });

            univer.registerPlugin(UniverDocs.UniverDocsPlugin);
            univer.registerPlugin(UniverDocsUi.UniverDocsUIPlugin);

            univer.registerPlugin(UniverSheets.UniverSheetsPlugin);
            univer.registerPlugin(UniverSheetsUi.UniverSheetsUIPlugin);
            univer.registerPlugin(UniverSheetsNumfmt.UniverSheetsNumfmtPlugin);
            univer.registerPlugin(UniverSheetsFormula.UniverSheetsFormulaPlugin);
            univer.registerPlugin(UniverSheetsFormulaUi.UniverSheetsFormulaUiPlugin);

            // Create workbook with sample data
            const workbookData = {
                id: 'msm-workbook',
                name: 'MSM 견적서',
                appVersion: '0.1.17',
                sheets: {
                    'sheet-01': {
                        id: 'sheet-01',
                        name: '견적서',
                        cellData: {
                            0: {
                                0: { v: '품목코드', s: { bl: 1 } },
                                1: { v: '품목명', s: { bl: 1 } },
                                2: { v: '규격', s: { bl: 1 } },
                                3: { v: '수량', s: { bl: 1 } },
                                4: { v: '단가', s: { bl: 1 } },
                                5: { v: '금액', s: { bl: 1 } },
                                6: { v: '비고', s: { bl: 1 } }
                            },
                            1: {
                                0: { v: 'MD-001' },
                                1: { v: '수술용 메스' },
                                2: { v: '일회용' },
                                3: { v: 100 },
                                4: { v: 5000 },
                                5: { v: 500000 },
                                6: { v: '긴급' }
                            },
                            2: {
                                0: { v: 'MD-002' },
                                1: { v: '의료용 거즈' },
                                2: { v: '10x10cm' },
                                3: { v: 500 },
                                4: { v: 1000 },
                                5: { v: 500000 },
                                6: { v: '' }
                            },
                            3: {
                                0: { v: 'MD-003' },
                                1: { v: '주사기' },
                                2: { v: '5ml' },
                                3: { v: 200 },
                                4: { v: 3000 },
                                5: { v: 600000 },
                                6: { v: '' }
                            },
                            4: {
                                0: { v: 'MD-004' },
                                1: { v: '수액세트' },
                                2: { v: '표준형' },
                                3: { v: 150 },
                                4: { v: 8000 },
                                5: { v: 1200000 },
                                6: { v: '재고확인' }
                            }
                        },
                        rowCount: 1000,
                        columnCount: 20,
                        columnData: {
                            0: { w: 100 },
                            1: { w: 200 },
                            2: { w: 100 },
                            3: { w: 80 },
                            4: { w: 100 },
                            5: { w: 120 },
                            6: { w: 150 }
                        },
                        rowData: {
                            0: { h: 30 }
                        }
                    }
                }
            };

            // Create the spreadsheet
            univer.createUnit(UniverCore.UniverInstanceType.UNIVER_SHEET, workbookData);

            // Update status
            status.textContent = '✅ Univer Excel is Ready!';
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);

            // Store globally for debugging
            window.univer = univer;

            console.log('✅ Univer initialized successfully!');

            // Flutter integration
            if (window.parent !== window) {
                window.parent.postMessage('univer_ready', '*');
            }

            // Flutter message handler
            window.addEventListener('message', function(event) {
                if (event.data && event.data.action === 'loadExcel') {
                    console.log('Loading Excel file:', event.data.filePath);
                    // Excel load logic here
                }
            });

        } catch (error) {
            console.error('Univer initialization error:', error);
            status.textContent = '❌ Error: ' + error.message;
            status.className = 'status show error';
        }
    </script>
</body>
</html>
