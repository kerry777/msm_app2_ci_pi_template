<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Univer Excel 뷰어 - 원본 파일 로딩</title>
    <style>
        html, body, #univer-container {
            height: 100%;
            margin: 0;
        }
        #toolbar {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 99;
            background: #ffffffcc;
            border-radius: 8px;
            padding: 6px 10px;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }
        #toolbar button {
            margin-right: 6px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
        #toolbar button:hover {
            background: #f0f0f0;
        }
        input[type=file] {
            display: none;
        }
        #status {
            position: fixed;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>

    <!-- Univer CDN (최신 안정 버전) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/rxjs/dist/bundles/rxjs.umd.min.js"></script>
    <script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script>

    <!-- Univer Core 라이브러리들 -->
    <script src="https://unpkg.com/@univerjs/core@latest/dist/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/engine-render@latest/dist/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets@latest/dist/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-ui@latest/dist/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-formula@latest/dist/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/xlsx@latest/dist/umd/index.js"></script>
    
    <!-- 스타일시트 -->
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-ui@latest/dist/index.css" />
    <script src="https://unpkg.com/xlsx@0.20.3/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div id="univer-container"></div>

    <div id="toolbar">
        <button onclick="loadAsset('assets/excel_templates/quotation_kr.xlsx')">📄 견적서</button>
        <button onclick="loadAsset('assets/excel_templates/pi_template.xlsx')">📋 PI</button>
        <button onclick="loadAsset('assets/excel_templates/commercial_invoice.xlsx')">💼 상업송장</button>
        <button onclick="loadAsset('assets/excel_templates/packing_list.xlsx')">📦 포장목록</button>
        <button onclick="triggerFilePicker()">📁 파일 열기</button>
        <button onclick="exportXlsx()">💾 저장</button>
        <input id="fileInput" type="file" accept=".xlsx" />
    </div>

    <div id="status">Univer 로딩 중...</div>

    <script>
        console.log('🚀 Univer Excel 뷰어 시작...');

        // 전역 객체 확인
        console.log('window.UniverPresets:', typeof window.UniverPresets);
        console.log('window.UniverCore:', typeof window.UniverCore);
        console.log('window.UniverPresetSheetsCore:', typeof window.UniverPresetSheetsCore);

        // Univer 초기화 (새로운 API 구조)
        setTimeout(async () => {
            try {
                // 전역 객체 확인
                console.log('window.UniverCore:', typeof window.UniverCore);
                console.log('window.UniverSheets:', typeof window.UniverSheets);
                console.log('window.UniverSheetsUI:', typeof window.UniverSheetsUI);
                console.log('window.UniverXLSX:', typeof window.UniverXLSX);

                if (typeof window.UniverCore === 'undefined') {
                    throw new Error('UniverCore가 로드되지 않았습니다');
                }

                // Univer 인스턴스 생성
                const univer = new window.UniverCore.Univer();

                // 플러그인 등록
                univer.registerPlugin(window.UniverEngineRender.UniverEngineRenderPlugin, {
                    container: 'univer-container',
                });
                univer.registerPlugin(window.UniverSheets.UniverSheetsPlugin);
                univer.registerPlugin(window.UniverSheetsUI.UniverSheetsUIPlugin);
                univer.registerPlugin(window.UniverFormula.UniverFormulaPlugin);
                univer.registerPlugin(window.UniverXLSX.UniverXLSXPlugin);

                // 워크북 생성
                const workbook = univer.createUniverSheet();
                
                // 전역 변수로 저장
                window.univer = univer;
                window.univerAPI = {
                    getActiveWorkbook: () => workbook,
                    createWorkbook: (options) => {
                        console.log('워크북 생성:', options);
                        return workbook;
                    },
                    exportWorkbook: async (format) => {
                        if (format === 'xlsx') {
                            const xlsxPlugin = univer.getPluginByName('UniverXLSXPlugin');
                            if (xlsxPlugin && xlsxPlugin.save) {
                                return await xlsxPlugin.save();
                            }
                        }
                        throw new Error('지원하지 않는 형식: ' + format);
                    }
                };

                updateStatus('✅ MSM Excel 뷰어 준비 완료');

                // Flutter에 준비 완료 알림
                if (window.FlutterChannel) {
                    FlutterChannel.postMessage('univer_ready');
                }

            } catch (error) {
                console.error('❌ Univer 초기화 실패:', error);
                updateStatus('❌ 초기화 실패: ' + error.message);
            }
        }, 2000);

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log(message);
        }

        function toBase64(uint8) {
            let binary = '';
            const chunk = 0x8000;
            for (let i = 0; i < uint8.length; i += chunk) {
                const sub = uint8.subarray(i, i + chunk);
                binary += String.fromCharCode.apply(null, sub);
            }
            return btoa(binary);
        }

        async function loadExcelFromArrayBuffer(buffer, filename = 'Excel 파일') {
            try {
                updateStatus(`📁 ${filename} 로딩 중...`);

                if (!window.univerAPI) {
                    throw new Error('Univer API를 찾을 수 없습니다');
                }

                if (typeof XLSX === 'undefined') {
                    throw new Error('XLSX 라이브러리가 로드되지 않았습니다');
                }

                // XLSX로 파일 파싱
                const workbook = XLSX.read(new Uint8Array(buffer), {
                    type: 'array',
                    cellDates: true,
                    codepage: 65001  // UTF-8 인코딩
                });

                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, {
                    header: 1,
                    raw: false,  // 한글 처리를 위해
                    defval: null
                });

                if (jsonData.length === 0) {
                    throw new Error('빈 파일이거나 읽을 수 있는 데이터가 없습니다');
                }

                // 안전한 크기로 제한
                const maxRows = Math.min(jsonData.length, 200);
                const maxCols = Math.min(Math.max(...jsonData.map(row => row ? row.length : 0)), 100);

                // 데이터 정규화
                const normalizedData = Array.from({ length: maxRows }, (_, rowIndex) => {
                    const row = jsonData[rowIndex] || [];
                    return Array.from({ length: maxCols }, (_, colIndex) => {
                        const value = row[colIndex];
                        return (value === undefined || value === '') ? null : value;
                    });
                });

                // Univer에 데이터 입력
                const activeWorkbook = window.univerAPI.getActiveWorkbook();
                const activeSheet = activeWorkbook.getActiveSheet();
                const range = activeSheet.getRange(0, 0, maxRows, maxCols);
                range.setValues(normalizedData);

                updateStatus(`✅ ${filename} 로딩 완료 (${maxRows}x${maxCols})`);
                console.log(`Excel 데이터 로드 완료: ${maxRows}행 x ${maxCols}열`);

                // Flutter에 알림
                if (window.FlutterChannel) {
                    FlutterChannel.postMessage('excel_loaded:' + filename);
                }

                return true;
            } catch (error) {
                console.error('Excel 로딩 오류:', error);
                updateStatus(`❌ ${filename} 로딩 실패: ${error.message}`);

                if (window.FlutterChannel) {
                    FlutterChannel.postMessage('excel_error:' + error.message);
                }

                return false;
            }
        }

        async function loadAsset(path) {
            try {
                updateStatus(`🔄 ${path} 가져오는 중...`);

                const response = await fetch(path);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${path}를 찾을 수 없습니다`);
                }

                const buffer = await response.arrayBuffer();
                const filename = path.split('/').pop();

                return await loadExcelFromArrayBuffer(buffer, filename);
            } catch (error) {
                console.error('Asset 로딩 오류:', error);
                updateStatus(`❌ Asset 로딩 실패: ${error.message}`);
                return false;
            }
        }

        async function getXlsxBytes() {
            try {
                // Univer API를 사용하여 Excel 내보내기
                if (!window.univerAPI) {
                    throw new Error('Univer API를 찾을 수 없습니다');
                }

                // 현재 활성 워크북을 Excel로 내보내기
                const blob = await window.univerAPI.exportWorkbook('xlsx');
                const arrayBuffer = await blob.arrayBuffer();
                return new Uint8Array(arrayBuffer);
            } catch (error) {
                console.error('Excel 내보내기 오류:', error);
                throw new Error('Excel 내보내기 실패: ' + error.message);
            }
        }

        async function exportXlsx() {
            try {
                updateStatus('💾 Excel 저장 중...');

                const bytes = await getXlsxBytes();
                const b64 = toBase64(bytes);

                if (window.FlutterChannel) {
                    FlutterChannel.postMessage('download:xlsx:' + b64);
                } else {
                    // 브라우저에서 직접 다운로드
                    const blob = new Blob([bytes], {
                        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                    });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'export.xlsx';
                    a.click();
                    URL.revokeObjectURL(a.href);
                }

                updateStatus('✅ Excel 저장 완료');
            } catch (error) {
                console.error('Excel 저장 오류:', error);
                updateStatus(`❌ Excel 저장 실패: ${error.message}`);

                if (window.FlutterChannel) {
                    FlutterChannel.postMessage('error:' + error.message);
                }
            }
        }

        function triggerFilePicker() {
            const input = document.getElementById('fileInput');
            input.value = '';
            input.click();
        }

        // 파일 선택 이벤트
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            const buffer = await file.arrayBuffer();
            await loadExcelFromArrayBuffer(buffer, file.name);
        });

        // Flutter ↔ WebView 메시지 브리지
        window.addEventListener('message', async (event) => {
            const { action, data } = event.data || {};

            if (action === 'triggerFilePicker') {
                return triggerFilePicker();
            }
            if (action === 'exportXlsx') {
                return exportXlsx();
            }
            if (action === 'loadExcelAsset' && data && data.path) {
                return loadAsset(data.path);
            }
            if (action === 'getXlsxBase64') {
                try {
                    const bytes = await getXlsxBytes();
                    const b64 = toBase64(bytes);
                    if (window.FlutterChannel) {
                        FlutterChannel.postMessage('return:xlsx:' + b64);
                    }
                } catch (error) {
                    if (window.FlutterChannel) {
                        FlutterChannel.postMessage('error:' + error.message);
                    }
                }
            }
        });

        // Flutter 준비 완료 알림
        if (window.parent && window.parent !== window) {
            window.parent.postMessage('univer_ready', '*');
        }

        console.log('✅ Univer Excel 뷰어 준비 완료');
    </script>
</body>
</html>
