<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univer Excel - 최종 작동 버전</title>

    <!-- Univer Styles -->
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/design@0.1.17/lib/index.css">
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/ui@0.1.17/lib/index.css">
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/index.css">
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-formula@0.1.17/lib/index.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border-radius: 5px;
            z-index: 999999;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .status.loading { background: #FFC107; color: #333; }
        .status.error { background: #F44336; }
        .status.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="status loading" id="status">Univer 초기화 중...</div>
    <div id="app"></div>

    <!-- Import Map for ES Modules -->
    <script type="importmap">
    {
        "imports": {
            "clsx": "https://unpkg.com/clsx@2.1.1/dist/clsx.mjs",
            "react": "https://esm.sh/react@18.3.1",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "rxjs": "https://esm.sh/rxjs@7.8.1",
            "rxjs/operators": "https://esm.sh/rxjs@7.8.1/operators",
            "@wendellhu/redi": "https://esm.sh/@wendellhu/redi@0.16.4",
            "@wendellhu/redi/react-bindings": "https://esm.sh/@wendellhu/redi@0.16.4/react-bindings",
            "@univerjs/core": "https://unpkg.com/@univerjs/core@0.1.17/lib/es/index.js",
            "@univerjs/design": "https://unpkg.com/@univerjs/design@0.1.17/lib/es/index.js",
            "@univerjs/engine-formula": "https://unpkg.com/@univerjs/engine-formula@0.1.17/lib/es/index.js",
            "@univerjs/engine-render": "https://unpkg.com/@univerjs/engine-render@0.1.17/lib/es/index.js",
            "@univerjs/sheets": "https://unpkg.com/@univerjs/sheets@0.1.17/lib/es/index.js",
            "@univerjs/sheets-formula": "https://unpkg.com/@univerjs/sheets-formula@0.1.17/lib/es/index.js",
            "@univerjs/sheets-ui": "https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/es/index.js",
            "@univerjs/ui": "https://unpkg.com/@univerjs/ui@0.1.17/lib/es/index.js"
        }
    }
    </script>

    <script type="module">
        import { Univer, UniverInstanceType, LocaleType } from '@univerjs/core';
        import { defaultTheme } from '@univerjs/design';
        import { UniverFormulaEnginePlugin } from '@univerjs/engine-formula';
        import { UniverRenderEnginePlugin } from '@univerjs/engine-render';
        import { UniverSheetsPlugin } from '@univerjs/sheets';
        import { UniverSheetsFormulaPlugin } from '@univerjs/sheets-formula';
        // import { UniverSheetsFormulaUIPlugin } from '@univerjs/sheets-formula-ui';
        import { UniverSheetsUIPlugin } from '@univerjs/sheets-ui';
        import { UniverUIPlugin } from '@univerjs/ui';

        const status = document.getElementById('status');

        function setStatus(msg, type = 'loading') {
            status.textContent = msg;
            status.className = 'status ' + type;
            console.log('[Univer]', msg);
        }

        async function initUniver() {
            try {
                setStatus('Univer 모듈 로딩 중...', 'loading');

                // Univer 인스턴스 생성
                const univer = new Univer({
                    theme: defaultTheme,
                    locale: LocaleType.EN_US,
                    logLevel: 2
                });

                setStatus('플러그인 등록 중...', 'loading');

                // 필수 플러그인 등록
                univer.registerPlugin(UniverRenderEnginePlugin);
                univer.registerPlugin(UniverFormulaEnginePlugin);
                univer.registerPlugin(UniverUIPlugin, {
                    container: document.getElementById('app'),
                });
                univer.registerPlugin(UniverSheetsPlugin);
                univer.registerPlugin(UniverSheetsUIPlugin);
                univer.registerPlugin(UniverSheetsFormulaPlugin);
                // univer.registerPlugin(UniverSheetsFormulaUIPlugin);

                setStatus('워크북 생성 중...', 'loading');

                // MSM 견적서 워크북 생성
                const workbook = univer.createUnit(UniverInstanceType.UNIVER_SHEET, {
                    id: 'msm-workbook',
                    name: 'MSM 의료용품 견적서',
                    appVersion: '1.0.0',
                    sheets: {
                        'sheet1': {
                            id: 'sheet1',
                            name: '견적서',
                            rowCount: 100,
                            columnCount: 20,
                            rowData: {
                                0: { h: 30, hd: false },
                                1: { h: 25, hd: false },
                            },
                            columnData: {
                                0: { w: 100, hd: false },
                                1: { w: 200, hd: false },
                                2: { w: 100, hd: false },
                                3: { w: 80, hd: false },
                                4: { w: 100, hd: false },
                                5: { w: 120, hd: false },
                                6: { w: 150, hd: false },
                            },
                            cellData: {
                                0: {
                                    0: {
                                        v: '품목코드',
                                        s: { bl: 1, bg: { rgb: '#e3f2fd' } }
                                    },
                                    1: {
                                        v: '품목명',
                                        s: { bl: 1, bg: { rgb: '#e3f2fd' } }
                                    },
                                    2: {
                                        v: '규격',
                                        s: { bl: 1, bg: { rgb: '#e3f2fd' } }
                                    },
                                    3: {
                                        v: '수량',
                                        s: { bl: 1, bg: { rgb: '#e3f2fd' } }
                                    },
                                    4: {
                                        v: '단가',
                                        s: { bl: 1, bg: { rgb: '#e3f2fd' } }
                                    },
                                    5: {
                                        v: '금액',
                                        s: { bl: 1, bg: { rgb: '#e3f2fd' } }
                                    },
                                    6: {
                                        v: '비고',
                                        s: { bl: 1, bg: { rgb: '#e3f2fd' } }
                                    }
                                },
                                1: {
                                    0: { v: 'MD-001' },
                                    1: { v: '수술용 메스' },
                                    2: { v: '일회용' },
                                    3: { v: 100 },
                                    4: { v: 5000 },
                                    5: {
                                        f: '=D2*E2',
                                        v: 500000
                                    },
                                    6: { v: '긴급' }
                                },
                                2: {
                                    0: { v: 'MD-002' },
                                    1: { v: '의료용 거즈' },
                                    2: { v: '10x10cm' },
                                    3: { v: 500 },
                                    4: { v: 1000 },
                                    5: {
                                        f: '=D3*E3',
                                        v: 500000
                                    },
                                    6: { v: '' }
                                },
                                3: {
                                    0: { v: 'MD-003' },
                                    1: { v: '주사기' },
                                    2: { v: '5ml' },
                                    3: { v: 200 },
                                    4: { v: 3000 },
                                    5: {
                                        f: '=D4*E4',
                                        v: 600000
                                    },
                                    6: { v: '' }
                                },
                                4: {
                                    0: { v: 'MD-004' },
                                    1: { v: '수액세트' },
                                    2: { v: '표준형' },
                                    3: { v: 150 },
                                    4: { v: 8000 },
                                    5: {
                                        f: '=D5*E5',
                                        v: 1200000
                                    },
                                    6: { v: '재고확인' }
                                },
                                5: {
                                    0: { v: 'MD-005' },
                                    1: { v: '진단키트' },
                                    2: { v: 'COVID-19' },
                                    3: { v: 50 },
                                    4: { v: 15000 },
                                    5: {
                                        f: '=D6*E6',
                                        v: 750000
                                    },
                                    6: { v: '예약주문' }
                                },
                                7: {
                                    4: {
                                        v: '합계:',
                                        s: { bl: 1, bg: { rgb: '#fff9c4' } }
                                    },
                                    5: {
                                        f: '=SUM(F2:F6)',
                                        v: 3550000,
                                        s: { bl: 1, bg: { rgb: '#fff9c4' } }
                                    }
                                }
                            }
                        }
                    }
                });

                // 전역 변수로 저장
                window.univer = univer;
                window.workbook = workbook;

                setStatus('✅ Univer Excel 준비 완료!', '');

                // 3초 후 상태 메시지 숨기기
                setTimeout(() => {
                    status.classList.add('hidden');
                }, 3000);

                // 렌더링 확인
                setTimeout(() => {
                    const app = document.getElementById('app');
                    console.log('렌더링 확인:', {
                        자식요소: app.children.length,
                        캔버스: app.querySelectorAll('canvas').length,
                        Univer요소: app.querySelectorAll('[class*="univer"]').length,
                        전체높이: app.offsetHeight
                    });

                    // Flutter 통합
                    if (window.parent !== window) {
                        window.parent.postMessage('univer_ready', '*');
                    }
                }, 1000);

            } catch (error) {
                console.error('Univer 초기화 오류:', error);
                setStatus('❌ 오류: ' + error.message, 'error');
            }
        }

        // 초기화 시작
        initUniver();

        // Flutter 메시지 핸들러
        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'loadExcel') {
                console.log('Excel 파일 로드 요청:', event.data);
            }
        });
    </script>
</body>
</html>
