<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univer Excel - ChatGPT 해결 버전</title>

    <!-- Univer CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/design@0.1.17/lib/index.css">
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/ui@0.1.17/lib/index.css">
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/index.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100vh; overflow: hidden; }
        #app { width: 100%; height: 100%; }
        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border-radius: 5px;
            z-index: 999999;
        }
        .status.error { background: #dc3545; }
    </style>
</head>
<body>
    <div class="status" id="status">Univer 로딩 중...</div>
    <div id="app"></div>

    <!-- React & RxJS 의존성 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/rxjs@7/dist/bundles/rxjs.umd.min.js"></script>

    <!-- Univer Core -->
    <script src="https://unpkg.com/@univerjs/protocol@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/core@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/design@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/engine-render@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/engine-formula@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-formula@0.1.17/lib/umd/index.js"></script>

    <script>
        const status = document.getElementById('status');

        // getLocation 에러 방지
        window.getLocation = () => ({ pathname: '/', search: '', hash: '', state: null });
        if (typeof Object.prototype.getLocation === 'undefined') {
            Object.defineProperty(Object.prototype, 'getLocation', {
                value: function() { return { pathname: '/', search: '', hash: '', state: null }; },
                writable: true,
                enumerable: false,
                configurable: true
            });
        }

        window.addEventListener('load', async function() {
            try {
                status.textContent = 'Univer 모듈 확인 중...';

                // 모듈 확인
                const modules = [
                    'UniverCore',
                    'UniverDesign',
                    'UniverEngineRender',
                    'UniverEngineFormula',
                    'UniverUi',
                    'UniverSheets',
                    'UniverSheetsUi',
                    'UniverSheetsFormula'
                ];

                for (const module of modules) {
                    if (!window[module]) {
                        throw new Error(`${module} 모듈이 로드되지 않았습니다`);
                    }
                }

                status.textContent = 'Univer 초기화 중...';

                // Univer 초기화
                const { Univer, UniverInstanceType, LocaleType } = window.UniverCore;
                const { defaultTheme } = window.UniverDesign;
                const { UniverRenderEnginePlugin } = window.UniverEngineRender;
                const { UniverFormulaEnginePlugin } = window.UniverEngineFormula;
                const { UniverUIPlugin } = window.UniverUi;
                const { UniverSheetsPlugin } = window.UniverSheets;
                const { UniverSheetsUIPlugin } = window.UniverSheetsUi;
                const { UniverSheetsFormulaPlugin } = window.UniverSheetsFormula;

                // Univer 인스턴스 생성
                const univer = new Univer({
                    theme: defaultTheme,
                    locale: LocaleType.EN_US
                });

                // 플러그인 등록
                univer.registerPlugin(UniverRenderEnginePlugin);
                univer.registerPlugin(UniverFormulaEnginePlugin);
                univer.registerPlugin(UniverUIPlugin, {
                    container: document.getElementById('app')
                });
                univer.registerPlugin(UniverSheetsPlugin);
                univer.registerPlugin(UniverSheetsUIPlugin);
                univer.registerPlugin(UniverSheetsFormulaPlugin);

                status.textContent = '워크북 생성 중...';

                // 워크북 생성
                const workbook = univer.createUnit(UniverInstanceType.UNIVER_SHEET, {
                    id: 'workbook-msm',
                    name: 'MSM 견적서',
                    appVersion: '1.0.0',
                    sheetOrder: ['sheet-01'],
                    sheets: {
                        'sheet-01': {
                            id: 'sheet-01',
                            name: '견적서',
                            rowCount: 100,
                            columnCount: 20,
                            cellData: {
                                0: {
                                    0: { v: '품목코드' },
                                    1: { v: '품목명' },
                                    2: { v: '규격' },
                                    3: { v: '수량' },
                                    4: { v: '단가' },
                                    5: { v: '금액' },
                                    6: { v: '비고' }
                                },
                                1: {
                                    0: { v: 'MD-001' },
                                    1: { v: '수술용 메스' },
                                    2: { v: '일회용' },
                                    3: { v: 100 },
                                    4: { v: 5000 },
                                    5: { v: 500000 },
                                    6: { v: '긴급' }
                                },
                                2: {
                                    0: { v: 'MD-002' },
                                    1: { v: '의료용 거즈' },
                                    2: { v: '10x10cm' },
                                    3: { v: 500 },
                                    4: { v: 1000 },
                                    5: { v: 500000 }
                                },
                                3: {
                                    0: { v: 'MD-003' },
                                    1: { v: '주사기' },
                                    2: { v: '5ml' },
                                    3: { v: 200 },
                                    4: { v: 3000 },
                                    5: { v: 600000 }
                                }
                            },
                            columnData: {
                                0: { w: 100 },
                                1: { w: 200 },
                                2: { w: 100 },
                                3: { w: 80 },
                                4: { w: 100 },
                                5: { w: 120 },
                                6: { w: 150 }
                            }
                        }
                    }
                });

                // 전역 변수 저장
                window.univer = univer;
                window.workbook = workbook;

                status.textContent = '✅ Univer Excel 준비 완료!';
                status.className = 'status';

                console.log('✅ Univer 초기화 성공!');

                // 3초 후 상태 숨기기
                setTimeout(() => {
                    status.style.display = 'none';
                }, 3000);

                // 렌더링 확인
                setTimeout(() => {
                    const app = document.getElementById('app');
                    console.log('렌더링 상태:', {
                        자식요소: app.children.length,
                        캔버스: app.querySelectorAll('canvas').length,
                        Univer요소: app.querySelectorAll('[class*="univer"]').length
                    });
                }, 2000);

            } catch (error) {
                console.error('Univer 초기화 실패:', error);
                status.textContent = '❌ 오류: ' + error.message;
                status.className = 'status error';
            }
        });
    </script>
</body>
</html>
