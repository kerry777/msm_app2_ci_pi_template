<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 MSM Excel 뷰어 - 안전 작동 버전</title>

    <!-- Univer CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/design@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/ui@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/index.css" />

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .status {
            background: #e3f2fd;
            color: #1976d2;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
            font-weight: 500;
        }

        #app {
            width: 100%;
            height: 600px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .univer-container {
            height: 100% !important;
            width: 100% !important;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #dc3545;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏥 MSM Excel 뷰어 - 안전 작동 버전</h1>
        <p>에러 처리 강화된 안정 버전</p>
    </div>

    <div class="status" id="status">시스템 초기화 중...</div>

    <div id="app"></div>

    <!-- Univer Scripts -->
    <script src="https://unpkg.com/@univerjs/core@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/design@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/umd/index.js"></script>

    <script>
        function setStatus(message, isError = false) {
            const statusElement = document.getElementById('status');
            statusElement.textContent = message;
            statusElement.className = isError ? 'error' : 'status';
            console.log(isError ? '❌ 에러:' : '📋 상태:', message);
        }

        function addError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            document.body.insertBefore(errorDiv, document.getElementById('app'));
        }

        console.log('🚀 MSM 안전 작동 버전 시작');
        setStatus('🔧 초기화 중...');

        function waitForScripts() {
            console.log('🔍 스크립트 로딩 상태 확인...');

            if (
                typeof UniverCore === 'undefined' ||
                typeof UniverUi === 'undefined' ||
                typeof UniverSheets === 'undefined' ||
                typeof UniverSheetsUi === 'undefined'
            ) {
                console.log('⏳ 스크립트 로딩 대기...');
                setTimeout(waitForScripts, 200);
                return;
            }

            console.log('✅ 모든 스크립트 로드 완료');
            console.log('🔍 UniverCore:', typeof UniverCore, Object.keys(UniverCore));
            initUniver();
        }

        function initUniver() {
            try {
                setStatus('🎯 Univer 생성 중...');

                // 안전한 Univer 생성
                if (!UniverCore || !UniverCore.Univer) {
                    throw new Error('UniverCore.Univer를 찾을 수 없습니다');
                }

                const univer = new UniverCore.Univer({
                    locale: 'en-US',
                    theme: 'default'
                });

                console.log('✅ Univer 인스턴스 생성:', univer);

                const container = document.getElementById('app');
                if (!container) {
                    throw new Error('컨테이너를 찾을 수 없습니다');
                }

                setStatus('🔧 플러그인 등록 중...');

                // 안전한 플러그인 등록
                try {
                    if (UniverUi && UniverUi.UniverUIPlugin) {
                        univer.registerPlugin(UniverUi.UniverUIPlugin, {
                            container: container
                        });
                        console.log('✅ UI 플러그인 등록 성공');
                    } else {
                        console.warn('⚠️ UI 플러그인을 찾을 수 없음');
                    }
                } catch (uiError) {
                    console.error('❌ UI 플러그인 등록 실패:', uiError);
                    addError('UI 플러그인 등록 실패: ' + uiError.message);
                }

                try {
                    if (UniverSheets && UniverSheets.UniverSheetsPlugin) {
                        univer.registerPlugin(UniverSheets.UniverSheetsPlugin);
                        console.log('✅ Sheets 플러그인 등록 성공');
                    } else {
                        console.warn('⚠️ Sheets 플러그인을 찾을 수 없음');
                    }
                } catch (sheetsError) {
                    console.error('❌ Sheets 플러그인 등록 실패:', sheetsError);
                    addError('Sheets 플러그인 등록 실패: ' + sheetsError.message);
                }

                try {
                    if (UniverSheetsUi && UniverSheetsUi.UniverSheetsUIPlugin) {
                        univer.registerPlugin(UniverSheetsUi.UniverSheetsUIPlugin);
                        console.log('✅ SheetsUI 플러그인 등록 성공');
                    } else {
                        console.warn('⚠️ SheetsUI 플러그인을 찾을 수 없음');
                    }
                } catch (sheetsUiError) {
                    console.error('❌ SheetsUI 플러그인 등록 실패:', sheetsUiError);
                    addError('SheetsUI 플러그인 등록 실패: ' + sheetsUiError.message);
                }

                setStatus('📋 워크북 생성 중...');

                // 워크북 생성
                const workbookData = {
                    id: 'msm-workbook',
                    locale: 'en-US',
                    name: 'MSM Workbook',
                    sheetOrder: ['sheet1'],
                    sheets: {
                        'sheet1': {
                            id: 'sheet1',
                            name: 'MSM 견적서',
                            cellData: {
                                0: {
                                    0: { v: '품목코드' },
                                    1: { v: '품목명' },
                                    2: { v: '수량' },
                                    3: { v: '단가' },
                                    4: { v: '금액' }
                                },
                                1: {
                                    0: { v: 'A001' },
                                    1: { v: '의료기기 A' },
                                    2: { v: 10 },
                                    3: { v: 50000 },
                                    4: { v: 500000 }
                                },
                                2: {
                                    0: { v: 'B002' },
                                    1: { v: '의료기기 B' },
                                    2: { v: 5 },
                                    3: { v: 80000 },
                                    4: { v: 400000 }
                                },
                                3: {
                                    0: { v: 'C003' },
                                    1: { v: '의료기기 C' },
                                    2: { v: 8 },
                                    3: { v: 30000 },
                                    4: { v: 240000 }
                                },
                                4: {
                                    0: { v: '' },
                                    1: { v: '합계' },
                                    2: { v: 23 },
                                    3: { v: '' },
                                    4: { v: 1140000 }
                                }
                            },
                            rowCount: 100,
                            columnCount: 20
                        }
                    }
                };

                // 안전한 워크북 생성
                try {
                    if (UniverCore.UniverInstanceType && UniverCore.UniverInstanceType.UNIVER_SHEET) {
                        univer.createUnit(UniverCore.UniverInstanceType.UNIVER_SHEET, workbookData);
                    } else {
                        // 대체 방법
                        univer.createUnit(2, workbookData);
                    }
                    console.log('✅ 워크북 생성 완료');
                } catch (workbookError) {
                    console.error('❌ 워크북 생성 실패:', workbookError);
                    addError('워크북 생성 실패: ' + workbookError.message);
                }

                setStatus('🎉 MSM Excel 뷰어 준비 완료!');

                // UI 확인
                setTimeout(() => {
                    const containerChildren = container.children.length;
                    console.log('🔍 UI 상태:', containerChildren, '개 요소');

                    if (containerChildren > 0) {
                        setStatus('🎉 MSM Excel 뷰어 정상 작동!');
                        // Flutter 알림
                        window.postMessage('univer_ready', '*');
                    } else {
                        setStatus('⚠️ UI 렌더링 문제 발생 - 플러그인 재시도 중...', true);
                        addError('UI 요소가 렌더링되지 않았습니다. 플러그인 등록을 확인하세요.');
                    }
                }, 3000);

            } catch (error) {
                console.error('❌ 초기화 실패:', error);
                setStatus('❌ 초기화 실패: ' + error.message, true);
                addError('시스템 초기화 실패: ' + error.message);
            }
        }

        // 초기화 시작
        setTimeout(waitForScripts, 1000);
    </script>
</body>
</html>
