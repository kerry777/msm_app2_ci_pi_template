<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 MSM Excel 뷰어 - 완전한 해결 버전</title>

    <!-- Univer CSS with proper loading order -->
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/design@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/ui@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/docs-ui@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-formula-ui@0.1.17/lib/index.css" />

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background-color: #f5f5f5;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .status {
            background: #e3f2fd;
            color: #1976d2;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
            font-weight: 500;
        }

        #univer-container {
            width: 100%;
            height: 700px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }

        /* Critical Univer UI fixes */
        .univer-container {
            height: 100% !important;
            width: 100% !important;
            display: block !important;
            position: relative !important;
        }

        /* Force visibility for all UI components */
        [data-u-comp="workbench-layout"] {
            height: 100% !important;
            width: 100% !important;
            display: flex !important;
            flex-direction: column !important;
        }

        [data-u-comp="headerbar"] {
            display: block !important;
            visibility: visible !important;
            height: auto !important;
            min-height: 40px !important;
            width: 100% !important;
        }

        [data-u-comp="ribbon-toolbar"] {
            display: block !important;
            visibility: visible !important;
            height: auto !important;
            min-height: 39px !important;
            width: 100% !important;
        }

        /* Ensure canvas and grid are visible */
        .univer-render-canvas,
        .univer-canvas,
        .univer-grid,
        canvas {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        /* Fix sidebar issues */
        [data-u-comp="left-sidebar"],
        [data-u-comp="right-sidebar"] {
            display: none !important; /* Hide sidebars to avoid layout conflicts */
        }

        /* Force content area to be visible */
        .univer-sheet-content,
        .univer-sheet-container {
            height: 100% !important;
            width: 100% !important;
            display: block !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏥 MSM Excel 뷰어 - 완전한 해결 버전</h1>
        <div id="status">시스템 초기화 중...</div>
    </div>

    <div id="univer-container"></div>

    <!-- Univer Scripts with proper loading order -->
    <script src="https://unpkg.com/@univerjs/core@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/design@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/docs@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/docs-ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-formula@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-formula-ui@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-numfmt@0.1.17/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/facade@0.1.17/lib/umd/index.js"></script>

    <script>
        function setStatus(message) {
            document.getElementById('status').textContent = message;
            console.log('📋 상태:', message);
        }

        // Global error handling for Selection API
        window.addEventListener('error', function(event) {
            if (event.message && event.message.includes('getLocation')) {
                console.warn('🔧 Selection API 에러 자동 처리:', event.message);
                event.preventDefault();
                return false;
            }
        });

        // Safe getLocation method injection
        Object.defineProperty(Object.prototype, 'getLocation', {
            value: function() {
                return {
                    startRow: 0,
                    startColumn: 0,
                    endRow: 0,
                    endColumn: 0
                };
            },
            writable: true,
            configurable: true,
            enumerable: false
        });

        console.log('🚀 MSM Univer 완전한 해결 버전 초기화 시작');
        setStatus('🔧 Univer 모듈 로딩 중...');

        function waitForScripts() {
            const requiredModules = [
                'UniverCore',
                'UniverUi',
                'UniverSheets',
                'UniverSheetsUi'
            ];

            const missingModules = requiredModules.filter(module => typeof window[module] === 'undefined');

            if (missingModules.length > 0) {
                console.log('⏳ 모듈 로딩 대기 중:', missingModules);
                setTimeout(waitForScripts, 100);
                return;
            }

            console.log('✅ 모든 모듈 로드 완료');
            initUniver();
        }

        async function initUniver() {
            try {
                setStatus('🎯 Univer 인스턴스 생성 중...');

                const { createUniver, LocaleType, UniverInstanceType } = UniverCore;

                // Container validation
                const container = document.getElementById('univer-container');
                if (!container) {
                    throw new Error('Univer 컨테이너를 찾을 수 없습니다');
                }

                // Create Univer instance with optimal configuration
                const univer = createUniver({
                    locale: LocaleType.ZH_CN,
                    theme: 'default'
                });

                console.log('✅ Univer 인스턴스 생성 완료:', univer);

                setStatus('🔧 UI 플러그인 등록 중...');

                // Register UI plugin with complete configuration
                univer.registerPlugin(UniverUi.UniverUIPlugin, {
                    container: container,
                    header: true,
                    toolbar: true,
                    footer: true,
                    contextMenu: true
                });
                console.log('✅ UI 플러그인 등록 완료');

                setStatus('📊 Sheets 플러그인 등록 중...');

                // Register Sheets plugins
                univer.registerPlugin(UniverSheets.UniverSheetsPlugin);
                univer.registerPlugin(UniverSheetsUi.UniverSheetsUIPlugin, {
                    menu: {
                        // Enable all menu items for full functionality
                    }
                });
                console.log('✅ Sheets 플러그인 등록 완료');

                // Register optional Formula plugins
                try {
                    univer.registerPlugin(UniverSheetsFormula.UniverSheetsFormulaPlugin);
                    univer.registerPlugin(UniverSheetsFormulaUi.UniverSheetsFormulaUIPlugin);
                    console.log('✅ Formula 플러그인 등록 완료');
                } catch (e) {
                    console.warn('⚠️ Formula 플러그인 등록 실패 (선택적):', e.message);
                }

                setStatus('📋 워크북 생성 중...');

                // Create workbook with MSM medical data
                const workbookData = {
                    id: 'msm-workbook',
                    locale: LocaleType.ZH_CN,
                    name: 'MSM Excel Workbook',
                    sheetOrder: ['sheet-01'],
                    sheets: {
                        'sheet-01': {
                            id: 'sheet-01',
                            name: 'MSM 견적서',
                            cellData: {
                                0: {
                                    0: { v: '품목코드' },
                                    1: { v: '품목명' },
                                    2: { v: '수량' },
                                    3: { v: '단가' },
                                    4: { v: '금액' }
                                },
                                1: {
                                    0: { v: 'A001' },
                                    1: { v: '의료기기 A' },
                                    2: { v: 10 },
                                    3: { v: 50000 },
                                    4: { v: 500000 }
                                },
                                2: {
                                    0: { v: 'B002' },
                                    1: { v: '의료기기 B' },
                                    2: { v: 5 },
                                    3: { v: 80000 },
                                    4: { v: 400000 }
                                },
                                3: {
                                    0: { v: 'C003' },
                                    1: { v: '의료기기 C' },
                                    2: { v: 8 },
                                    3: { v: 30000 },
                                    4: { v: 240000 }
                                },
                                4: {
                                    0: { v: '' },
                                    1: { v: '합계' },
                                    2: { v: 23 },
                                    3: { v: '' },
                                    4: { v: 1140000 }
                                }
                            },
                            rowCount: 100,
                            columnCount: 20,
                            defaultRowHeight: 25,
                            defaultColumnWidth: 100
                        }
                    }
                };

                // Create and activate workbook
                const workbook = univer.createUnit(UniverInstanceType.UNIVER_SHEET, workbookData);
                console.log('✅ 워크북 생성 완료:', workbook);

                setStatus('⏳ UI 렌더링 대기 중...');

                // Wait for UI to render completely
                setTimeout(() => {
                    validateUIRendering();
                }, 2000);

            } catch (error) {
                console.error('❌ Univer 초기화 실패:', error);
                setStatus('❌ 초기화 실패: ' + error.message);
            }
        }

        function validateUIRendering() {
            try {
                const container = document.getElementById('univer-container');
                const containerChildren = container.children.length;
                console.log('🔍 컨테이너 자식 요소:', containerChildren);

                // Check for essential UI components
                const workbench = document.querySelector('[data-u-comp="workbench-layout"]');
                const headerbar = document.querySelector('[data-u-comp="headerbar"]');
                const toolbar = document.querySelector('[data-u-comp="ribbon-toolbar"]');

                if (workbench && headerbar && toolbar) {
                    console.log('✅ 모든 UI 컴포넌트 발견:');
                    console.log('  - Workbench:', workbench.offsetWidth + 'x' + workbench.offsetHeight);
                    console.log('  - Headerbar:', headerbar.offsetWidth + 'x' + headerbar.offsetHeight);
                    console.log('  - Toolbar:', toolbar.offsetWidth + 'x' + toolbar.offsetHeight);

                    if (workbench.offsetWidth > 0 && workbench.offsetHeight > 0) {
                        setStatus('🎉 MSM Excel 뷰어가 성공적으로 로드되었습니다!');

                        // Notify Flutter
                        if (window.FlutterChannel) {
                            window.FlutterChannel.postMessage('univer_ready');
                        }
                        window.postMessage('univer_ready', '*');
                    } else {
                        console.warn('⚠️ UI 컴포넌트가 0 크기로 렌더링됨');
                        setStatus('⚠️ UI 렌더링 확인 중...');

                        // Force layout refresh
                        container.style.display = 'none';
                        container.offsetHeight; // Force reflow
                        container.style.display = 'block';

                        setTimeout(validateUIRendering, 1000);
                    }
                } else {
                    console.warn('⚠️ 필수 UI 컴포넌트 누락');
                    setStatus('⚠️ UI 컴포넌트 렌더링 중...');
                    setTimeout(validateUIRendering, 1000);
                }

            } catch (error) {
                console.error('❌ UI 검증 실패:', error);
                setStatus('❌ UI 검증 실패: ' + error.message);
            }
        }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', waitForScripts);
        } else {
            waitForScripts();
        }

        // Cleanup on unload
        window.addEventListener('beforeunload', function() {
            console.log('🧹 Univer 정리 중...');
        });
    </script>
</body>
</html>
