<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univer 완전체 - 모든 툴바 기능 포함</title>

    <!-- Univer 모든 스타일 -->
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/umd@0.1.17/lib/univer.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: #666;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">Univer 완전체 로딩 중...</div>
    <div id="app"></div>

    <!-- React와 의존성 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Univer Full UMD 번들 - 모든 기능 포함 -->
    <script src="https://unpkg.com/@univerjs/umd@0.1.17/lib/univer.full.umd.js"></script>

    <!-- 모든 언어팩 -->
    <script src="https://unpkg.com/@univerjs/umd@0.1.17/lib/locale/en-US.js"></script>
    <script src="https://unpkg.com/@univerjs/umd@0.1.17/lib/locale/ko-KR.js"></script>
    <script src="https://unpkg.com/@univerjs/umd@0.1.17/lib/locale/zh-CN.js"></script>

    <script>
        // 에러 억제 (일부 내부 에러는 무시)
        window.addEventListener('error', (e) => {
            if (e.message?.includes('engine') || e.message?.includes('redi')) {
                e.preventDefault();
                return false;
            }
        }, true);

        async function initCompleteUniver() {
            const loadingEl = document.getElementById('loading');

            // 완전 로드 대기
            await new Promise(r => setTimeout(r, 2000));

            try {
                // 전역 객체에서 필요한 모든 것 가져오기
                const {
                    Univer,
                    UniverInstanceType,
                    LocaleType,
                    BooleanNumber
                } = window.UniverCore;

                // 테마
                const { defaultTheme } = window.UniverDesign;

                console.log('Univer 완전체 초기화 시작...');

                // Univer 인스턴스 생성 - 한국어 지원
                const univer = new Univer({
                    theme: defaultTheme,
                    locale: LocaleType.EN_US,  // 또는 KO_KR
                    locales: {
                        [LocaleType.EN_US]: window.UniverUMD['en-US'],
                        [LocaleType.KO_KR]: window.UniverUMD['ko-KR'] || {},
                        [LocaleType.ZH_CN]: window.UniverUMD['zh-CN'] || {}
                    },
                    logLevel: 2
                });

                console.log('모든 플러그인 등록 중...');

                // 모든 플러그인 등록 (순서 중요!)
                const allPlugins = [
                    // 1. 핵심 엔진
                    { m: window.UniverEngineRender, n: 'UniverRenderEnginePlugin' },
                    { m: window.UniverEngineFormula, n: 'UniverFormulaEnginePlugin' },
                    { m: window.UniverEngineNumfmt, n: 'UniverNumfmtEnginePlugin' },

                    // 2. UI 기본
                    { m: window.UniverUi, n: 'UniverUIPlugin',
                      c: {
                        container: 'app',
                        header: true,      // 상단 헤더
                        toolbar: true,     // 툴바
                        footer: true,      // 하단 상태바
                        contextMenu: true  // 우클릭 메뉴
                      }
                    },

                    // 3. Docs (문서)
                    { m: window.UniverDocs, n: 'UniverDocsPlugin' },
                    { m: window.UniverDocsUi, n: 'UniverDocsUIPlugin' },

                    // 4. Sheets (스프레드시트)
                    { m: window.UniverSheets, n: 'UniverSheetsPlugin' },
                    { m: window.UniverSheetsUi, n: 'UniverSheetsUIPlugin' },
                    { m: window.UniverSheetsNumfmt, n: 'UniverSheetsNumfmtPlugin' },
                    { m: window.UniverSheetsFormula, n: 'UniverSheetsFormulaPlugin' },
                    { m: window.UniverSheetsZenEditor, n: 'UniverSheetsZenEditorPlugin' },

                    // 5. 조건부 서식
                    { m: window.UniverSheetsConditionalFormatting, n: 'UniverSheetsConditionalFormattingPlugin' },
                    { m: window.UniverSheetsConditionalFormattingUi, n: 'UniverSheetsConditionalFormattingUIPlugin' },

                    // 6. 찾기/바꾸기
                    { m: window.UniverFindReplace, n: 'UniverFindReplacePlugin' },
                    { m: window.UniverSheetsFindReplace, n: 'UniverSheetsFindReplacePlugin' },

                    // 7. 데이터 유효성 검사
                    { m: window.UniverDataValidation, n: 'UniverDataValidationPlugin' },
                    { m: window.UniverSheetsDataValidation, n: 'UniverSheetsDataValidationPlugin' },

                    // 8. 필터
                    { m: window.UniverSheetsFilter, n: 'UniverSheetsFilterPlugin' },
                    { m: window.UniverSheetsFilterUi, n: 'UniverSheetsFilterUIPlugin' },

                    // 9. 정렬
                    { m: window.UniverSheetsSort, n: 'UniverSheetsSortPlugin' },
                    { m: window.UniverSheetsSortUi, n: 'UniverSheetsSortUIPlugin' },

                    // 10. 코멘트
                    { m: window.UniverThreadComment, n: 'UniverThreadCommentPlugin' },
                    { m: window.UniverThreadCommentUi, n: 'UniverThreadCommentUIPlugin' },
                    { m: window.UniverSheetsThreadCommentBase, n: 'UniverSheetsThreadCommentBasePlugin' },
                    { m: window.UniverSheetsThreadComment, n: 'UniverSheetsThreadCommentPlugin' },

                    // 11. 그리기
                    { m: window.UniverDrawing, n: 'UniverDrawingPlugin' },
                    { m: window.UniverDrawingUi, n: 'UniverDrawingUIPlugin' },
                    { m: window.UniverSheetsDrawing, n: 'UniverSheetsDrawingPlugin' },
                    { m: window.UniverSheetsDrawingUi, n: 'UniverSheetsDrawingUIPlugin' },

                    // 12. 하이퍼링크
                    { m: window.UniverSheetsHyperLink, n: 'UniverSheetsHyperLinkPlugin' },
                    { m: window.UniverSheetsHyperLinkUi, n: 'UniverSheetsHyperLinkUIPlugin' },

                    // 13. Slides (프레젠테이션)
                    { m: window.UniverSlides, n: 'UniverSlidesPlugin' },
                    { m: window.UniverSlidesUi, n: 'UniverSlidesUIPlugin' },

                    // 14. 네트워크
                    { m: window.UniverNetwork, n: 'UniverNetworkPlugin' },

                    // 15. Facade API
                    { m: window.UniverFacade, n: 'UniverFacadePlugin' }
                ];

                // 플러그인 등록
                let registeredCount = 0;
                allPlugins.forEach(({ m, n, c }) => {
                    if (m && m[n]) {
                        try {
                            univer.registerPlugin(m[n], c);
                            registeredCount++;
                            console.log(`✓ ${n.replace('Univer', '').replace('Plugin', '')}`);
                        } catch (e) {
                            console.warn(`✗ ${n}: ${e.message}`);
                        }
                    }
                });

                console.log(`총 ${registeredCount}개 플러그인 등록 완료!`);

                // MSM 의료용품 견적서 워크북 생성
                const workbook = univer.createUnit(UniverInstanceType.UNIVER_SHEET, {
                    id: 'msm-complete-001',
                    appVersion: '0.1.17',
                    name: 'MSM 의료용품 통합 관리',
                    locale: LocaleType.EN_US,
                    sheetOrder: ['quotation', 'inventory', 'analysis'],
                    sheets: {
                        'quotation': {
                            id: 'quotation',
                            name: '견적서',
                            tabColor: '#4285f4',
                            hidden: BooleanNumber.FALSE,
                            freezeRow: 1,
                            freezeColumn: 1,
                            rowCount: 1000,
                            columnCount: 50,
                            zoomRatio: 1,
                            scrollTop: 0,
                            scrollLeft: 0,
                            defaultRowHeight: 25,
                            defaultColumnWidth: 100,
                            rowData: {
                                0: { h: 35, hd: BooleanNumber.FALSE }
                            },
                            columnData: {
                                0: { w: 100 },
                                1: { w: 200 },
                                2: { w: 120 },
                                3: { w: 100 },
                                4: { w: 80 },
                                5: { w: 100 },
                                6: { w: 120 },
                                7: { w: 150 },
                                8: { w: 120 }
                            },
                            cellData: {
                                0: {  // 헤더 행
                                    0: { v: '품목코드', s: { bl: 1, bg: { rgb: '#1e88e5' }, cl: { rgb: '#ffffff' } } },
                                    1: { v: '품목명', s: { bl: 1, bg: { rgb: '#1e88e5' }, cl: { rgb: '#ffffff' } } },
                                    2: { v: '카테고리', s: { bl: 1, bg: { rgb: '#1e88e5' }, cl: { rgb: '#ffffff' } } },
                                    3: { v: '규격', s: { bl: 1, bg: { rgb: '#1e88e5' }, cl: { rgb: '#ffffff' } } },
                                    4: { v: '수량', s: { bl: 1, bg: { rgb: '#1e88e5' }, cl: { rgb: '#ffffff' } } },
                                    5: { v: '단가', s: { bl: 1, bg: { rgb: '#1e88e5' }, cl: { rgb: '#ffffff' } } },
                                    6: { v: '금액', s: { bl: 1, bg: { rgb: '#1e88e5' }, cl: { rgb: '#ffffff' } } },
                                    7: { v: '공급처', s: { bl: 1, bg: { rgb: '#1e88e5' }, cl: { rgb: '#ffffff' } } },
                                    8: { v: '비고', s: { bl: 1, bg: { rgb: '#1e88e5' }, cl: { rgb: '#ffffff' } } }
                                },
                                // MSM 데이터
                                1: {
                                    0: { v: 'MD-001' },
                                    1: { v: '수술용 메스' },
                                    2: { v: '수술용품' },
                                    3: { v: '일회용' },
                                    4: { v: 100 },
                                    5: { v: 5000 },
                                    6: { f: '=E2*F2' },
                                    7: { v: '메디칼서플라이' },
                                    8: { v: '긴급' }
                                },
                                2: {
                                    0: { v: 'MD-002' },
                                    1: { v: '의료용 거즈' },
                                    2: { v: '소모품' },
                                    3: { v: '10x10cm' },
                                    4: { v: 500 },
                                    5: { v: 1000 },
                                    6: { f: '=E3*F3' },
                                    7: { v: '한국메디칼' },
                                    8: { v: '' }
                                },
                                3: {
                                    0: { v: 'MD-003' },
                                    1: { v: '주사기' },
                                    2: { v: '주사용품' },
                                    3: { v: '5ml' },
                                    4: { v: 200 },
                                    5: { v: 3000 },
                                    6: { f: '=E4*F4' },
                                    7: { v: '메디칼서플라이' },
                                    8: { v: '' }
                                }
                            },
                            showGridlines: BooleanNumber.TRUE,
                            selections: ['A1'],
                            rightToLeft: BooleanNumber.FALSE
                        },
                        'inventory': {
                            id: 'inventory',
                            name: '재고현황',
                            tabColor: '#34a853',
                            hidden: BooleanNumber.FALSE,
                            rowCount: 1000,
                            columnCount: 50
                        },
                        'analysis': {
                            id: 'analysis',
                            name: '분석',
                            tabColor: '#ea4335',
                            hidden: BooleanNumber.FALSE,
                            rowCount: 1000,
                            columnCount: 50
                        }
                    }
                });

                console.log('✅ Univer 완전체 초기화 완료!');

                // 로딩 메시지 제거
                loadingEl.style.display = 'none';

                // 전역 저장
                window.univer = univer;
                window.workbook = workbook;

                // 성공 메시지
                console.log('🎉 모든 툴바 기능을 사용할 수 있습니다!');
                console.log('📊 Pivot Table: 데이터 → 피벗 테이블');
                console.log('📈 Chart: 삽입 → 차트');
                console.log('🔍 찾기/바꾸기: Ctrl+F / Ctrl+H');
                console.log('📝 조건부 서식: 서식 → 조건부 서식');
                console.log('🔽 필터: 데이터 → 필터');
                console.log('↕️ 정렬: 데이터 → 정렬');
                console.log('💬 코멘트: 우클릭 → 코멘트 추가');
                console.log('🔗 하이퍼링크: 삽입 → 링크');
                console.log('🎨 그리기: 삽입 → 도형');

            } catch (error) {
                console.error('초기화 실패:', error);
                loadingEl.textContent = '오류 발생: ' + error.message;
            }
        }

        // 페이지 로드 후 실행
        window.addEventListener('DOMContentLoaded', initCompleteUniver);
    </script>
</body>
</html>
