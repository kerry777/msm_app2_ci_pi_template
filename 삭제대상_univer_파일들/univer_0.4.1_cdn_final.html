<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univer 0.4.1 CDN - StackBlitz 검증 버전</title>

    <!-- 필수 의존성 -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>

    <!-- Univer 0.4.1 개별 패키지들 -->
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/design@0.4.1/lib/index.css">
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/ui@0.4.1/lib/index.css">
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/sheets-ui@0.4.1/lib/index.css">

    <!-- Univer Core -->
    <script src="https://unpkg.com/@univerjs/core@0.4.1/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/design@0.4.1/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/engine-render@0.4.1/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/engine-formula@0.4.1/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/ui@0.4.1/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets@0.4.1/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-ui@0.4.1/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/sheets-formula@0.4.1/lib/umd/index.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        #app { width: 100%; height: 100%; }
        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.9);
            color: #0f0;
            border: 1px solid #0f0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            z-index: 999999;
        }
        .status.error { color: #f00; border-color: #f00; }
        .status.loading { color: #ff0; border-color: #ff0; }
    </style>
</head>
<body>
    <div class="status loading" id="status">Loading Univer 0.4.1...</div>
    <div id="app"></div>

    <script>
        const statusEl = document.getElementById('status');

        function updateStatus(msg, type = 'loading') {
            statusEl.textContent = msg;
            statusEl.className = `status ${type}`;
            console.log(`[${type}] ${msg}`);
        }

        async function initUniver() {
            updateStatus('Waiting for scripts to load...');

            // 스크립트 로드 대기
            await new Promise(resolve => setTimeout(resolve, 3000));

            try {
                // 전역 객체 확인
                updateStatus('Checking Univer globals...');

                const hasCore = !!window.UniverCore;
                const hasDesign = !!window.UniverDesign;
                const hasRender = !!window.UniverEngineRender;
                const hasFormula = !!window.UniverEngineFormula;
                const hasUI = !!window.UniverUi;
                const hasSheets = !!window.UniverSheets;
                const hasSheetsUI = !!window.UniverSheetsUi;
                const hasSheetsFormula = !!window.UniverSheetsFormula;

                console.log('Globals:', {
                    UniverCore: hasCore,
                    UniverDesign: hasDesign,
                    UniverEngineRender: hasRender,
                    UniverEngineFormula: hasFormula,
                    UniverUi: hasUI,
                    UniverSheets: hasSheets,
                    UniverSheetsUi: hasSheetsUI,
                    UniverSheetsFormula: hasSheetsFormula
                });

                if (!hasCore) {
                    throw new Error('UniverCore not found');
                }

                updateStatus('Creating Univer instance...');

                // Univer 인스턴스 생성 (StackBlitz 예제 방식)
                const { Univer, UniverInstanceType, LocaleType } = window.UniverCore;
                const { defaultTheme } = window.UniverDesign || {};
                const { UniverRenderEnginePlugin } = window.UniverEngineRender || {};
                const { UniverFormulaEnginePlugin } = window.UniverEngineFormula || {};
                const { UniverUIPlugin } = window.UniverUi || {};
                const { UniverSheetsPlugin } = window.UniverSheets || {};
                const { UniverSheetsUIPlugin } = window.UniverSheetsUi || {};
                const { UniverSheetsFormulaPlugin } = window.UniverSheetsFormula || {};

                // Univer 생성
                const univer = new Univer({
                    theme: defaultTheme || {},
                    locale: LocaleType?.EN_US || 'en-US'
                });

                updateStatus('Registering plugins...');

                // 플러그인 등록 (순서 중요)
                if (UniverRenderEnginePlugin) {
                    univer.registerPlugin(UniverRenderEnginePlugin);
                }
                if (UniverFormulaEnginePlugin) {
                    univer.registerPlugin(UniverFormulaEnginePlugin);
                }
                if (UniverUIPlugin) {
                    univer.registerPlugin(UniverUIPlugin, {
                        container: 'app'
                    });
                }
                if (UniverSheetsPlugin) {
                    univer.registerPlugin(UniverSheetsPlugin);
                }
                if (UniverSheetsUIPlugin) {
                    univer.registerPlugin(UniverSheetsUIPlugin);
                }
                if (UniverSheetsFormulaPlugin) {
                    univer.registerPlugin(UniverSheetsFormulaPlugin);
                }

                updateStatus('Creating workbook...');

                // 워크북 생성
                const workbook = univer.createUnit(UniverInstanceType.UNIVER_SHEET, {
                    id: 'workbook-01',
                    appVersion: '0.4.1',
                    name: 'MSM 견적서',
                    locale: LocaleType?.EN_US || 'en-US',
                    sheets: {
                        'sheet-01': {
                            id: 'sheet-01',
                            name: '견적서',
                            rowCount: 100,
                            columnCount: 20,
                            rowData: {
                                0: { h: 30, hd: false },
                                1: { h: 25, hd: false }
                            },
                            columnData: {
                                0: { w: 100, hd: false },
                                1: { w: 200, hd: false },
                                2: { w: 100, hd: false },
                                3: { w: 80, hd: false },
                                4: { w: 100, hd: false },
                                5: { w: 120, hd: false },
                                6: { w: 150, hd: false }
                            },
                            cellData: {
                                0: {
                                    0: { v: '품목코드', s: { bl: 1 } },
                                    1: { v: '품목명', s: { bl: 1 } },
                                    2: { v: '규격', s: { bl: 1 } },
                                    3: { v: '수량', s: { bl: 1 } },
                                    4: { v: '단가', s: { bl: 1 } },
                                    5: { v: '금액', s: { bl: 1 } },
                                    6: { v: '비고', s: { bl: 1 } }
                                },
                                1: {
                                    0: { v: 'MD-001' },
                                    1: { v: '수술용 메스' },
                                    2: { v: '일회용' },
                                    3: { v: 100, t: 2 },
                                    4: { v: 5000, t: 2 },
                                    5: { v: 500000, t: 2 },
                                    6: { v: '긴급' }
                                },
                                2: {
                                    0: { v: 'MD-002' },
                                    1: { v: '의료용 거즈' },
                                    2: { v: '10x10cm' },
                                    3: { v: 500, t: 2 },
                                    4: { v: 1000, t: 2 },
                                    5: { v: 500000, t: 2 },
                                    6: { v: '' }
                                },
                                3: {
                                    0: { v: 'MD-003' },
                                    1: { v: '주사기' },
                                    2: { v: '5ml' },
                                    3: { v: 200, t: 2 },
                                    4: { v: 3000, t: 2 },
                                    5: { v: 600000, t: 2 },
                                    6: { v: '' }
                                },
                                4: {
                                    0: { v: 'MD-004' },
                                    1: { v: '수액세트' },
                                    2: { v: '표준형' },
                                    3: { v: 150, t: 2 },
                                    4: { v: 8000, t: 2 },
                                    5: { v: 1200000, t: 2 },
                                    6: { v: '재고확인' }
                                },
                                5: {
                                    0: { v: 'MD-005' },
                                    1: { v: '진단키트' },
                                    2: { v: 'COVID-19' },
                                    3: { v: 50, t: 2 },
                                    4: { v: 15000, t: 2 },
                                    5: { v: 750000, t: 2 },
                                    6: { v: '예약주문' }
                                }
                            }
                        }
                    }
                });

                updateStatus('✅ Univer 0.4.1 initialized!', '');

                // 전역 저장
                window.univer = univer;
                window.workbook = workbook;

                // DOM 체크
                setTimeout(() => {
                    const app = document.getElementById('app');
                    const stats = {
                        children: app.children.length,
                        canvas: app.querySelectorAll('canvas').length,
                        univer: app.querySelectorAll('[class*="univer"]').length
                    };

                    console.log('DOM Stats:', stats);

                    if (stats.children > 0) {
                        updateStatus('✅ RENDERING SUCCESS!', '');
                        setTimeout(() => statusEl.style.display = 'none', 3000);
                    } else {
                        updateStatus('⚠️ No rendering', 'error');
                    }
                }, 2000);

            } catch (error) {
                updateStatus(`Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // 페이지 로드 후 실행
        window.addEventListener('DOMContentLoaded', initUniver);
    </script>
</body>
</html>
