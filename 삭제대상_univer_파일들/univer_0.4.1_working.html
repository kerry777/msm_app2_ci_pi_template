<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univer 0.4.1 실제 작동 버전</title>

    <!-- Univer UMD Bundle 0.4.1 -->
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/umd@0.4.1/lib/univer.css">
    <script src="https://unpkg.com/@univerjs/umd@0.4.1/lib/univer.full.umd.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border-radius: 5px;
            z-index: 10000;
            font-size: 14px;
        }
        #status.loading { background: #FFC107; color: #333; }
        #status.error { background: #F44336; }
        #app {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="status" class="loading">Univer 초기화 중...</div>
    <div id="app"></div>

    <script>
        // 전역 객체 확인을 위한 로그
        console.log('=== Univer 0.4.1 초기화 시작 ===');

        // DOM이 완전히 로드된 후 실행
        window.addEventListener('DOMContentLoaded', async function() {
            const statusEl = document.getElementById('status');

            function updateStatus(msg, type = 'loading') {
                statusEl.textContent = msg;
                statusEl.className = type;
                console.log('[Status]', msg);
            }

            // Univer 전역 객체 확인
            function checkUniverGlobals() {
                const globals = Object.keys(window).filter(key =>
                    key.toLowerCase().includes('univer') ||
                    key === 'UniverCore' ||
                    key === 'UniverSheets' ||
                    key === 'UniverDocs'
                );
                console.log('발견된 Univer 전역 객체:', globals);
                return globals;
            }

            // 2초 대기 (스크립트 완전 로드 보장)
            await new Promise(resolve => setTimeout(resolve, 2000));

            try {
                updateStatus('Univer 전역 객체 확인 중...', 'loading');
                const univerGlobals = checkUniverGlobals();

                // UMD 번들의 전역 네임스페이스 확인
                let univerAPI = null;

                // 다양한 네임스페이스 시도
                if (window.UniverCore) {
                    console.log('✅ window.UniverCore 발견!');

                    // UniverCore에서 필요한 클래스들 추출
                    const {
                        Univer,
                        UniverInstanceType,
                        LocaleType,
                        Plugin,
                        Injector
                    } = window.UniverCore;

                    if (Univer) {
                        updateStatus('Univer 인스턴스 생성 중...', 'loading');

                        // Univer 인스턴스 생성
                        const univer = new Univer({
                            theme: window.UniverDesign?.defaultTheme || {},
                            locale: LocaleType?.EN_US || 'en-US',
                            locales: {
                                'en-US': window.UniverSheetsEnUS || {}
                            }
                        });

                        // 플러그인 등록 (가능한 경우)
                        if (window.UniverRender?.UniverRenderEnginePlugin) {
                            univer.registerPlugin(window.UniverRender.UniverRenderEnginePlugin);
                        }
                        if (window.UniverUI?.UniverUIPlugin) {
                            univer.registerPlugin(window.UniverUI.UniverUIPlugin, {
                                container: document.getElementById('app')
                            });
                        }
                        if (window.UniverSheets?.UniverSheetsPlugin) {
                            univer.registerPlugin(window.UniverSheets.UniverSheetsPlugin);
                        }
                        if (window.UniverSheetsUI?.UniverSheetsUIPlugin) {
                            univer.registerPlugin(window.UniverSheetsUI.UniverSheetsUIPlugin);
                        }

                        // 워크북 생성
                        const workbook = univer.createUnit(UniverInstanceType?.UNIVER_SHEET || 1, {
                            id: 'msm-workbook',
                            name: 'MSM 견적서',
                            appVersion: '0.4.1',
                            sheets: {
                                'sheet1': {
                                    id: 'sheet1',
                                    name: '견적서',
                                    rowCount: 100,
                                    columnCount: 20,
                                    cellData: {
                                        0: {
                                            0: { v: '품목코드' },
                                            1: { v: '품목명' },
                                            2: { v: '규격' },
                                            3: { v: '수량' },
                                            4: { v: '단가' },
                                            5: { v: '금액' },
                                            6: { v: '비고' }
                                        },
                                        1: {
                                            0: { v: 'MD-001' },
                                            1: { v: '수술용 메스' },
                                            2: { v: '일회용' },
                                            3: { v: 100 },
                                            4: { v: 5000 },
                                            5: { v: 500000 },
                                            6: { v: '긴급' }
                                        }
                                    }
                                }
                            }
                        });

                        updateStatus('✅ Univer 0.4.1 초기화 성공!', '');
                        console.log('✅ Univer 인스턴스:', univer);
                        console.log('✅ 워크북:', workbook);

                        // 전역 변수로 저장
                        window.univer = univer;
                        window.workbook = workbook;

                        // 3초 후 상태 메시지 숨기기
                        setTimeout(() => {
                            statusEl.style.display = 'none';
                        }, 3000);

                    } else {
                        throw new Error('Univer 클래스를 찾을 수 없습니다');
                    }

                } else if (window.Univer) {
                    console.log('✅ window.Univer 발견!');
                    // 간단한 초기화 시도
                    const univer = new window.Univer();
                    updateStatus('✅ Univer 초기화 성공!', '');

                } else if (window.univerjs) {
                    console.log('✅ window.univerjs 발견!');
                    updateStatus('✅ univerjs 네임스페이스 발견!', '');

                } else {
                    // 전역 객체를 찾을 수 없음
                    console.error('❌ Univer 전역 객체를 찾을 수 없습니다');
                    console.log('사용 가능한 전역 객체:', univerGlobals);

                    // 모든 전역 객체 출력 (디버깅용)
                    console.log('전체 window 객체 키 (Univer 관련):',
                        Object.keys(window).filter(k => k.toLowerCase().includes('univ'))
                    );

                    updateStatus('⚠️ Univer 로딩 대기 중...', 'loading');

                    // 추가 대기 후 재시도
                    setTimeout(() => {
                        const retryGlobals = checkUniverGlobals();
                        if (retryGlobals.length > 0) {
                            location.reload(); // 페이지 새로고침으로 재시도
                        } else {
                            updateStatus('❌ Univer를 찾을 수 없습니다', 'error');
                        }
                    }, 3000);
                }

            } catch (error) {
                console.error('Univer 초기화 오류:', error);
                updateStatus('❌ 오류: ' + error.message, 'error');

                // 상세 오류 정보 출력
                console.error('오류 상세:', {
                    message: error.message,
                    stack: error.stack,
                    availableGlobals: checkUniverGlobals()
                });
            }

            // DOM 요소 확인
            setTimeout(() => {
                const appEl = document.getElementById('app');
                console.log('앱 컨테이너 상태:', {
                    자식요소: appEl.children.length,
                    innerHTML길이: appEl.innerHTML.length,
                    캔버스: appEl.querySelectorAll('canvas').length,
                    Univer요소: appEl.querySelectorAll('[class*="univer"]').length
                });
            }, 3000);
        });

        // Flutter 메시지 핸들러
        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'loadExcel') {
                console.log('Excel 파일 로드 요청:', event.data);
                // Excel 파일 로드 구현
            }
        });
    </script>
</body>
</html>
