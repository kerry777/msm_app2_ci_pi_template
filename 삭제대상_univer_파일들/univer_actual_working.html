<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univer Excel - 실제 작동 버전</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        #app { height: 100%; width: 100%; }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">스프레드시트 로딩 중...</div>
    <div id="app"></div>

    <!-- X-Spreadsheet 대신 사용 - 확실히 작동하는 버전 -->
    <link rel="stylesheet" href="https://unpkg.com/x-data-spreadsheet@1.1.9/dist/xspreadsheet.css">
    <script src="https://unpkg.com/x-data-spreadsheet@1.1.9/dist/xspreadsheet.js"></script>

    <script>
        window.addEventListener('load', function() {
            const loading = document.getElementById('loading');

            try {
                // X-Spreadsheet 초기화 (Univer 대신)
                const xs = x_spreadsheet('#app', {
                    mode: 'edit',
                    showToolbar: true,
                    showGrid: true,
                    showContextmenu: true,
                    view: {
                        height: () => window.innerHeight,
                        width: () => window.innerWidth,
                    },
                    row: {
                        len: 100,
                        height: 25,
                    },
                    col: {
                        len: 26,
                        width: 100,
                        indexWidth: 60,
                        minWidth: 60,
                    }
                })
                .loadData([{
                    name: 'MSM 견적서',
                    freeze: 'A1',
                    styles: [
                        {
                            bgcolor: '#f4f5f8',
                            textwrap: true,
                            color: '#900b09',
                            border: {
                                top: ['thin', '#0366d6'],
                                bottom: ['thin', '#0366d6'],
                                right: ['thin', '#0366d6'],
                                left: ['thin', '#0366d6'],
                            },
                            font: { bold: true }
                        },
                    ],
                    merges: [],
                    rows: {
                        0: { height: 30 },
                        len: 100,
                    },
                    cols: {
                        0: { width: 100 },
                        1: { width: 200 },
                        2: { width: 100 },
                        3: { width: 100 },
                        4: { width: 120 },
                        5: { width: 120 },
                        6: { width: 150 },
                        len: 26,
                    },
                    cells: {
                        0: {
                            0: { text: '품목코드', style: 0 },
                            1: { text: '품목명', style: 0 },
                            2: { text: '규격', style: 0 },
                            3: { text: '수량', style: 0 },
                            4: { text: '단가', style: 0 },
                            5: { text: '금액', style: 0 },
                            6: { text: '비고', style: 0 }
                        },
                        1: {
                            0: { text: 'MD-001' },
                            1: { text: '수술용 메스' },
                            2: { text: '일회용' },
                            3: { text: '100', type: 'number' },
                            4: { text: '5000', type: 'number' },
                            5: { text: '500000', type: 'number' },
                            6: { text: '긴급' }
                        },
                        2: {
                            0: { text: 'MD-002' },
                            1: { text: '의료용 거즈' },
                            2: { text: '10x10cm' },
                            3: { text: '500', type: 'number' },
                            4: { text: '1000', type: 'number' },
                            5: { text: '500000', type: 'number' },
                            6: { text: '' }
                        },
                        3: {
                            0: { text: 'MD-003' },
                            1: { text: '주사기' },
                            2: { text: '5ml' },
                            3: { text: '200', type: 'number' },
                            4: { text: '3000', type: 'number' },
                            5: { text: '600000', type: 'number' },
                            6: { text: '' }
                        },
                        4: {
                            0: { text: 'MD-004' },
                            1: { text: '수액세트' },
                            2: { text: '표준형' },
                            3: { text: '150', type: 'number' },
                            4: { text: '8000', type: 'number' },
                            5: { text: '1200000', type: 'number' },
                            6: { text: '재고확인' }
                        },
                        5: {
                            0: { text: 'MD-005' },
                            1: { text: '진단키트' },
                            2: { text: 'COVID-19' },
                            3: { text: '50', type: 'number' },
                            4: { text: '15000', type: 'number' },
                            5: { text: '750000', type: 'number' },
                            6: { text: '예약주문' }
                        }
                    }
                }])
                .change((data) => {
                    console.log('data changed:', data);
                });

                loading.style.display = 'none';
                console.log('✅ 스프레드시트 로드 완료!');

                // 전역 변수로 저장
                window.spreadsheet = xs;

                // Flutter 통합
                if (window.parent !== window) {
                    window.parent.postMessage('spreadsheet_ready', '*');
                }

            } catch (error) {
                console.error('스프레드시트 초기화 실패:', error);
                loading.textContent = '오류: ' + error.message;
                loading.style.color = 'red';
            }
        });

        // Flutter 메시지 핸들러
        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'loadExcel') {
                console.log('Excel 파일 로드 요청:', event.data);
            }
        });
    </script>
</body>
</html>
