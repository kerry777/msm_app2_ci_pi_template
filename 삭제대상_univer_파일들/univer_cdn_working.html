<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univer Spreadsheet</title>
    <script src="https://unpkg.com/@univerjs/presets/lib/univer-preset-sheets-en-US.umd.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/presets/lib/univer-preset-sheets-en-US.css">
    <style>
        #app {
            height: 100vh;
            width: 100vw;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        window.addEventListener('load', function() {
            // 전역 객체 확인
            console.log('Available globals:', Object.keys(window).filter(k => k.toLowerCase().includes('univer')));

            // 올바른 전역 이름 사용
            if (window.UniverSheetsPresetEnUS) {
                const { univerAPI } = UniverSheetsPresetEnUS({
                    container: 'app',
                });

                univerAPI.createWorkbook({
                    name: 'MSM 견적서',
                    sheets: [{
                        name: 'Sheet1',
                    }]
                });

                console.log('✅ Univer 초기화 성공!');
            } else {
                console.error('UniverSheetsPresetEnUS를 찾을 수 없습니다');
            }
        });
    </script>
</body>
</html>
