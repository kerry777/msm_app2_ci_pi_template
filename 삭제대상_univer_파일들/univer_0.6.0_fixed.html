<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univer 0.6.0 수정 버전 - React 호환성 해결</title>

    <!-- React 18 (React 19 호환성 문제 해결을 위해 18 사용) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <!-- RxJS -->
    <script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>

    <!-- React JSX Runtime 호환성 패치 -->
    <script>
        // React 19 호환성 문제 해결
        window.React = window.React || {};
        window.React.jsx = window.React.jsx || function(type, props, key) {
            return React.createElement(type, props, key);
        };
        window.React.jsxs = window.React.jsxs || function(type, props, key) {
            return React.createElement(type, props, key);
        };
        window.React.Fragment = window.React.Fragment || React.Fragment;
    </script>

    <!-- Univer 0.6.0 프리셋 -->
    <script src="https://unpkg.com/@univerjs/presets@0.6.0/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/preset-sheets-core@0.6.0/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/preset-sheets-core@0.6.0/lib/umd/locales/en-US.js"></script>

    <!-- Univer 스타일 -->
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/preset-sheets-core@0.6.0/lib/index.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #app {
            width: 100%;
            height: 100%;
        }
        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border-radius: 5px;
            z-index: 999999;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .status.loading {
            background: #FFC107;
            color: #333;
        }
        .status.error {
            background: #F44336;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="status loading" id="status">Univer 0.6.0 초기화 중...</div>
    <div id="app"></div>

    <script>
        console.log('=== Univer 0.6.0 Fixed Version ===');

        async function initUniver() {
            const statusEl = document.getElementById('status');

            function updateStatus(msg, type = 'loading') {
                statusEl.textContent = msg;
                statusEl.className = `status ${type}`;
                console.log(`[Status] ${msg}`);
            }

            // 스크립트 완전 로드 대기
            await new Promise(resolve => setTimeout(resolve, 2000));

            try {
                // 전역 객체 확인
                console.log('Checking global objects...');
                console.log('UniverPresets:', typeof window.UniverPresets);
                console.log('UniverPresetSheetsCore:', typeof window.UniverPresetSheetsCore);
                console.log('UniverPresetSheetsCoreEnUS:', typeof window.UniverPresetSheetsCoreEnUS);

                if (!window.UniverPresets) {
                    throw new Error('UniverPresets not found. Please check CDN loading.');
                }

                if (!window.UniverPresetSheetsCore) {
                    throw new Error('UniverPresetSheetsCore not found.');
                }

                updateStatus('Creating Univer instance...', 'loading');

                // Univer 초기화 (0.6.0 방식)
                const { createUniver } = window.UniverPresets;
                const { UniverSheetsCorePreset } = window.UniverPresetSheetsCore;

                // Locale 설정
                const LocaleType = { EN_US: 'en-US' };

                console.log('Initializing Univer with presets...');

                // Univer 인스턴스 생성
                const univerResult = createUniver({
                    locale: LocaleType.EN_US,
                    locales: {
                        [LocaleType.EN_US]: window.UniverPresetSheetsCoreEnUS
                    },
                    presets: [
                        UniverSheetsCorePreset({
                            container: 'app'  // 컨테이너 ID 지정
                        })
                    ]
                });

                console.log('✅ Univer created:', univerResult);

                // univerAPI 추출
                const { univerAPI } = univerResult || {};

                if (!univerAPI) {
                    throw new Error('univerAPI not created properly');
                }

                // 워크북 생성 및 데이터 설정
                setTimeout(() => {
                    try {
                        const activeWorkbook = univerAPI.getActiveWorkbook();
                        console.log('Active workbook:', activeWorkbook);

                        if (activeWorkbook) {
                            const activeSheet = activeWorkbook.getActiveSheet();
                            console.log('Active sheet:', activeSheet);

                            if (activeSheet) {
                                // MSM 견적서 헤더
                                const headers = [
                                    ['품목코드', '품목명', '규격', '수량', '단가', '금액', '비고']
                                ];

                                // MSM 견적서 데이터
                                const data = [
                                    ['MD-001', '수술용 메스', '일회용', 100, 5000, 500000, '긴급'],
                                    ['MD-002', '의료용 거즈', '10x10cm', 500, 1000, 500000, ''],
                                    ['MD-003', '주사기', '5ml', 200, 3000, 600000, ''],
                                    ['MD-004', '수액세트', '표준형', 150, 8000, 1200000, '재고확인'],
                                    ['MD-005', '진단키트', 'COVID-19', 50, 15000, 750000, '예약주문']
                                ];

                                // 데이터 설정
                                try {
                                    activeSheet.getRange(0, 0, 1, 7).setValues(headers);
                                    activeSheet.getRange(1, 0, data.length, 7).setValues(data);

                                    // 열 너비 조정
                                    for (let i = 0; i < 7; i++) {
                                        activeSheet.setColumnWidth(i, i === 1 ? 200 : 100);
                                    }

                                    console.log('✅ Data loaded successfully');
                                } catch (dataError) {
                                    console.warn('Data loading error (non-critical):', dataError);
                                }
                            }
                        }
                    } catch (dataError) {
                        console.warn('Data setup warning:', dataError);
                    }
                }, 1000);

                // 전역 저장
                window.univerAPI = univerAPI;

                updateStatus('✅ Univer 0.6.0 초기화 성공!', '');

                // 3초 후 상태 숨기기
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                }, 3000);

            } catch (error) {
                console.error('❌ Initialization error:', error);
                updateStatus(`❌ ${error.message}`, 'error');

                // 디버깅 정보
                const univerKeys = Object.keys(window).filter(k =>
                    k.toLowerCase().includes('univer')
                );
                console.log('Available Univer keys:', univerKeys);
            }

            // DOM 체크
            setTimeout(() => {
                const appEl = document.getElementById('app');
                const renderInfo = {
                    children: appEl.children.length,
                    htmlLength: appEl.innerHTML.length,
                    canvasElements: appEl.querySelectorAll('canvas').length,
                    univerElements: appEl.querySelectorAll('[class*="univer"]').length,
                    visibleContent: appEl.offsetHeight > 0 && appEl.offsetWidth > 0
                };

                console.log('DOM Render Check:', renderInfo);

                if (renderInfo.children === 0) {
                    console.warn('⚠️ No DOM elements rendered');
                    console.log('App element HTML:', appEl.innerHTML.substring(0, 200));
                } else {
                    console.log('✅ DOM elements found:', renderInfo);
                }
            }, 3000);
        }

        // 페이지 로드 후 실행
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initUniver);
        } else {
            initUniver();
        }

        // Flutter 통합
        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'loadExcel') {
                console.log('Excel load request:', event.data);
            }
        });
    </script>
</body>
</html>
