<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Univer Excel 뷰어 - 원본 파일 로딩</title>
    <style>
        html, body, #univer-container {
            height: 100%;
            margin: 0;
        }
        #toolbar {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 99;
            background: #ffffffcc;
            border-radius: 8px;
            padding: 6px 10px;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }
        #toolbar button {
            margin-right: 6px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
        #toolbar button:hover {
            background: #f0f0f0;
        }
        input[type=file] {
            display: none;
        }
        #status {
            position: fixed;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>

    <!-- Univer Preset CDN (공식 문서) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/rxjs/dist/bundles/rxjs.umd.min.js"></script>
    <script src="https://unpkg.com/echarts@5.6.0/dist/echarts.min.js"></script>

    <script src="https://unpkg.com/@univerjs/presets/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/preset-sheets-core/lib/umd/index.js"></script>
    <script src="https://unpkg.com/@univerjs/preset-sheets-core/lib/umd/locales/en-US.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@univerjs/preset-sheets-core/lib/index.css" />
</head>
<body>
    <div id="univer-container"></div>

    <div id="toolbar">
        <button onclick="loadAsset('assets/excel_templates/quotation_kr.xlsx')">📄 견적서</button>
        <button onclick="loadAsset('assets/excel_templates/pi_template.xlsx')">📋 PI</button>
        <button onclick="loadAsset('assets/excel_templates/commercial_invoice.xlsx')">💼 상업송장</button>
        <button onclick="loadAsset('assets/excel_templates/packing_list.xlsx')">📦 포장목록</button>
        <button onclick="triggerFilePicker()">📁 파일 열기</button>
        <button onclick="exportXlsx()">💾 저장</button>
        <input id="fileInput" type="file" accept=".xlsx" />
    </div>

    <div id="status">Univer 로딩 중...</div>

    <script>
        console.log('🚀 Univer Excel 뷰어 시작...');

        // 전역 객체 확인
        console.log('window.UniverPresets:', typeof window.UniverPresets);
        console.log('window.UniverCore:', typeof window.UniverCore);
        console.log('window.UniverPresetSheetsCore:', typeof window.UniverPresetSheetsCore);

        // 여러 방식 시도
        try {
            // 방식 1: 직접 window 접근
            if (window.UniverPresets && window.UniverCore && window.UniverPresetSheetsCore) {
                const { createUniver } = window.UniverPresets;
                const { LocaleType } = window.UniverCore;
                const { UniverSheetsCorePreset } = window.UniverPresetSheetsCore;

                console.log('✅ Univer 객체들 찾음!');

                // Univer 인스턴스 초기화
                const { univerAPI } = createUniver({
                    container: 'univer-container',
                    locale: LocaleType.EN_US,
                    presets: [UniverSheetsCorePreset()],
                });

                // 전역 변수로 저장
                window.univerAPI = univerAPI;

                // 초기 빈 워크북 생성
                univerAPI.createWorkbook({ name: 'Excel 뷰어' });

                updateStatus('✅ Univer 초기화 완료');
            } else {
                throw new Error('Univer 객체를 찾을 수 없습니다');
            }
        } catch (error) {
            console.error('❌ Univer 초기화 실패:', error);
            updateStatus('❌ Univer 초기화 실패: ' + error.message);
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log(message);
        }

        function toBase64(uint8) {
            let binary = '';
            const chunk = 0x8000;
            for (let i = 0; i < uint8.length; i += chunk) {
                const sub = uint8.subarray(i, i + chunk);
                binary += String.fromCharCode.apply(null, sub);
            }
            return btoa(binary);
        }

        async function loadExcelFromArrayBuffer(buffer, filename = 'Excel 파일') {
            try {
                updateStatus(`📁 ${filename} 로딩 중...`);

                // Univer API를 사용하여 Excel 파일 로드
                if (!window.univerAPI) {
                    throw new Error('Univer API를 찾을 수 없습니다.');
                }

                // ArrayBuffer를 Blob으로 변환
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const file = new File([blob], filename, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

                // Excel 파일을 Univer로 가져오기
                await window.univerAPI.createWorkbook(file);

                updateStatus(`✅ ${filename} 로딩 완료`);

                // Flutter에 알림
                if (window.FlutterChannel) {
                    FlutterChannel.postMessage('loaded:' + filename);
                }

                return true;
            } catch (error) {
                console.error('Excel 로딩 오류:', error);
                updateStatus(`❌ ${filename} 로딩 실패: ${error.message}`);

                if (window.FlutterChannel) {
                    FlutterChannel.postMessage('error:' + error.message);
                }

                return false;
            }
        }

        async function loadAsset(path) {
            try {
                updateStatus(`🔄 ${path} 가져오는 중...`);

                const response = await fetch(path);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${path}를 찾을 수 없습니다`);
                }

                const buffer = await response.arrayBuffer();
                const filename = path.split('/').pop();

                return await loadExcelFromArrayBuffer(buffer, filename);
            } catch (error) {
                console.error('Asset 로딩 오류:', error);
                updateStatus(`❌ Asset 로딩 실패: ${error.message}`);
                return false;
            }
        }

        async function getXlsxBytes() {
            try {
                // Univer API를 사용하여 Excel 내보내기
                if (!window.univerAPI) {
                    throw new Error('Univer API를 찾을 수 없습니다');
                }

                // 현재 활성 워크북을 Excel로 내보내기
                const blob = await window.univerAPI.exportWorkbook('xlsx');
                const arrayBuffer = await blob.arrayBuffer();
                return new Uint8Array(arrayBuffer);
            } catch (error) {
                console.error('Excel 내보내기 오류:', error);
                throw new Error('Excel 내보내기 실패: ' + error.message);
            }
        }

        async function exportXlsx() {
            try {
                updateStatus('💾 Excel 저장 중...');

                const bytes = await getXlsxBytes();
                const b64 = toBase64(bytes);

                if (window.FlutterChannel) {
                    FlutterChannel.postMessage('download:xlsx:' + b64);
                } else {
                    // 브라우저에서 직접 다운로드
                    const blob = new Blob([bytes], {
                        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
                    });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'export.xlsx';
                    a.click();
                    URL.revokeObjectURL(a.href);
                }

                updateStatus('✅ Excel 저장 완료');
            } catch (error) {
                console.error('Excel 저장 오류:', error);
                updateStatus(`❌ Excel 저장 실패: ${error.message}`);

                if (window.FlutterChannel) {
                    FlutterChannel.postMessage('error:' + error.message);
                }
            }
        }

        function triggerFilePicker() {
            const input = document.getElementById('fileInput');
            input.value = '';
            input.click();
        }

        // 파일 선택 이벤트
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;

            const buffer = await file.arrayBuffer();
            await loadExcelFromArrayBuffer(buffer, file.name);
        });

        // Flutter ↔ WebView 메시지 브리지
        window.addEventListener('message', async (event) => {
            const { action, data } = event.data || {};

            if (action === 'triggerFilePicker') {
                return triggerFilePicker();
            }
            if (action === 'exportXlsx') {
                return exportXlsx();
            }
            if (action === 'loadExcelAsset' && data && data.path) {
                return loadAsset(data.path);
            }
            if (action === 'getXlsxBase64') {
                try {
                    const bytes = await getXlsxBytes();
                    const b64 = toBase64(bytes);
                    if (window.FlutterChannel) {
                        FlutterChannel.postMessage('return:xlsx:' + b64);
                    }
                } catch (error) {
                    if (window.FlutterChannel) {
                        FlutterChannel.postMessage('error:' + error.message);
                    }
                }
            }
        });

        // Flutter 준비 완료 알림
        if (window.parent && window.parent !== window) {
            window.parent.postMessage('univer_ready', '*');
        }

        console.log('✅ Univer Excel 뷰어 준비 완료');
    </script>
</body>
</html>
