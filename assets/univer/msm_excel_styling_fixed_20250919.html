  <script>
    let univer = null;
    let workbook = null;
    let univerAPI = null;
    let stylingEngine = null;
    let isInitialized = false;

    // 진행률 업데이트
    function setProgress(percent) {
      document.getElementById('progressFill').style.width = percent + '%';
    }

    // 상태 업데이트
    function setStatus(message) {
      document.getElementById('statusText').textContent = message;
      console.log(`📝 ${message}`);
    }

    // 통계 업데이트
    function updateStats(styles = 0, cells = 0, sheets = 1) {
      document.getElementById('styleCount').textContent = styles;
      document.getElementById('cellCount').textContent = cells;
      document.getElementById('sheetCount').textContent = sheets;
    }

    // 로딩 화면 숨기기
    function hideLoading() {
      document.getElementById('loadingScreen').style.display = 'none';
    }

    // 고급 스타일 매핑 엔진
    class ExcelStyleMapper {
      constructor() {
        this.colorCache = new Map();
        this.styleCache = new Map();
      }

      // Excel 색상을 Univer 색상으로 변환
      convertColor(excelColor) {
        if (!excelColor) return null;

        const key = JSON.stringify(excelColor);
        if (this.colorCache.has(key)) {
          return this.colorCache.get(key);
        }

        let result = null;

        // ARGB 형식
        if (excelColor.argb && excelColor.argb.length === 8) {
          result = '#' + excelColor.argb.substring(2);
        }
        // RGB 형식
        else if (excelColor.rgb) {
          result = '#' + excelColor.rgb;
        }
        // 테마 색상
        else if (excelColor.theme !== undefined) {
          const themes = {
            0: '#000000', 1: '#FFFFFF', 2: '#E7E6E6', 3: '#44546A',
            4: '#5B9BD5', 5: '#70AD47', 6: '#FFC000', 7: '#C55A11',
            8: '#264478', 9: '#636363', 10: '#D9D9D9', 11: '#8C8C8C'
          };
          result = themes[excelColor.theme] || '#000000';
        }
        // 인덱스 색상
        else if (excelColor.indexed !== undefined) {
          const indexed = [
            '#000000', '#FFFFFF', '#FF0000', '#00FF00', '#0000FF', '#FFFF00',
            '#FF00FF', '#00FFFF', '#800000', '#008000', '#000080', '#808000',
            '#800080', '#008080', '#C0C0C0', '#808080', '#9999FF', '#993366'
          ];
          result = indexed[excelColor.indexed] || '#000000';
        }

        if (result) {
          this.colorCache.set(key, result);
        }
        return result;
      }

      // Excel 스타일을 Univer 스타일로 변환
      convertCellStyle(excelStyle) {
        if (!excelStyle) return null;

        const key = JSON.stringify(excelStyle);
        if (this.styleCache.has(key)) {
          return this.styleCache.get(key);
        }

        const univerStyle = {};

        // 폰트 스타일
        if (excelStyle.font) {
          const font = excelStyle.font;
          if (font.name) univerStyle.ff = font.name;
          if (font.size) univerStyle.fs = Math.round(font.size);
          if (font.bold) univerStyle.bl = 1;
          if (font.italic) univerStyle.it = 1;
          if (font.underline) univerStyle.ul = { s: 1 };
          if (font.strike) univerStyle.st = { s: 1 };

          const color = this.convertColor(font.color);
          if (color) univerStyle.cl = { rgb: color };
        }

        // 배경색
        if (excelStyle.fill && excelStyle.fill.fgColor) {
          const bgColor = this.convertColor(excelStyle.fill.fgColor);
          if (bgColor) univerStyle.bg = { rgb: bgColor };
        }

        // 정렬
        if (excelStyle.alignment) {
          const align = excelStyle.alignment;

          // 수평 정렬
          if (align.horizontal) {
            const hMap = { 'left': 1, 'center': 2, 'right': 3, 'justify': 5 };
            univerStyle.h = hMap[align.horizontal] || 1;
          }

          // 수직 정렬
          if (align.vertical) {
            const vMap = { 'top': 1, 'middle': 2, 'bottom': 3 };
            univerStyle.v = vMap[align.vertical] || 2;
          }

          // 텍스트 래핑
          if (align.wrapText) univerStyle.tb = 3;
        }

        // 테두리
        if (excelStyle.border) {
          const border = {};
          const sides = ['top', 'bottom', 'left', 'right'];

          sides.forEach(side => {
            const borderSide = excelStyle.border[side];
            if (borderSide && borderSide.style && borderSide.style !== 'none') {
              const styles = { 'thin': 1, 'medium': 2, 'thick': 3, 'dotted': 4, 'dashed': 5 };
              border[side[0]] = {
                s: styles[borderSide.style] || 1,
                cl: { rgb: this.convertColor(borderSide.color) || '#000000' }
              };
            }
          });

          if (Object.keys(border).length > 0) {
            univerStyle.bd = border;
          }
        }

        // 숫자 형식
        if (excelStyle.numFmt) {
          univerStyle.n = { pattern: excelStyle.numFmt };
        }

        this.styleCache.set(key, univerStyle);
        return Object.keys(univerStyle).length > 0 ? univerStyle : null;
      }
    }

    // ExcelJS로 파일 파싱
    async function parseExcelFile(arrayBuffer) {
      try {
        setStatus('🎨 ExcelJS로 서식 파싱 중...');
        setProgress(30);

        if (typeof ExcelJS === 'undefined') {
          throw new Error('ExcelJS 라이브러리 없음');
        }

        const workbook = new ExcelJS.Workbook();
        await workbook.xlsx.load(arrayBuffer);

        const sheets = [];
        let totalStyles = 0;

        workbook.eachSheet((worksheet, sheetId) => {
          const sheetData = {
            name: worksheet.name,
            data: [],
            styles: {},
            colWidths: {},
            rowHeights: {}
          };

          // 열 너비
          worksheet.columns.forEach((col, index) => {
            if (col.width) sheetData.colWidths[index] = col.width;
          });

          // 셀 데이터 및 스타일
          const maxRow = Math.min(worksheet.actualRowCount || 200, 500);
          const maxCol = Math.min(worksheet.actualColumnCount || 30, 50);

          for (let r = 1; r <= maxRow; r++) {
            const row = worksheet.getRow(r);
            const rowData = [];

            if (row.height) sheetData.rowHeights[r - 1] = row.height;

            for (let c = 1; c <= maxCol; c++) {
              const cell = row.getCell(c);
              let value = '';

              // 값 추출
              if (cell.value !== null && cell.value !== undefined) {
                if (typeof cell.value === 'object') {
                  if (cell.value.richText) {
                    value = cell.value.richText.map(rt => rt.text).join('');
                  } else if (cell.value.formula) {
                    value = cell.calculatedValue || cell.value.result || '';
                  } else {
                    value = cell.value.toString();
                  }
                } else {
                  value = cell.value.toString();
                }
              }

              rowData.push(value);

              // 스타일 변환
              if (cell.style) {
                const style = stylingEngine.convertCellStyle(cell.style);
                if (style) {
                  const addr = `${r-1},${c-1}`;
                  sheetData.styles[addr] = style;
                  totalStyles++;
                }
              }
            }

            sheetData.data.push(rowData);
          }

          sheets.push(sheetData);
          console.log(`✅ ${worksheet.name}: ${sheetData.data.length}행, ${Object.keys(sheetData.styles).length}개 스타일`);
        });

        setProgress(60);
        updateStats(totalStyles, 0, sheets.length);
        return sheets;

      } catch (error) {
        console.error('❌ ExcelJS 파싱 실패:', error);
        return null;
      }
    }

    // XLSX 폴백
    async function parseWithXLSX(arrayBuffer) {
      try {
        setStatus('📊 XLSX 기본 파싱 중...');
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });

        const sheets = workbook.SheetNames.map(name => ({
          name: name,
          data: XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1 }),
          styles: {},
          colWidths: {},
          rowHeights: {}
        }));

        updateStats(0, 0, sheets.length);
        return sheets;
      } catch (error) {
        console.error('❌ XLSX 파싱 실패:', error);
        throw error;
      }
    }

    // Univer에 스타일 적용
    function applyStylesToSheet(sheet, sheetData) {
      if (!sheet || !sheetData.styles) return 0;

      let appliedCount = 0;
      const cellCount = sheetData.data.length * (sheetData.data[0]?.length || 0);

      // 배치 스타일 적용
      Object.entries(sheetData.styles).forEach(([addr, style]) => {
        try {
          const [row, col] = addr.split(',').map(Number);
          if (row >= 0 && col >= 0) {
            const range = sheet.getRange(row, col, 1, 1);
            range.setStyle(style);
            appliedCount++;
          }
        } catch (error) {
          console.warn(`스타일 적용 실패 (${addr}):`, error.message);
        }
      });

      // 열 너비
      Object.entries(sheetData.colWidths).forEach(([col, width]) => {
        try {
          sheet.setColumnWidth(parseInt(col), Math.max(width * 8, 60));
        } catch (error) {
          console.warn(`열 너비 실패:`, error.message);
        }
      });

      // 행 높이
      Object.entries(sheetData.rowHeights).forEach(([row, height]) => {
        try {
          sheet.setRowHeight(parseInt(row), Math.max(height * 1.3, 25));
        } catch (error) {
          console.warn(`행 높이 실패:`, error.message);
        }
      });

      updateStats(appliedCount, cellCount, 1);
      return appliedCount;
    }

    // 템플릿 로딩
    async function loadTemplate(templateName) {
      if (!univerAPI) {
        setStatus('❌ 시스템이 준비되지 않음');
        return;
      }

      const templates = {
        '견적_KR': '../MEK_SALES_TEMPLATE_QT_KR.xlsx',
        'CI': '../MEK_SALES_TEMPLATE_CI.xlsx',
        'PI': '../MEK_SALES_TEMPLATE_PI.xlsx',
        'PL': '../MEK_SALES_TEMPLATE_PL.xlsx',
        '견적_AS': '../MEK_SALES_TEMPLATE_QT_AS.xlsx'
      };

      const filePath = templates[templateName];
      if (!filePath) return;

      try {
        setStatus(`🔄 ${templateName} 로딩 중...`);
        setProgress(10);

        // 실시간 로딩
        const timestamp = Date.now();
        const random = Math.random().toString(36).substring(7);
        const url = `${filePath}?_t=${timestamp}&_r=${random}`;

        const response = await fetch(url, {
          method: 'GET',
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
          }
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const arrayBuffer = await response.arrayBuffer();
        setProgress(20);

        // 서식 파싱
        let sheets = await parseExcelFile(arrayBuffer);
        if (!sheets) {
          sheets = await parseWithXLSX(arrayBuffer);
        }

        if (sheets && sheets.length > 0) {
          setProgress(70);

          const workbook = univerAPI.getActiveWorkbook();
          const firstSheet = sheets[0];

          // 첫 번째 시트 업데이트
          if (firstSheet.data.length > 0) {
            const activeSheet = workbook.getActiveSheet();

            // 데이터 클리어 및 설정
            activeSheet.getRange(0, 0, 1000, 100).clear();
            const maxCols = Math.max(...firstSheet.data.map(row => row.length));
            activeSheet.getRange(0, 0, firstSheet.data.length, maxCols).setValues(firstSheet.data);

            setProgress(85);

            // 스타일 적용
            const appliedStyles = applyStylesToSheet(activeSheet, firstSheet);

            if (appliedStyles > 0) {
              setStatus(`✅ ${templateName} 완료 (${appliedStyles}개 서식 적용)`);
            } else {
              setStatus(`✅ ${templateName} 완료 (기본 데이터)`);
            }

            console.log(`🎉 ${templateName} 로딩 완료: ${firstSheet.data.length}행, ${appliedStyles}개 스타일`);
          }

          // 추가 시트 처리
          for (let i = 1; i < sheets.length; i++) {
            const sheetData = sheets[i];
            if (sheetData.data.length > 0) {
              try {
                let sheetName = sheetData.name;
                const existing = workbook.getSheets().map(s => s.getName());
                let counter = 1;
                while (existing.includes(sheetName)) {
                  sheetName = `${sheetData.name}_${counter++}`;
                }

                const newSheet = workbook.create(
                  sheetName,
                  sheetData.data.length,
                  Math.max(...sheetData.data.map(row => row.length))
                );

                const maxCols = Math.max(...sheetData.data.map(row => row.length));
                newSheet.getRange(0, 0, sheetData.data.length, maxCols).setValues(sheetData.data);

                // 스타일 적용
                if (Object.keys(sheetData.styles).length > 0) {
                  workbook.setActiveSheet(sheetName);
                  applyStylesToSheet(newSheet, sheetData);
                  workbook.setActiveSheet(0);
                }

                console.log(`✅ 추가 시트 "${sheetName}" 완료`);
              } catch (error) {
                console.error(`❌ 시트 생성 실패:`, error);
              }
            }
          }

          setProgress(100);
          setTimeout(() => setProgress(0), 2000);
        }

      } catch (error) {
        console.error(`❌ ${templateName} 로딩 실패:`, error);
        setStatus(`❌ ${templateName} 실패: ${error.message}`);
        setProgress(0);
      }
    }

    // 파일 업로드
    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file || !univerAPI) return;

      try {
        setStatus('📥 파일 분석 중...');
        const arrayBuffer = await file.arrayBuffer();

        let sheets = await parseExcelFile(arrayBuffer);
        if (!sheets) sheets = await parseWithXLSX(arrayBuffer);

        if (sheets && sheets.length > 0) {
          const workbook = univerAPI.getActiveWorkbook();
          const sheet = workbook.getActiveSheet();
          const firstSheet = sheets[0];

          const maxCols = Math.max(...firstSheet.data.map(row => row.length));
          sheet.getRange(0, 0, firstSheet.data.length, maxCols).setValues(firstSheet.data);

          const appliedStyles = applyStylesToSheet(sheet, firstSheet);

          if (appliedStyles > 0) {
            setStatus(`✅ 업로드 완료 (${appliedStyles}개 서식 적용)`);
          } else {
            setStatus(`✅ 업로드 완료 (기본 데이터)`);
          }
        }

        event.target.value = '';
      } catch (error) {
        console.error('❌ 업로드 실패:', error);
        setStatus(`❌ 업로드 실패: ${error.message}`);
      }
    }

    // 파일 다운로드
    function downloadFile() {
      if (!univerAPI) return;

      try {
        const workbook = univerAPI.getActiveWorkbook();
        const sheet = workbook.getActiveSheet();
        const range = sheet.getRange(0, 0, 100, 20);
        const values = range.getValues();

        const ws = XLSX.utils.aoa_to_sheet(values);
        const book = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(book, ws, 'Sheet1');
        const ab = XLSX.write(book, { bookType: 'xlsx', type: 'array' });

        const blob = new Blob([ab], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `MSM_Export_${new Date().toISOString().slice(0,10)}.xlsx`;
        a.click();
        URL.revokeObjectURL(url);

        setStatus('✅ 다운로드 완료');
      } catch (error) {
        console.error('❌ 다운로드 실패:', error);
        setStatus('❌ 다운로드 실패');
      }
    }

    function uploadFile() {
      document.getElementById('fileInput').click();
    }

    // 라이브러리 확인
    function waitForUniver() {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const check = () => {
          if (typeof UniverCore !== 'undefined' &&
              typeof UniverSheets !== 'undefined' &&
              typeof UniverSheetsUI !== 'undefined') {
            resolve();
          } else if (attempts < 50) {
            attempts++;
            setTimeout(check, 200);
          } else {
            reject(new Error('Univer 라이브러리 로딩 실패'));
          }
        };
        check();
      });
    }

    // 초기화
    async function initialize() {
      try {
        setStatus('🔄 Univer 라이브러리 확인 중...');
        setProgress(10);

        await waitForUniver();
        setProgress(30);

        setStatus('🎨 스타일 엔진 초기화 중...');
        stylingEngine = new ExcelStyleMapper();
        setProgress(50);

        setStatus('🔄 Univer 워크북 생성 중...');

        // Univer 초기화
        univer = new UniverCore.Univer({
          theme: UniverDesign.defaultTheme,
          locale: UniverCore.LocaleType.EN_US,
          logLevel: UniverCore.LogLevel.ERROR
        });

        // 플러그인 등록
        univer.registerPlugin(UniverRenderEngine.UniverRenderEnginePlugin);
        univer.registerPlugin(UniverSheets.UniverSheetsPlugin);
        univer.registerPlugin(UniverSheetsUI.UniverSheetsUIPlugin);
        univer.registerPlugin(UniverUI.UniverUIPlugin);

        setProgress(70);

        // 워크북 생성
        workbook = univer.createUniverSheet({
          id: 'msm_workbook',
          name: 'MSM Excel System'
        });

        setProgress(90);

        // API 인스턴스
        univerAPI = UniverSheets.FUniver.newAPI(univer);

        if (univerAPI) {
          setProgress(100);
          setStatus('✅ 완전한 서식 지원 시스템 준비 완료');
          hideLoading();
          isInitialized = true;
          setTimeout(() => setProgress(0), 2000);
          console.log('🎉 MSM Excel 서식 지원 시스템 초기화 완료');
        } else {
          throw new Error('Univer API 생성 실패');
        }

      } catch (error) {
        console.error('❌ 초기화 실패:', error);
        setStatus('❌ 초기화 실패. 새로고침 필요.');
        document.getElementById('univerContainer').innerHTML =
          '<div class="error-message">❌ 시스템 초기화 실패. 페이지를 새로고침해주세요.</div>';
      }
    }

    // DOM 로드 후 초기화
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(initialize, 500);
    });
  </script>
