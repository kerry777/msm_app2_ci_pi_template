  <script>
    // XLSX 라이브러리 강제 로딩
    if (typeof XLSX === 'undefined') {
      console.log('🔄 XLSX 백업 CDN 로딩 시도...');
      const script = document.createElement('script');
      script.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
      script.onload = () => console.log('✅ XLSX 백업 로드 완료');
      script.onerror = () => console.log('❌ XLSX 백업 로드 실패');
      document.head.appendChild(script);
    }

    // XLSX 라이브러리 로딩 확인
    function waitForXLSX() {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const checkXLSX = () => {
          if (typeof XLSX !== 'undefined') {
            console.log('✅ XLSX 사용 가능:', typeof XLSX);
            resolve(XLSX);
          } else if (attempts < 100) { // 10초 대기
            attempts++;
            setTimeout(checkXLSX, 100);
          } else {
            console.error('❌ XLSX 라이브러리 없음. window.XLSX:', typeof window.XLSX);
            reject(new Error('XLSX 라이브러리 로드 실패'));
          }
        };
        checkXLSX();
      });
    }
  </script>

  <script>
    const log = (...a) => console.log(...a);
    const setStatus = (s) => (document.getElementById('status').textContent = s);

    // 전역 변수
    let univerAPI = null;
    let workbook = null;

    function assertGlobals() {
      if (!window.UniverPresets) throw new Error('UniverPresets 전역이 없습니다 (preset UMD 로드 실패)');
      if (!window.UniverCore) throw new Error('UniverCore 전역이 없습니다');
      if (!window.UniverPresetSheetsCore) throw new Error('UniverPresetSheetsCore 전역이 없습니다');
      if (!window.UniverPresetSheetsCoreEnUS) throw new Error('UniverPresetSheetsCoreEnUS 전역이 없습니다');
    }

    async function main() {
      try {
        setStatus('🌐 페이지 로드 완료, 초기화 시작');
        assertGlobals();

        const { createUniver } = UniverPresets;
        const { LocaleType, mergeLocales } = UniverCore;
        const { UniverSheetsCorePreset } = UniverPresetSheetsCore;

        const { univerAPI: api } = createUniver({
          locale: LocaleType.EN_US,
          locales: { [LocaleType.EN_US]: mergeLocales(UniverPresetSheetsCoreEnUS) },
          presets: [UniverSheetsCorePreset({
            container: 'univer',
            header: true,
            toolbar: true,
            footer: true
          })],
        });

        univerAPI = api;
        workbook = univerAPI.createWorkbook({ name: 'MSM Excel System' });

        // 🔍 Excel Import API 기능 확인 (전체 스캔)
        console.log('🔍 Univer API 전체 메소드 스캔:');

        // 모든 메소드 이름 검색
        const allMethods = Object.getOwnPropertyNames(univerAPI).filter(name => typeof univerAPI[name] === 'function');
        console.log('📋 사용 가능한 메소드 전체 목록:', allMethods);

        // Excel/Import 관련 메소드 필터링
        const importMethods = allMethods.filter(name =>
          name.toLowerCase().includes('import') ||
          name.toLowerCase().includes('xlsx') ||
          name.toLowerCase().includes('excel') ||
          name.toLowerCase().includes('snapshot')
        );
        console.log('📊 Excel/Import 관련 메소드:', importMethods);

        // 구체적인 함수 이름들 확인
        console.log('🔍 구체적인 API 확인:');
        console.log('- importXLSXToSnapshotAsync:', typeof univerAPI.importXLSXToSnapshotAsync);
        console.log('- importXLSXToSnapshot:', typeof univerAPI.importXLSXToSnapshot);
        console.log('- importXLSX:', typeof univerAPI.importXLSX);
        console.log('- loadXLSX:', typeof univerAPI.loadXLSX);
        console.log('- openXLSX:', typeof univerAPI.openXLSX);
        console.log('- createWorkbook:', typeof univerAPI.createWorkbook);

        // 프로 기능 확인
        setTimeout(() => {
          if (window.hasProFeatures && (univerAPI.importXLSXToSnapshotAsync || univerAPI.importXLSXToSnapshot)) {
            setStatus('🎉 MSM Excel Pro 버전 - 서식 보존 지원!');
            console.log('🎉 Excel Import API 사용 가능!');
          } else if (univerAPI.importXLSXToSnapshotAsync || univerAPI.importXLSXToSnapshot) {
            setStatus('✅ Univer Excel Import API 지원됨!');
            console.log('🎉 Excel Import API 사용 가능!');
          } else {
            setStatus('✅ MSM Excel System 준비 완료 (기본 모드)');
            console.log('❌ Excel Import API 없음');
          }
        }, 2000);

        log('✅ MSM Complete Excel System 로드 완료');
      } catch (error) {
        console.error('💥 초기화 실패:', error);
        setStatus('💥 초기화 실패: ' + error.message);
      }
    }

    // 메뉴 함수들
    function showMenu(menuType) {
      setStatus(`${menuType.toUpperCase()} 메뉴 선택됨`);
    }

    // 템플릿 로드
    async function loadTemplate(templateType) {
      setStatus(`📋 ${templateType} 템플릿 로딩 중...`);

      // 실제 Excel 파일 경로 (같은 프로젝트 내)
      const templatePaths = {
        'quotation_kr': '../MEK_SALES_TEMPLATE_QT_KR.xlsx',        // 국내영업용 견적서
        'commercial_invoice': '../MEK_SALES_TEMPLATE_CI.xlsx',      // 상업송장
        'proforma_invoice': '../MEK_SALES_TEMPLATE_PI.xlsx',       // 해외영업용 견적서
        'packing_list': '../MEK_SALES_TEMPLATE_PL.xlsx',           // 패킹리스트
        'quotation_as': '../MEK_SALES_TEMPLATE_QT_AS.xlsx'         // 서비스팀용 견적서
      };

      // XLSX 라이브러리 로딩 대기
      try {
        await waitForXLSX();
        setStatus(`✅ XLSX 라이브러리 준비 완료`);
      } catch (error) {
        setStatus(`❌ XLSX 라이브러리 로드 실패: ${error.message}`);
        return;
      }

      // 실제 Excel 파일만 로드 (폴백 없음)
      if (templatePaths[templateType]) {
        const filePath = templatePaths[templateType];
        const fullURL = window.location.origin + window.location.pathname.replace(/[^/]+$/, '') + filePath;

        setStatus(`📂 파일 찾는 중: ${filePath}`);
        console.log(`🔍 찾는 파일 경로: ${filePath}`);
        console.log(`🌐 전체 URL: ${fullURL}`);

        try {
          // 강력한 캐시 방지를 위한 타임스탬프 추가
          const timestamp = new Date().getTime();
          const randomId = Math.random().toString(36).substring(7);
          const cacheBypassUrl = `${filePath}?_t=${timestamp}&_r=${randomId}`;

          console.log(`🔄 실시간 파일 로드 시도: ${cacheBypassUrl}`);

          const response = await fetch(cacheBypassUrl, {
            method: 'GET',
            cache: 'no-store',  // 더 강력한 캐시 비활성화
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate, proxy-revalidate',
              'Pragma': 'no-cache',
              'Expires': '0',
              'If-Modified-Since': 'Mon, 26 Jul 1997 05:00:00 GMT',
              'Last-Modified': new Date().toUTCString()
            }
          });

          const lastModified = response.headers.get('Last-Modified');
          console.log(`📡 HTTP 응답 (실시간):`, response.status, response.statusText);
          console.log(`📅 파일 최종 수정일: ${lastModified}`);
          console.log(`🕐 요청 시간: ${new Date().toISOString()}`);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText} - 파일 경로: ${filePath}`);
          }

          const arrayBuffer = await response.arrayBuffer();

          // 🎯 프로 API 시도: Excel 서식 보존 임포트 (최신 Async API)
          if (window.hasProFeatures) {
            try {
              setStatus(`🎉 프로 API로 ${templateType} 임포트 중... (서식 보존)`);

              const file = new File([arrayBuffer], `${templateType}.xlsx`, {
                type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
              });

              // 최신 Async API 시도
              if (univerAPI.importXLSXToSnapshotAsync) {
                const snapshot = await univerAPI.importXLSXToSnapshotAsync(file);
                console.log('🎉 Async API Excel 임포트 성공:', snapshot);

                // 새 워크북으로 교체
                const newWorkbook = univerAPI.createWorkbook(snapshot);
                setStatus(`✅ ${templateType} 로딩 완료 - 완전한 서식 보존 (Pro Async)`);
                return; // 성공하면 여기서 종료

              } else if (univerAPI.importXLSXToSnapshot) {
                // 구버전 API 시도
                const snapshot = await univerAPI.importXLSXToSnapshot(file);
                console.log('🎉 Legacy API Excel 임포트 성공:', snapshot);

                const newWorkbook = univerAPI.createWorkbook(snapshot);
                setStatus(`✅ ${templateType} 로딩 완료 - 완전한 서식 보존 (Pro Legacy)`);
                return;

              } else {
                console.log('❌ Excel Import API 없음');
                setStatus(`📋 Excel Import API 없음, 기본 방식으로 ${templateType} 로딩 중...`);
              }

            } catch (proError) {
              console.warn('⚠️ 프로 API 실패, 기본 방식으로 대체:', proError.message);
              setStatus(`📋 프로 API 실패, 기본 방식으로 ${templateType} 로딩 중...`);
            }
          }

          // 🔄 하이브리드 방식: XLSX로 데이터, ExcelJS로 서식
          const xlsxWorkbook = XLSX.read(arrayBuffer, { type: 'array' });

          if (univerAPI && xlsxWorkbook.SheetNames.length > 0) {
            // 1️⃣ XLSX로 먼저 데이터 추출 (값 확실히 가져오기)
            const firstSheetName = xlsxWorkbook.SheetNames[0];
            const xlsxWorksheet = xlsxWorkbook.Sheets[firstSheetName];
            const xlsxData = XLSX.utils.sheet_to_json(xlsxWorksheet, { header: 1, defval: '' });

            console.log(`📊 XLSX로 추출된 데이터 (${xlsxData.length}행):`, xlsxData.slice(0, 5)); // 처음 5행만 로그

            // 2️⃣ ExcelJS로 서식 정보만 추출 (값은 무시)
            const styles = [];
            if (window.hasStyleSupport) {
              try {
                setStatus(`🎨 ${templateType} 서식 처리 중... (ExcelJS)`);

                const excelWorkbook = new ExcelJS.Workbook();
                await excelWorkbook.xlsx.load(arrayBuffer);
                const excelWorksheet = excelWorkbook.worksheets[0];

                // 서식만 추출 (데이터는 XLSX 사용)
                excelWorksheet.eachRow({ includeEmpty: true }, (row, rowNumber) => {
                  const rowStyles = [];

                  row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                    // 서식 정보만 추출 (값은 무시)
                    const cellStyle = {};
                    if (cell.font) {
                      if (cell.font.bold) cellStyle.bold = true;
                      if (cell.font.italic) cellStyle.italic = true;
                      if (cell.font.color) {
                        let colorValue = cell.font.color.argb || cell.font.color.rgb || '000000';
                        if (colorValue.length === 8) {
                          colorValue = colorValue.substring(2);
                        }
                        cellStyle.color = '#' + colorValue;
                        console.log(`📝 텍스트 색상 추출: ${cellStyle.color} (원본: ${cell.font.color.argb || cell.font.color.rgb})`);
                      }
                    }
                    if (cell.fill && cell.fill.fgColor) {
                      let bgColorValue = cell.fill.fgColor.argb || cell.fill.fgColor.rgb || 'FFFFFF';
                      if (bgColorValue.length === 8) {
                        bgColorValue = bgColorValue.substring(2);
                      }
                      cellStyle.backgroundColor = '#' + bgColorValue;
                      console.log(`🎨 배경 색상 추출: ${cellStyle.backgroundColor} (원본: ${cell.fill.fgColor.argb || cell.fill.fgColor.rgb})`);
                    }

                    rowStyles[colNumber - 1] = cellStyle;
                  });

                  styles[rowNumber - 1] = rowStyles;
                });

                // 🔄 기존 워크북 전체 교체 (시트 누적 방지)
                try {
                  // 기존 워크북 완전히 제거
                  const activeWorkbook = univerAPI.getActiveWorkbook();
                  if (activeWorkbook) {
                    console.log('🗑️ 기존 워크북 제거 중...');
                    univerAPI.disposeWorkbook(activeWorkbook.getUnitId());
                  }
                } catch (disposeError) {
                  console.warn('⚠️ 기존 워크북 제거 실패 (무시 가능):', disposeError.message);
                }

                // 3️⃣ 새 워크북 생성 및 데이터 로드
                const newWorkbook = univerAPI.createWorkbook({ name: `${templateType} Template` });
                const newSheet = newWorkbook.getActiveSheet();

                // XLSX 데이터 먼저 로드
                if (xlsxData.length > 0) {
                  const maxCols = Math.max(...xlsxData.map(row => (row || []).length));
                  const dataRange = newSheet.getRange(0, 0, xlsxData.length, maxCols);
                  dataRange.setValues(xlsxData);

                  console.log(`📊 데이터 로드 완료: ${xlsxData.length}행 × ${maxCols}열`);
                  console.log(`📝 첫 번째 행 데이터:`, xlsxData[0]);
                }

                // 🎨 Univer 서식 API 완전 분석 및 적용
                console.log('🔍 Univer 서식 API 전체 분석 시작...');

                // 샘플 셀 범위로 모든 가능한 메소드 탐색
                const sampleRange = newSheet.getRange(0, 0, 1, 1);
                const allRangeMethods = Object.getOwnPropertyNames(Object.getPrototypeOf(sampleRange))
                  .filter(name => typeof sampleRange[name] === 'function');
                console.log('📋 Range 객체 전체 메소드:', allRangeMethods);

                // 서식 관련 메소드만 필터링
                const styleMethods = allRangeMethods.filter(name =>
                  name.toLowerCase().includes('style') ||
                  name.toLowerCase().includes('format') ||
                  name.toLowerCase().includes('font') ||
                  name.toLowerCase().includes('color') ||
                  name.toLowerCase().includes('background') ||
                  name.toLowerCase().includes('bold') ||
                  name.toLowerCase().includes('italic')
                );
                console.log('🎨 서식 관련 메소드:', styleMethods);

                // 🔧 실제 동작하는 서식 적용 방법 탐색
                let styleCount = 0;
                let workingMethods = [];

                styles.forEach((rowStyles, rowIndex) => {
                  rowStyles.forEach((cellStyle, colIndex) => {
                    if (cellStyle && Object.keys(cellStyle).length > 0) {
                      try {
                        const cellRange = newSheet.getRange(rowIndex, colIndex, 1, 1);

                        // 📝 XLSX와 Univer 값 모두 확인
                        const univerValue = cellRange.getValue();
                        const xlsxValue = xlsxData[rowIndex] && xlsxData[rowIndex][colIndex] ? xlsxData[rowIndex][colIndex] : '';
                        console.log(`🔍 셀 (${rowIndex}, ${colIndex}) Univer값: "${univerValue}", XLSX값: "${xlsxValue}"`);

                        // 🎨 배경색 적용 (이미 작동하는 것으로 확인됨)
                        if (cellStyle.backgroundColor) {
                          if (typeof cellRange.setBackgroundColor === 'function') {
                            cellRange.setBackgroundColor(cellStyle.backgroundColor);
                            workingMethods.push('setBackgroundColor');
                            console.log(`🎨 배경색 적용: ${cellStyle.backgroundColor}`);
                          }
                        }

                        // 💡 서식 적용 시도 - 오류 발생하지 않도록 안전하게
                        const formatAttempts = [
                          // Bold 시도
                          () => {
                            if (cellStyle.bold && typeof cellRange.setBold === 'function') {
                              cellRange.setBold(true);
                              workingMethods.push('setBold');
                              return true;
                            }
                            return false;
                          },
                          // 색상 시도
                          () => {
                            const targetColor = cellStyle.color || '#000000';
                            if (typeof cellRange.setFontColor === 'function') {
                              cellRange.setFontColor(targetColor);
                              workingMethods.push('setFontColor');
                              console.log(`📝 텍스트 색상 적용: ${targetColor}`);
                              return true;
                            }
                            return false;
                          }
                        ];

                        // 안전하게 하나씩 시도
                        formatAttempts.forEach((attempt, index) => {
                          try {
                            if (attempt()) {
                              console.log(`✅ 서식 적용 성공 (시도 ${index + 1})`);
                            }
                          } catch (methodError) {
                            console.log(`⚠️ 서식 적용 실패 (시도 ${index + 1}):`, methodError.message);
                          }
                        });

                        styleCount++;
                      } catch (cellError) {
                        console.warn(`❌ 셀 (${rowIndex}, ${colIndex}) 처리 실패:`, cellError.message);
                      }
                    }
                  });
                });

                console.log(`🎉 서식 처리 완료: ${styleCount}개 셀 처리`);
                console.log(`✅ 동작하는 메소드들:`, [...new Set(workingMethods)]);

                console.log(`🎨 ${templateType} 서식 적용 완료: ${styleCount}개 셀`);
                setStatus(`✅ ${templateType} 로딩 완료 (서식 보존됨)`);
                return; // 서식 지원 성공 시 여기서 종료

              } catch (styleError) {
                console.warn('⚠️ ExcelJS 서식 처리 실패, 기본 모드로 대체:', styleError.message);
                setStatus(`📋 서식 처리 실패, ${templateType} 기본 로딩 중...`);
              }
            }

            setStatus(`✅ ${templateType} 로딩 완료 (하이브리드 모드)`);
          } else {
            throw new Error('시트가 없습니다');
          }
        } catch (error) {
          console.error(`❌ Excel 파일 로드 실패:`, error);
          setStatus(`❌ Excel 파일 로드 실패: ${error.message}`);
        }
      } else {
        setStatus(`❌ 알 수 없는 템플릿 타입: ${templateType}`);
      }
    }


    // Excel 파일 처리
    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      try {
        setStatus('📥 XLSX 파싱 중...');
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true });

        const ws = wb.Sheets[wb.SheetNames[0]];
        const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });

        if (univerAPI && aoa.length > 0) {
          const rows = aoa.length;
          const cols = Math.max(0, ...aoa.map(r => r.length));
          const values = Array.from({ length: rows }, (_, r) => {
            const row = aoa[r] || [];
            return Array.from({ length: cols }, (_, c) => row[c] === undefined ? null : row[c]);
          });

          const activeWorkbook = univerAPI.getActiveWorkbook();
          const activeSheet = activeWorkbook.getActiveSheet();
          activeSheet.getRange(0, 0, rows, cols).setValues(values);
          setStatus('✅ 불러오기 완료: ' + file.name);
        }
      } catch (error) {
        setStatus('❌ 파일 로드 실패: ' + error.message);
      }
    }

    // Excel 저장
    async function exportXlsx() {
      if (!univerAPI) return;
      try {
        setStatus('💾 Excel 저장 중...');
        const activeWorkbook = univerAPI.getActiveWorkbook();
        const activeSheet = activeWorkbook.getActiveSheet();
        const range = activeSheet.getRange(0, 0, 100, 20);
        const values = range.getValues();

        const ws = XLSX.utils.aoa_to_sheet(values);
        const book = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(book, ws, 'Sheet1');
        const ab = XLSX.write(book, { bookType: 'xlsx', type: 'array' });

        const blob = new Blob([ab], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'msm_export.xlsx';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        setStatus('✅ Excel 저장 완료');
      } catch (error) {
        setStatus('❌ 저장 실패: ' + error.message);
      }
    }

    // 툴바 함수들
    function createNewWorkbook() { setStatus('🆕 새 워크북 생성'); }
    function saveWorkbook() { exportXlsx(); }
    function undoAction() { setStatus('↶ 실행 취소'); }
    function redoAction() { setStatus('↷ 다시 실행'); }
    function cutSelection() { setStatus('✂️ 잘라내기'); }
    function copySelection() { setStatus('📋 복사'); }
    function pasteSelection() { setStatus('📌 붙여넣기'); }
    function applyBold() { setStatus('Bold 서식 적용'); }
    function applyItalic() { setStatus('Italic 서식 적용'); }
    function applyUnderline() { setStatus('Underline 서식 적용'); }
    function insertChart() { setStatus('📊 차트 삽입'); }
    function insertFunction() { setStatus('ƒ 함수 삽입'); }

    // 페이지 로드 시 초기화
    window.addEventListener('load', () => {
      try {
        main();
      } catch (e) {
        console.error('💥 초기화 실패:', e);
        setStatus('💥 초기화 실패: ' + e.message);
      }
    });
  </script>
