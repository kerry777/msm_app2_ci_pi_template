  <script>
    // XLSX 라이브러리 강제 로딩
    if (typeof XLSX === 'undefined') {
      console.log('🔄 XLSX 백업 CDN 로딩 시도...');
      const script = document.createElement('script');
      script.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
      script.onload = () => console.log('✅ XLSX 백업 로드 완료');
      script.onerror = () => console.log('❌ XLSX 백업 로드 실패');
      document.head.appendChild(script);
    }

    // XLSX 라이브러리 로딩 확인
    function waitForXLSX() {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const checkXLSX = () => {
          if (typeof XLSX !== 'undefined') {
            console.log('✅ XLSX 사용 가능:', typeof XLSX);
            resolve(XLSX);
          } else if (attempts < 100) { // 10초 대기
            attempts++;
            setTimeout(checkXLSX, 100);
          } else {
            console.error('❌ XLSX 라이브러리 없음. window.XLSX:', typeof window.XLSX);
            reject(new Error('XLSX 라이브러리 로드 실패'));
          }
        };
        checkXLSX();
      });
    }

    // ExcelJS 로딩 확인
    function waitForExcelJS() {
      return new Promise((resolve) => {
        let attempts = 0;
        const checkExcelJS = () => {
          if (typeof ExcelJS !== 'undefined' || typeof window.ExcelJS !== 'undefined') {
            console.log('✅ ExcelJS 사용 가능');
            resolve(true);
          } else if (attempts < 30) {
            attempts++;
            setTimeout(checkExcelJS, 200);
          } else {
            console.warn('⚠️ ExcelJS 없음, XLSX 사용');
            resolve(false);
          }
        };
        checkExcelJS();
      });
    }

    // 서식 매핑 클래스
    class StyleConverter {
      constructor() {
        this.cache = new Map();
      }

      convertColor(color) {
        if (!color) return null;
        if (color.argb && color.argb.length === 8) {
          return '#' + color.argb.substring(2);
        }
        if (color.rgb) return '#' + color.rgb;
        if (color.theme !== undefined) {
          const themes = ['#000000', '#FFFFFF', '#E7E6E6', '#44546A', '#5B9BD5', '#70AD47', '#FFC000', '#C55A11'];
          return themes[color.theme] || '#000000';
        }
        return null;
      }

      convertStyle(excelStyle) {
        if (!excelStyle) return {};

        const key = JSON.stringify(excelStyle);
        if (this.cache.has(key)) return this.cache.get(key);

        const style = {};

        // 폰트
        if (excelStyle.font) {
          const font = excelStyle.font;
          if (font.name) style.ff = font.name;
          if (font.size) style.fs = Math.round(font.size);
          if (font.bold) style.bl = 1;
          if (font.italic) style.it = 1;
          if (font.underline) style.ul = { s: 1 };

          const color = this.convertColor(font.color);
          if (color) style.cl = { rgb: color };
        }

        // 배경색
        if (excelStyle.fill && excelStyle.fill.fgColor) {
          const bgColor = this.convertColor(excelStyle.fill.fgColor);
          if (bgColor) style.bg = { rgb: bgColor };
        }

        // 정렬
        if (excelStyle.alignment) {
          const align = excelStyle.alignment;
          if (align.horizontal) {
            const hMap = { 'left': 1, 'center': 2, 'right': 3 };
            style.h = hMap[align.horizontal] || 1;
          }
          if (align.vertical) {
            const vMap = { 'top': 1, 'middle': 2, 'bottom': 3 };
            style.v = vMap[align.vertical] || 2;
          }
          if (align.wrapText) style.tb = 3;
        }

        // 테두리
        if (excelStyle.border) {
          const border = {};
          const sides = ['top', 'bottom', 'left', 'right'];

          sides.forEach(side => {
            const borderSide = excelStyle.border[side];
            if (borderSide && borderSide.style && borderSide.style !== 'none') {
              const styles = { 'thin': 1, 'medium': 2, 'thick': 3 };
              border[side[0]] = {
                s: styles[borderSide.style] || 1,
                cl: { rgb: this.convertColor(borderSide.color) || '#000000' }
              };
            }
          });

          if (Object.keys(border).length > 0) style.bd = border;
        }

        this.cache.set(key, style);
        return style;
      }
    }

    // 전역 변수
    window.styleConverter = new StyleConverter();
    window.excelJSAvailable = false;
  </script>

  <script>
    // 전역 변수
    let univerAPI = null;
    let workbook = null;

    // 상태 표시
    function setStatus(message) {
      document.getElementById('status').textContent = message;
      console.log(`📝 상태: ${message}`);
    }

    // 서식 모드 표시
    function setStyleMode(hasStyles) {
      const modeEl = document.getElementById('statusMode');
      if (hasStyles) {
        modeEl.textContent = '서식 지원';
        modeEl.className = 'status-mode styling';
      } else {
        modeEl.textContent = '값-only';
        modeEl.className = 'status-mode';
      }
    }

    // 전역 확인
    function assertGlobals() {
      if (!window.UniverPresets) throw new Error('UniverPresets 전역이 없습니다 (preset UMD 로드 실패)');
      if (!window.UniverCore) throw new Error('UniverCore 전역이 없습니다');
      if (!window.UniverPresetSheetsCore) throw new Error('UniverPresetSheetsCore 전역이 없습니다');
      if (!window.UniverPresetSheetsCoreEnUS) throw new Error('UniverPresetSheetsCoreEnUS 전역이 없습니다');
    }

    // ExcelJS로 서식 파싱
    async function parseWithExcelJS(arrayBuffer) {
      try {
        if (!window.excelJSAvailable) return null;

        setStatus('🎨 ExcelJS 서식 파싱 중...');

        const ExcelJSLib = window.ExcelJS || ExcelJS;
        const workbook = new ExcelJSLib.Workbook();
        await workbook.xlsx.load(arrayBuffer);

        const sheets = [];
        let totalStyles = 0;

        workbook.eachSheet((worksheet, sheetId) => {
          const sheetData = {
            name: worksheet.name,
            data: [],
            styles: {},
            colWidths: {},
            rowHeights: {}
          };

          // 열 너비
          worksheet.columns.forEach((col, index) => {
            if (col.width) sheetData.colWidths[index] = col.width;
          });

          // 셀 데이터 및 스타일
          const maxRow = Math.min(worksheet.actualRowCount || 100, 200);
          const maxCol = Math.min(worksheet.actualColumnCount || 20, 30);

          for (let r = 1; r <= maxRow; r++) {
            const row = worksheet.getRow(r);
            const rowData = [];

            if (row.height) sheetData.rowHeights[r - 1] = row.height;

            for (let c = 1; c <= maxCol; c++) {
              const cell = row.getCell(c);
              let value = '';

              // 값 추출
              if (cell.value !== null && cell.value !== undefined) {
                if (typeof cell.value === 'object') {
                  if (cell.value.richText) {
                    value = cell.value.richText.map(rt => rt.text).join('');
                  } else if (cell.value.formula) {
                    value = cell.calculatedValue || cell.value.result || '';
                  } else {
                    value = cell.value.toString();
                  }
                } else {
                  value = cell.value.toString();
                }
              }

              rowData.push(value);

              // 스타일 변환
              if (cell.style) {
                const style = window.styleConverter.convertStyle(cell.style);
                if (Object.keys(style).length > 0) {
                  const addr = `${r-1},${c-1}`;
                  sheetData.styles[addr] = style;
                  totalStyles++;
                }
              }
            }

            sheetData.data.push(rowData);
          }

          sheets.push(sheetData);
          console.log(`✅ ${worksheet.name}: ${sheetData.data.length}행, ${Object.keys(sheetData.styles).length}개 스타일`);
        });

        console.log(`🎨 ExcelJS 파싱 완료: 총 ${totalStyles}개 스타일`);
        return sheets;

      } catch (error) {
        console.error('❌ ExcelJS 파싱 실패:', error);
        return null;
      }
    }

    // Univer에 스타일 적용
    function applyStylesToUniver(univerAPI, sheetData) {
      if (!sheetData.styles || Object.keys(sheetData.styles).length === 0) {
        return 0;
      }

      try {
        const workbook = univerAPI.getActiveWorkbook();
        const sheet = workbook.getActiveSheet();

        let appliedCount = 0;

        // 배치 스타일 적용
        Object.entries(sheetData.styles).forEach(([addr, style]) => {
          try {
            const [row, col] = addr.split(',').map(Number);
            const range = sheet.getRange(row, col, 1, 1);
            range.setStyle(style);
            appliedCount++;
          } catch (error) {
            console.warn(`스타일 적용 실패 (${addr}):`, error.message);
          }
        });

        // 열 너비 적용
        Object.entries(sheetData.colWidths).forEach(([col, width]) => {
          try {
            sheet.setColumnWidth(parseInt(col), Math.max(width * 8, 60));
          } catch (error) {
            console.warn(`열 너비 실패:`, error.message);
          }
        });

        // 행 높이 적용
        Object.entries(sheetData.rowHeights).forEach(([row, height]) => {
          try {
            sheet.setRowHeight(parseInt(row), Math.max(height * 1.3, 25));
          } catch (error) {
            console.warn(`행 높이 실패:`, error.message);
          }
        });

        console.log(`🎨 스타일 적용 완료: ${appliedCount}개`);
        return appliedCount;

      } catch (error) {
        console.error('❌ 스타일 적용 오류:', error);
        return 0;
      }
    }

    // 템플릿 로딩 (서식 지원)
    async function loadExcelTemplate(templateType) {
      if (!univerAPI) {
        setStatus('❌ Univer API가 준비되지 않았습니다');
        return;
      }

      const templateFiles = {
        '견적_KR': '../MEK_SALES_TEMPLATE_QT_KR.xlsx',
        'CI': '../MEK_SALES_TEMPLATE_CI.xlsx',
        'PI': '../MEK_SALES_TEMPLATE_PI.xlsx',
        'PL': '../MEK_SALES_TEMPLATE_PL.xlsx',
        '견적_AS': '../MEK_SALES_TEMPLATE_QT_AS.xlsx'
      };

      const filePath = templateFiles[templateType];
      if (filePath) {
        try {
          setStatus(`🔄 ${templateType} 템플릿 로딩 중...`);
          console.log(`📁 로딩: ${filePath}`);

          // 강력한 캐시 방지
          const timestamp = new Date().getTime();
          const randomId = Math.random().toString(36).substring(7);
          const cacheBypassUrl = `${filePath}?_t=${timestamp}&_r=${randomId}`;

          console.log(`🔄 실시간 요청: ${cacheBypassUrl}`);

          const response = await fetch(cacheBypassUrl, {
            method: 'GET',
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate, proxy-revalidate',
              'Pragma': 'no-cache',
              'Expires': '0',
              'If-Modified-Since': 'Mon, 26 Jul 1997 05:00:00 GMT',
              'Last-Modified': new Date().toUTCString()
            }
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const arrayBuffer = await response.arrayBuffer();
          console.log(`📊 파일 크기: ${arrayBuffer.byteLength} bytes, 수정 시간: ${new Date().toLocaleTimeString()}`);

          // 서식 파싱 시도 (ExcelJS 우선, XLSX 폴백)
          let processedSheets = await parseWithExcelJS(arrayBuffer);
          let hasStyles = false;

          if (!processedSheets) {
            // XLSX 폴백
            setStatus('📊 XLSX 기본 파싱 중...');
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            processedSheets = workbook.SheetNames.map(name => ({
              name: name,
              data: XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1 }),
              styles: {},
              colWidths: {},
              rowHeights: {}
            }));
          } else {
            hasStyles = true;
          }

          if (processedSheets && processedSheets.length > 0) {
            const activeWorkbook = univerAPI.getActiveWorkbook();

            // 첫 번째 시트는 기존 시트 업데이트
            const firstSheetData = processedSheets[0];
            if (firstSheetData.data.length > 0) {
              const activeSheet = activeWorkbook.getActiveSheet();

              // 기존 데이터 클리어
              const clearRange = activeSheet.getRange(0, 0, 1000, 100);
              clearRange.clear();

              // 새 데이터 로드
              const maxCols = Math.max(...firstSheetData.data.map(row => row.length));
              const dataRange = activeSheet.getRange(0, 0, firstSheetData.data.length, maxCols);
              dataRange.setValues(firstSheetData.data);

              // 스타일 적용
              let appliedStyles = 0;
              if (hasStyles) {
                appliedStyles = applyStylesToUniver(univerAPI, firstSheetData);
              }

              // 상태 업데이트
              if (appliedStyles > 0) {
                setStatus(`✅ ${templateType} 로딩 완료 (${appliedStyles}개 서식 적용)`);
                setStyleMode(true);
              } else {
                setStatus(`✅ ${templateType} 로딩 완료 (기본 데이터)`);
                setStyleMode(false);
              }

              // 시트 정보 업데이트
              document.getElementById('sheetInfo').textContent = `${firstSheetData.name} (${firstSheetData.data.length}행)`;

              console.log(`✅ 첫 번째 시트 "${firstSheetData.name}" 업데이트 완료: ${firstSheetData.data.length}행, ${appliedStyles}개 스타일`);
            }

            // 추가 시트들 처리
            for (let i = 1; i < processedSheets.length; i++) {
              const sheetData = processedSheets[i];
              if (sheetData.data.length > 0) {
                try {
                  // 중복 시트명 방지
                  const existingSheets = activeWorkbook.getSheets().map(s => s.getName());
                  let newSheetName = sheetData.name;
                  let counter = 1;
                  while (existingSheets.includes(newSheetName)) {
                    newSheetName = `${sheetData.name}_${counter}`;
                    counter++;
                  }

                  // 새 시트 생성
                  const newSheet = activeWorkbook.create(newSheetName, sheetData.data.length,
                    Math.max(...sheetData.data.map(row => row.length)));

                  // 데이터 설정
                  const maxCols = Math.max(...sheetData.data.map(row => row.length));
                  const range = newSheet.getRange(0, 0, sheetData.data.length, maxCols);
                  range.setValues(sheetData.data);

                  // 스타일 적용
                  if (hasStyles && Object.keys(sheetData.styles).length > 0) {
                    // 새 시트를 활성화하고 스타일 적용
                    activeWorkbook.setActiveSheet(newSheetName);
                    const appliedStyles = applyStylesToUniver(univerAPI, sheetData);
                    // 첫 번째 시트로 되돌리기
                    activeWorkbook.setActiveSheet(0);
                    console.log(`✅ 추가 시트 "${newSheetName}" 스타일 적용: ${appliedStyles}개`);
                  }

                  console.log(`✅ 추가 시트 "${newSheetName}" 생성 완료: ${sheetData.data.length}행`);
                } catch (sheetError) {
                  console.error(`❌ 시트 "${sheetData.name}" 생성 실패:`, sheetError);
                }
              }
            }

            console.log(`🎉 ${templateType} 템플릿 로딩 완전 완료`);
          }

        } catch (error) {
          console.error(`❌ ${templateType} 로딩 실패:`, error);
          setStatus(`❌ ${templateType} 로딩 실패: ${error.message}`);
          setStyleMode(false);
        }
      } else {
        setStatus(`❌ 알 수 없는 템플릿 타입: ${templateType}`);
      }
    }

    // Excel 파일 처리 (서식 지원)
    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      try {
        setStatus('📥 Excel 파일 분석 중...');
        const arrayBuffer = await file.arrayBuffer();

        // 서식 파싱 시도
        let processedSheets = await parseWithExcelJS(arrayBuffer);
        let hasStyles = false;

        if (!processedSheets) {
          // XLSX 폴백
          const wb = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array', cellDates: true });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true });
          processedSheets = [{ name: wb.SheetNames[0], data: aoa, styles: {} }];
        } else {
          hasStyles = true;
        }

        if (univerAPI && processedSheets && processedSheets.length > 0) {
          const firstSheetData = processedSheets[0];
          const activeWorkbook = univerAPI.getActiveWorkbook();
          const activeSheet = activeWorkbook.getActiveSheet();

          // 데이터 설정
          const data = firstSheetData.data;
          if (data.length > 0) {
            const rows = data.length;
            const cols = Math.max(0, ...data.map(r => r.length));
            const values = Array.from({ length: rows }, (_, r) => {
              const row = data[r] || [];
              return Array.from({ length: cols }, (_, c) => row[c] === undefined ? null : row[c]);
            });

            activeSheet.getRange(0, 0, rows, cols).setValues(values);

            // 스타일 적용
            let appliedStyles = 0;
            if (hasStyles) {
              appliedStyles = applyStylesToUniver(univerAPI, firstSheetData);
            }

            if (appliedStyles > 0) {
              setStatus(`✅ 파일 업로드 완료 (${appliedStyles}개 서식 적용): ${file.name}`);
              setStyleMode(true);
            } else {
              setStatus(`✅ 파일 업로드 완료: ${file.name}`);
              setStyleMode(false);
            }
          }
        }
      } catch (error) {
        setStatus('❌ 파일 로드 실패: ' + error.message);
        setStyleMode(false);
      }
    }

    // Excel 저장
    async function exportXlsx() {
      if (!univerAPI) return;
      try {
        setStatus('💾 Excel 저장 중...');
        const activeWorkbook = univerAPI.getActiveWorkbook();
        const activeSheet = activeWorkbook.getActiveSheet();
        const range = activeSheet.getRange(0, 0, 100, 20);
        const values = range.getValues();

        const ws = XLSX.utils.aoa_to_sheet(values);
        const book = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(book, ws, 'Sheet1');
        const ab = XLSX.write(book, { bookType: 'xlsx', type: 'array' });

        const blob = new Blob([ab], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'msm_export.xlsx';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        setStatus('✅ Excel 저장 완료');
      } catch (error) {
        setStatus('❌ 저장 실패: ' + error.message);
      }
    }

    // 툴바 함수들
    function createNewWorkbook() { setStatus('🆕 새 워크북 생성'); }
    function saveWorkbook() { exportXlsx(); }
    function undoAction() { setStatus('↶ 실행 취소'); }
    function redoAction() { setStatus('↷ 다시 실행'); }
    function cutSelection() { setStatus('✂️ 잘라내기'); }
    function copySelection() { setStatus('📋 복사'); }
    function pasteSelection() { setStatus('📌 붙여넣기'); }
    function applyBold() { setStatus('Bold 서식 적용'); }
    function applyItalic() { setStatus('Italic 서식 적용'); }
    function applyUnderline() { setStatus('Underline 서식 적용'); }
    function insertChart() { setStatus('📊 차트 삽입'); }
    function insertFunction() { setStatus('ƒ 함수 삽입'); }

    // 메인 초기화 함수 (기존 방식 보존)
    async function main() {
      try {
        setStatus('🌐 페이지 로드 완료, 초기화 시작');
        assertGlobals();

        // 라이브러리 확인
        await waitForXLSX();
        window.excelJSAvailable = await waitForExcelJS();

        if (window.excelJSAvailable) {
          console.log('✅ ExcelJS 사용 가능 - 완전한 서식 지원');
        } else {
          console.log('⚠️ ExcelJS 없음 - XLSX 기본 모드');
        }

        const { createUniver } = UniverPresets;
        const { LocaleType, mergeLocales } = UniverCore;
        const { UniverSheetsCorePreset } = UniverPresetSheetsCore;

        const { univerAPI: api } = createUniver({
          locale: LocaleType.EN_US,
          presets: [
            UniverSheetsCorePreset({
              container: 'univer'
            })
          ]
        });

        univerAPI = api;
        workbook = univerAPI.getActiveWorkbook();

        if (window.excelJSAvailable) {
          setStatus('✅ MSM Excel System 준비 완료 - 완전한 서식 지원');
        } else {
          setStatus('✅ MSM Excel System 준비 완료 - 기본 모드');
        }

        setStyleMode(false);
        document.getElementById('sheetInfo').textContent = 'Sheet1 (빈 워크북)';

        console.log('🎉 Univer 초기화 성공');

      } catch (error) {
        console.error('❌ 초기화 실패:', error);
        setStatus(`❌ 초기화 실패: ${error.message}`);
      }
    }

    // 페이지 로드 시 초기화
    window.addEventListener('load', () => {
      try {
        main();
      } catch (e) {
        console.error('💥 초기화 실패:', e);
        setStatus('💥 초기화 실패: ' + e.message);
      }
    });
  </script>
