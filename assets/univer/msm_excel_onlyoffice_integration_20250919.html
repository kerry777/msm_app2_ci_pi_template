<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MSM Excel - OnlyOffice Integration</title>

  <!-- OnlyOffice Document Server API -->
  <script src="https://onlyoffice.github.io/sdkjs/common/AllFonts.js"></script>
  <script src="https://onlyoffice.github.io/sdkjs/word/sdk-all-min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      padding: 16px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .header-badges {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .badge-onlyoffice {
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      animation: pulse 2s infinite;
    }

    .badge-premium {
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .toolbar {
      background: #ffffff;
      border-bottom: 1px solid #dadce0;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .toolbar-left {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .integration-selector {
      display: flex;
      background: #f1f3f4;
      border-radius: 8px;
      padding: 4px;
    }

    .integration-option {
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      border: none;
      background: transparent;
    }

    .integration-option.active {
      background: linear-gradient(135deg, #4285f4, #34a853);
      color: white;
      box-shadow: 0 2px 8px rgba(66,133,244,0.3);
    }

    .template-buttons {
      display: flex;
      gap: 12px;
    }

    .template-btn {
      background: linear-gradient(135deg, #4285f4, #34a853);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(66,133,244,0.3);
    }

    .template-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(66,133,244,0.4);
    }

    .status-bar {
      background: linear-gradient(135deg, #ffffff, #f8f9fa);
      padding: 12px 20px;
      border-bottom: 1px solid #dadce0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .status-text {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #5f6368;
      font-weight: 500;
    }

    .integration-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34a853;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.3; }
    }

    .editor-container {
      flex: 1;
      background: white;
      position: relative;
      overflow: hidden;
    }

    .editor-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255,255,255,0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(5px);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4285f4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }

    .fallback-message {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .fallback-message h3 {
      margin-bottom: 16px;
      color: #333;
    }

    .fallback-message p {
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .fallback-btn {
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-top: 16px;
      transition: all 0.3s;
    }

    .fallback-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255,107,107,0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏥 MEK ICS - MSM Excel System</h1>
      <div class="header-badges">
        <span class="badge badge-onlyoffice">OnlyOffice Integration</span>
        <span class="badge badge-premium">Premium Edition</span>
        <span class="badge">100% Excel Compatible</span>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="integration-selector">
          <button class="integration-option active" onclick="switchMode('onlyoffice')">
            🏆 OnlyOffice Pro
          </button>
          <button class="integration-option" onclick="switchMode('univer')">
            ⚡ Univer Fast
          </button>
          <button class="integration-option" onclick="switchMode('hybrid')">
            🔀 Hybrid
          </button>
        </div>
      </div>

      <div class="template-buttons">
        <button class="template-btn" onclick="loadTemplate('견적_KR')">📋 견적_KR</button>
        <button class="template-btn" onclick="loadTemplate('CI')">📄 CI</button>
        <button class="template-btn" onclick="loadTemplate('PI')">📃 PI</button>
        <button class="template-btn" onclick="loadTemplate('PL')">📦 PL</button>
        <button class="template-btn" onclick="loadTemplate('견적_AS')">🔧 견적_AS</button>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-text">
        <span id="statusText">🚀 OnlyOffice 통합 시스템 초기화 중...</span>
      </div>
      <div class="integration-status">
        <div class="status-indicator"></div>
        <span id="modeText">OnlyOffice Pro Mode</span>
      </div>
    </div>

    <div class="editor-container">
      <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">고급 Excel 엔진 준비 중...</div>
      </div>

      <!-- OnlyOffice 에디터 컨테이너 -->
      <div id="onlyofficeEditor" style="width: 100%; height: 100%; display: none;"></div>

      <!-- Univer 에디터 컨테이너 -->
      <div id="univerEditor" style="width: 100%; height: 100%; display: none;"></div>

      <!-- 폴백 메시지 -->
      <div id="fallbackContainer" class="fallback-message" style="display: none;">
        <h3>🔄 통합 에디터 준비 중</h3>
        <p>OnlyOffice Document Server 연결을 설정하고 있습니다.</p>
        <p>프리미엄 Excel 호환성을 위해서는 OnlyOffice 서버가 필요합니다.</p>
        <button class="fallback-btn" onclick="switchToUniver()">
          ⚡ Univer 고급 모드로 전환
        </button>
      </div>
    </div>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="fileInput" accept=".xlsx,.xls" style="display: none" onchange="handleFileUpload(event)">

  <script>
    let currentMode = 'onlyoffice';
    let onlyofficeAPI = null;
    let univerAPI = null;
    let isInitialized = false;

    // 상태 업데이트
    function setStatus(message) {
      document.getElementById('statusText').textContent = message;
      console.log(`📝 ${message}`);
    }

    // 모드 전환
    function switchMode(mode) {
      currentMode = mode;

      // 버튼 상태 업데이트
      document.querySelectorAll('.integration-option').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');

      // 모드 텍스트 업데이트
      const modeTexts = {
        'onlyoffice': 'OnlyOffice Pro Mode',
        'univer': 'Univer Fast Mode',
        'hybrid': 'Hybrid Mode'
      };
      document.getElementById('modeText').textContent = modeTexts[mode];

      // 에디터 전환
      if (mode === 'onlyoffice') {
        initOnlyOffice();
      } else if (mode === 'univer') {
        initUniver();
      } else {
        initHybridMode();
      }
    }

    // OnlyOffice 초기화
    async function initOnlyOffice() {
      try {
        setStatus('🏆 OnlyOffice Document Server 연결 중...');

        // OnlyOffice가 사용 가능한지 확인
        if (typeof DocsAPI === 'undefined') {
          console.warn('⚠️ OnlyOffice API 없음, 폴백 모드로 전환');
          showFallback();
          return;
        }

        // OnlyOffice 에디터 설정
        onlyofficeAPI = new DocsAPI.DocEditor('onlyofficeEditor', {
          width: '100%',
          height: '100%',
          type: 'cell',
          documentType: 'cell',
          document: {
            fileType: 'xlsx',
            key: 'msm_' + Math.random().toString(36).substring(7),
            title: 'MSM Excel Template',
            url: 'https://example.com/empty.xlsx' // 실제 서버 URL 필요
          },
          editorConfig: {
            mode: 'edit',
            lang: 'ko',
            customization: {
              about: true,
              feedback: false,
              forcesave: false,
              submitForm: false
            },
            user: {
              id: 'msm_user',
              name: 'MSM User'
            }
          },
          events: {
            onAppReady: () => {
              setStatus('✅ OnlyOffice 준비 완료 - 100% Excel 호환성');
              hideLoading();
              showEditor('onlyoffice');
            },
            onDocumentStateChange: (event) => {
              if (event.data) {
                setStatus('📝 문서 편집 중...');
              }
            },
            onError: (event) => {
              console.error('OnlyOffice 오류:', event);
              showFallback();
            }
          }
        });

      } catch (error) {
        console.error('❌ OnlyOffice 초기화 실패:', error);
        showFallback();
      }
    }

    // Univer 초기화 (기존 고급 모드)
    async function initUniver() {
      try {
        setStatus('⚡ Univer 고급 엔진 초기화 중...');

        // Univer 스크립트 동적 로딩
        if (typeof UniverPresetSheetCore === 'undefined') {
          await loadUniverScripts();
        }

        univerAPI = UniverPresetSheetCore.default({
          container: 'univerEditor',
          workbook: {
            id: 'msm_univer',
            name: 'MSM Excel - Univer Mode',
            sheetOrder: ['Sheet1'],
            sheets: {
              'Sheet1': {
                id: 'sheet1',
                name: 'Sheet1',
                rowCount: 1000,
                columnCount: 30,
                cellData: {},
                defaultColumnWidth: 73,
                defaultRowHeight: 19
              }
            },
            locale: 'en-US'
          }
        });

        if (univerAPI) {
          setStatus('✅ Univer 준비 완료 - 고급 서식 지원');
          hideLoading();
          showEditor('univer');
        }

      } catch (error) {
        console.error('❌ Univer 초기화 실패:', error);
        setStatus('❌ Univer 초기화 실패');
        showFallback();
      }
    }

    // Univer 스크립트 동적 로딩
    function loadUniverScripts() {
      return new Promise((resolve, reject) => {
        const scripts = [
          'https://unpkg.com/@univerjs/presets@0.10.8/lib/umd/index.js',
          'https://unpkg.com/@univerjs/preset-sheets-core@0.10.8/lib/umd/index.js',
          'https://unpkg.com/@univerjs/preset-sheets-core@0.10.8/lib/umd/locales/en-US.js'
        ];

        let loaded = 0;
        scripts.forEach(src => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = () => {
            loaded++;
            if (loaded === scripts.length) resolve();
          };
          script.onerror = reject;
          document.head.appendChild(script);
        });

        // CSS 로딩
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://unpkg.com/@univerjs/preset-sheets-core@0.10.8/lib/index.css';
        document.head.appendChild(link);
      });
    }

    // 하이브리드 모드 초기화
    async function initHybridMode() {
      setStatus('🔀 하이브리드 모드 설정 중...');

      // OnlyOffice 시도 후 실패시 Univer로 전환
      try {
        await initOnlyOffice();
      } catch {
        setStatus('🔄 Univer로 전환 중...');
        await initUniver();
      }
    }

    // 에디터 표시/숨기기
    function showEditor(type) {
      document.getElementById('onlyofficeEditor').style.display = type === 'onlyoffice' ? 'block' : 'none';
      document.getElementById('univerEditor').style.display = type === 'univer' ? 'block' : 'none';
      document.getElementById('fallbackContainer').style.display = 'none';
    }

    // 폴백 표시
    function showFallback() {
      document.getElementById('onlyofficeEditor').style.display = 'none';
      document.getElementById('univerEditor').style.display = 'none';
      document.getElementById('fallbackContainer').style.display = 'block';
      hideLoading();
      setStatus('⚠️ OnlyOffice 서버 필요 - Univer 모드 사용 가능');
    }

    // 로딩 숨기기
    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    // Univer 모드로 전환
    function switchToUniver() {
      switchMode('univer');
    }

    // 템플릿 로딩
    async function loadTemplate(templateName) {
      setStatus(`🔄 ${templateName} 템플릿 로딩 중...`);

      if (currentMode === 'onlyoffice' && onlyofficeAPI) {
        // OnlyOffice에서 템플릿 로딩
        try {
          // 실제 구현시 OnlyOffice API를 통한 파일 로딩
          setStatus(`✅ ${templateName} 로딩 완료 (OnlyOffice)`);
        } catch (error) {
          setStatus(`❌ ${templateName} 로딩 실패`);
        }
      } else if (currentMode === 'univer' && univerAPI) {
        // Univer에서 템플릿 로딩 (기존 방식)
        const templates = {
          '견적_KR': '../MEK_SALES_TEMPLATE_QT_KR.xlsx',
          'CI': '../MEK_SALES_TEMPLATE_CI.xlsx',
          'PI': '../MEK_SALES_TEMPLATE_PI.xlsx',
          'PL': '../MEK_SALES_TEMPLATE_PL.xlsx',
          '견적_AS': '../MEK_SALES_TEMPLATE_QT_AS.xlsx'
        };

        const filePath = templates[templateName];
        if (filePath) {
          try {
            // 기존 Univer 로딩 로직 사용
            await loadUniverTemplate(filePath, templateName);
          } catch (error) {
            setStatus(`❌ ${templateName} 로딩 실패`);
          }
        }
      } else {
        setStatus('❌ 에디터가 준비되지 않음');
      }
    }

    // Univer 템플릿 로딩 (간소화된 버전)
    async function loadUniverTemplate(filePath, templateName) {
      try {
        const timestamp = Date.now();
        const url = `${filePath}?_t=${timestamp}`;

        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const arrayBuffer = await response.arrayBuffer();

        // XLSX 기본 파싱
        if (typeof XLSX === 'undefined') {
          const script = document.createElement('script');
          script.src = 'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js';
          document.head.appendChild(script);
          await new Promise(resolve => script.onload = resolve);
        }

        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        if (univerAPI && data.length > 0) {
          const activeWorkbook = univerAPI.getActiveWorkbook();
          const activeSheet = activeWorkbook.getActiveSheet();

          activeSheet.getRange(0, 0, 1000, 100).clear();
          const maxCols = Math.max(...data.map(row => row.length));
          activeSheet.getRange(0, 0, data.length, maxCols).setValues(data);

          setStatus(`✅ ${templateName} 로딩 완료 (Univer)`);
        }

      } catch (error) {
        console.error('템플릿 로딩 실패:', error);
        throw error;
      }
    }

    // 파일 업로드
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      setStatus('📥 파일 업로드 중...');

      if (currentMode === 'onlyoffice' && onlyofficeAPI) {
        // OnlyOffice 파일 업로드
        setStatus('✅ 파일 업로드 완료 (OnlyOffice)');
      } else if (currentMode === 'univer' && univerAPI) {
        // Univer 파일 업로드 (기존 로직)
        setStatus('✅ 파일 업로드 완료 (Univer)');
      }

      event.target.value = '';
    }

    // 초기화
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        initOnlyOffice();
      }, 1000);
    });
  </script>
</body>
</html>
