  <script>
    let univerAPI = null;
    let stylingEngine = null;

    // 진행률 표시
    function setProgress(percent) {
      document.getElementById('progressBar').style.width = percent + '%';
    }

    // 상태 업데이트
    function setStatus(message) {
      document.getElementById('status').textContent = message;
      console.log(`📝 ${message}`);
    }

    // 라이브러리 로딩 확인
    async function waitForLibraries() {
      return new Promise((resolve) => {
        let attempts = 0;
        const checkLibraries = () => {
          const excelJSReady = typeof ExcelJS !== 'undefined' || typeof window.ExcelJS !== 'undefined';
          const xlsxReady = typeof XLSX !== 'undefined';

          if (excelJSReady || xlsxReady) {
            setProgress(25);
            console.log('✅ Excel 라이브러리 준비:', { ExcelJS: excelJSReady, XLSX: xlsxReady });
            resolve({ ExcelJS: excelJSReady, XLSX: xlsxReady });
          } else if (attempts < 50) {
            attempts++;
            setTimeout(checkLibraries, 200);
          } else {
            console.warn('⚠️ ExcelJS 없음, XLSX로 대체');
            resolve({ ExcelJS: false, XLSX: xlsxReady });
          }
        };
        checkLibraries();
      });
    }

    // 고급 스타일 매핑 엔진
    class AdvancedStyleMapper {
      constructor() {
        this.colorCache = new Map();
        this.fontCache = new Map();
      }

      // Excel 색상을 Univer 색상으로 변환 (향상됨)
      convertColor(excelColor) {
        if (!excelColor) return null;

        const cacheKey = JSON.stringify(excelColor);
        if (this.colorCache.has(cacheKey)) {
          return this.colorCache.get(cacheKey);
        }

        let result = null;

        if (excelColor.argb && excelColor.argb.length === 8) {
          result = '#' + excelColor.argb.substring(2);
        } else if (excelColor.rgb) {
          result = '#' + excelColor.rgb;
        } else if (excelColor.theme !== undefined) {
          const themeColors = {
            0: '#000000', 1: '#FFFFFF', 2: '#E7E6E6', 3: '#44546A',
            4: '#5B9BD5', 5: '#70AD47', 6: '#FFC000', 7: '#C55A11',
            8: '#264478', 9: '#636363', 10: '#D9D9D9', 11: '#8C8C8C'
          };
          result = themeColors[excelColor.theme] || '#000000';
        } else if (excelColor.indexed !== undefined) {
          const indexedColors = [
            '#000000', '#FFFFFF', '#FF0000', '#00FF00', '#0000FF', '#FFFF00',
            '#FF00FF', '#00FFFF', '#000000', '#FFFFFF', '#FF0000', '#00FF00',
            '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF'
          ];
          result = indexedColors[excelColor.indexed] || '#000000';
        }

        if (result) {
          this.colorCache.set(cacheKey, result);
        }
        return result;
      }

      // Excel 폰트를 Univer 스타일로 변환 (향상됨)
      convertFont(excelFont) {
        if (!excelFont) return {};

        const cacheKey = JSON.stringify(excelFont);
        if (this.fontCache.has(cacheKey)) {
          return this.fontCache.get(cacheKey);
        }

        const style = {};

        if (excelFont.name) style.ff = excelFont.name;
        if (excelFont.size) style.fs = Math.round(excelFont.size);
        if (excelFont.bold) style.bl = 1;
        if (excelFont.italic) style.it = 1;
        if (excelFont.underline) style.ul = { s: 1 };
        if (excelFont.strike) style.st = { s: 1 };

        const color = this.convertColor(excelFont.color);
        if (color) style.cl = { rgb: color };

        this.fontCache.set(cacheKey, style);
        return style;
      }

      // Excel 정렬을 Univer 정렬로 변환
      convertAlignment(excelAlignment) {
        if (!excelAlignment) return {};

        const style = {};

        const hAlignMap = {
          'left': 1, 'center': 2, 'right': 3, 'fill': 4,
          'justify': 5, 'centerContinuous': 6, 'distributed': 7
        };
        if (excelAlignment.horizontal) {
          style.h = hAlignMap[excelAlignment.horizontal] || 1;
        }

        const vAlignMap = {
          'top': 1, 'middle': 2, 'bottom': 3,
          'justify': 4, 'distributed': 5
        };
        if (excelAlignment.vertical) {
          style.v = vAlignMap[excelAlignment.vertical] || 2;
        }

        if (excelAlignment.wrapText) style.tb = 3;
        if (excelAlignment.indent) style.pd = { l: excelAlignment.indent * 8 };

        return style;
      }

      // Excel 테두리를 Univer 테두리로 변환
      convertBorder(excelBorder) {
        if (!excelBorder) return {};

        const border = {};
        const sides = ['top', 'bottom', 'left', 'right'];

        sides.forEach(side => {
          const borderSide = excelBorder[side];
          if (borderSide && borderSide.style && borderSide.style !== 'none') {
            const styleMap = {
              'thin': 1, 'medium': 2, 'thick': 3, 'dotted': 4,
              'dashed': 5, 'double': 6, 'hair': 1, 'mediumDashed': 5,
              'dashDot': 5, 'mediumDashDot': 5, 'dashDotDot': 5,
              'mediumDashDotDot': 5, 'slantDashDot': 5
            };

            border[side[0]] = {
              s: styleMap[borderSide.style] || 1,
              cl: { rgb: this.convertColor(borderSide.color) || '#000000' }
            };
          }
        });

        return Object.keys(border).length > 0 ? border : {};
      }

      // 완전한 셀 스타일 변환
      convertCellStyle(excelStyle) {
        if (!excelStyle) return {};

        const univerStyle = {};

        // 폰트 스타일
        Object.assign(univerStyle, this.convertFont(excelStyle.font));

        // 배경색
        if (excelStyle.fill) {
          if (excelStyle.fill.type === 'pattern' && excelStyle.fill.fgColor) {
            const bgColor = this.convertColor(excelStyle.fill.fgColor);
            if (bgColor) univerStyle.bg = { rgb: bgColor };
          } else if (excelStyle.fill.type === 'gradient' && excelStyle.fill.gradient) {
            // 그라디언트의 첫 번째 색상 사용
            const stops = excelStyle.fill.gradient.stops || excelStyle.fill.gradient;
            if (stops && stops.length > 0) {
              const bgColor = this.convertColor(stops[0].color);
              if (bgColor) univerStyle.bg = { rgb: bgColor };
            }
          }
        }

        // 정렬
        Object.assign(univerStyle, this.convertAlignment(excelStyle.alignment));

        // 테두리
        const border = this.convertBorder(excelStyle.border);
        if (Object.keys(border).length > 0) {
          univerStyle.bd = border;
        }

        // 숫자 형식
        if (excelStyle.numFmt) {
          univerStyle.n = { pattern: excelStyle.numFmt };
        }

        return univerStyle;
      }
    }

    // ExcelJS로 고급 파싱
    async function parseWithExcelJS(arrayBuffer) {
      try {
        setStatus('🎨 ExcelJS 고급 파싱 중...');
        setProgress(40);

        const ExcelJSLib = window.ExcelJS || ExcelJS;
        const workbook = new ExcelJSLib.Workbook();
        await workbook.xlsx.load(arrayBuffer);

        const sheets = [];
        workbook.eachSheet((worksheet, sheetId) => {
          const sheetData = {
            name: worksheet.name,
            data: [],
            styles: {},
            merges: [],
            colWidths: {},
            rowHeights: {}
          };

          // 열 너비
          worksheet.columns.forEach((col, index) => {
            if (col.width) sheetData.colWidths[index] = col.width;
          });

          // 병합 셀 정보
          if (worksheet.model && worksheet.model.merges) {
            sheetData.merges = worksheet.model.merges;
          }

          // 데이터 및 스타일 처리
          const maxRow = Math.min(worksheet.actualRowCount || 200, 1000);
          const maxCol = Math.min(worksheet.actualColumnCount || 50, 100);

          for (let r = 1; r <= maxRow; r++) {
            const row = worksheet.getRow(r);
            const rowData = [];

            if (row.height) sheetData.rowHeights[r - 1] = row.height;

            for (let c = 1; c <= maxCol; c++) {
              const cell = row.getCell(c);
              let value = '';

              if (cell.value !== null && cell.value !== undefined) {
                if (typeof cell.value === 'object') {
                  if (cell.value.richText) {
                    value = cell.value.richText.map(rt => rt.text).join('');
                  } else if (cell.value.formula) {
                    value = cell.calculatedValue || cell.value.result || '';
                  } else {
                    value = cell.value.toString();
                  }
                } else {
                  value = cell.value.toString();
                }
              }

              rowData.push(value);

              // 스타일 처리
              if (cell.style) {
                const cellAddr = `${r-1},${c-1}`;
                const style = stylingEngine.convertCellStyle(cell.style);
                if (Object.keys(style).length > 0) {
                  sheetData.styles[cellAddr] = style;
                }
              }
            }

            sheetData.data.push(rowData);
          }

          sheets.push(sheetData);
          console.log(`✅ ${worksheet.name}: ${sheetData.data.length}행, ${Object.keys(sheetData.styles).length}개 스타일`);
        });

        setProgress(70);
        return sheets;

      } catch (error) {
        console.error('❌ ExcelJS 파싱 실패:', error);
        return null;
      }
    }

    // XLSX 폴백
    async function parseWithXLSX(arrayBuffer) {
      try {
        setStatus('📊 XLSX 기본 파싱 중...');
        setProgress(50);

        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const sheets = workbook.SheetNames.map(name => ({
          name: name,
          data: XLSX.utils.sheet_to_json(workbook.Sheets[name], { header: 1 }),
          styles: {},
          merges: [],
          colWidths: {},
          rowHeights: {}
        }));

        setProgress(60);
        return sheets;
      } catch (error) {
        console.error('❌ XLSX 파싱 실패:', error);
        throw error;
      }
    }

    // Univer에 스타일 적용 (최적화됨)
    function applyAdvancedStyles(univerAPI, sheetData) {
      try {
        const workbook = univerAPI.getActiveWorkbook();
        const sheet = workbook.getActiveSheet();

        console.log(`🎨 고급 스타일 적용: ${Object.keys(sheetData.styles).length}개`);

        // 배치 스타일 적용
        const styleEntries = Object.entries(sheetData.styles);
        let appliedCount = 0;

        styleEntries.forEach(([cellAddr, style]) => {
          try {
            const [row, col] = cellAddr.split(',').map(Number);
            const range = sheet.getRange(row, col, 1, 1);
            range.setStyle(style);
            appliedCount++;
          } catch (error) {
            console.warn(`스타일 적용 실패 (${cellAddr}):`, error.message);
          }
        });

        // 열 너비 적용
        Object.entries(sheetData.colWidths).forEach(([col, width]) => {
          try {
            sheet.setColumnWidth(parseInt(col), Math.max(width * 7, 50));
          } catch (error) {
            console.warn(`열 너비 실패:`, error.message);
          }
        });

        // 행 높이 적용
        Object.entries(sheetData.rowHeights).forEach(([row, height]) => {
          try {
            sheet.setRowHeight(parseInt(row), Math.max(height * 1.2, 20));
          } catch (error) {
            console.warn(`행 높이 실패:`, error.message);
          }
        });

        console.log(`✅ 스타일 적용 완료: ${appliedCount}/${styleEntries.length}`);
        return appliedCount;

      } catch (error) {
        console.error('❌ 스타일 적용 오류:', error);
        return 0;
      }
    }

    // 템플릿 로딩 (고급 버전)
    async function loadTemplate(templateName) {
      if (!univerAPI) {
        setStatus('❌ Univer API 준비되지 않음');
        return;
      }

      const templates = {
        '견적_KR': '../MEK_SALES_TEMPLATE_QT_KR.xlsx',
        'CI': '../MEK_SALES_TEMPLATE_CI.xlsx',
        'PI': '../MEK_SALES_TEMPLATE_PI.xlsx',
        'PL': '../MEK_SALES_TEMPLATE_PL.xlsx',
        '견적_AS': '../MEK_SALES_TEMPLATE_QT_AS.xlsx'
      };

      const filePath = templates[templateName];
      if (!filePath) return;

      try {
        setStatus(`🔄 ${templateName} 템플릿 로딩...`);
        setProgress(10);

        // 실시간 로딩 (캐시 방지)
        const timestamp = Date.now();
        const random = Math.random().toString(36).substring(7);
        const url = `${filePath}?_t=${timestamp}&_r=${random}`;

        const response = await fetch(url, {
          method: 'GET',
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
          }
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const arrayBuffer = await response.arrayBuffer();
        setProgress(30);

        // 고급 파싱 시도
        let sheets = await parseWithExcelJS(arrayBuffer);
        if (!sheets) {
          sheets = await parseWithXLSX(arrayBuffer);
        }

        if (sheets && sheets.length > 0) {
          const workbook = univerAPI.getActiveWorkbook();

          // 첫 번째 시트 업데이트
          const firstSheet = sheets[0];
          if (firstSheet.data.length > 0) {
            const activeSheet = workbook.getActiveSheet();

            // 데이터 클리어 및 설정
            activeSheet.getRange(0, 0, 1000, 100).clear();
            const maxCols = Math.max(...firstSheet.data.map(row => row.length));
            activeSheet.getRange(0, 0, firstSheet.data.length, maxCols).setValues(firstSheet.data);

            setProgress(80);

            // 스타일 적용
            const appliedStyles = applyAdvancedStyles(univerAPI, firstSheet);

            setProgress(100);

            if (appliedStyles > 0) {
              setStatus(`✅ ${templateName} 완료 (${appliedStyles}개 서식 적용)`);
            } else {
              setStatus(`✅ ${templateName} 완료 (기본 데이터)`);
            }
          }

          // 추가 시트 처리
          for (let i = 1; i < sheets.length; i++) {
            const sheetData = sheets[i];
            if (sheetData.data.length > 0) {
              try {
                let sheetName = sheetData.name;
                const existing = workbook.getSheets().map(s => s.getName());
                let counter = 1;
                while (existing.includes(sheetName)) {
                  sheetName = `${sheetData.name}_${counter++}`;
                }

                const newSheet = workbook.create(
                  sheetName,
                  sheetData.data.length,
                  Math.max(...sheetData.data.map(row => row.length))
                );

                const maxCols = Math.max(...sheetData.data.map(row => row.length));
                newSheet.getRange(0, 0, sheetData.data.length, maxCols).setValues(sheetData.data);

                // 추가 시트에도 스타일 적용
                if (Object.keys(sheetData.styles).length > 0) {
                  workbook.setActiveSheet(sheetName);
                  applyAdvancedStyles(univerAPI, sheetData);
                  workbook.setActiveSheet(0);
                }

                console.log(`✅ 추가 시트 "${sheetName}" 생성 완료`);
              } catch (error) {
                console.error(`❌ 시트 생성 실패:`, error);
              }
            }
          }

          setTimeout(() => setProgress(0), 2000);
        }

      } catch (error) {
        console.error(`❌ ${templateName} 로딩 실패:`, error);
        setStatus(`❌ ${templateName} 실패: ${error.message}`);
        setProgress(0);
      }
    }

    // 파일 업로드
    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file || !univerAPI) return;

      try {
        setStatus('📥 파일 분석 중...');
        const arrayBuffer = await file.arrayBuffer();

        let sheets = await parseWithExcelJS(arrayBuffer);
        if (!sheets) sheets = await parseWithXLSX(arrayBuffer);

        if (sheets && sheets.length > 0) {
          const workbook = univerAPI.getActiveWorkbook();
          const sheet = workbook.getActiveSheet();
          const firstSheet = sheets[0];

          const maxCols = Math.max(...firstSheet.data.map(row => row.length));
          sheet.getRange(0, 0, firstSheet.data.length, maxCols).setValues(firstSheet.data);

          const appliedStyles = applyAdvancedStyles(univerAPI, firstSheet);

          if (appliedStyles > 0) {
            setStatus(`✅ 업로드 완료 (${appliedStyles}개 서식 적용)`);
          } else {
            setStatus(`✅ 업로드 완료 (기본 데이터)`);
          }
        }

        event.target.value = '';
      } catch (error) {
        console.error('❌ 업로드 실패:', error);
        setStatus(`❌ 업로드 실패: ${error.message}`);
      }
    }

    // Excel 다운로드
    function downloadExcel() {
      if (!univerAPI) return;

      try {
        const workbook = univerAPI.getActiveWorkbook();
        const sheet = workbook.getActiveSheet();
        const range = sheet.getRange(0, 0, 100, 20);
        const values = range.getValues();

        const ws = XLSX.utils.aoa_to_sheet(values);
        const book = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(book, ws, 'Sheet1');
        const ab = XLSX.write(book, { bookType: 'xlsx', type: 'array' });

        const blob = new Blob([ab], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `MSM_Export_${new Date().toISOString().slice(0,10)}.xlsx`;
        a.click();
        URL.revokeObjectURL(url);

        setStatus('✅ 다운로드 완료');
      } catch (error) {
        console.error('❌ 다운로드 실패:', error);
        setStatus('❌ 다운로드 실패');
      }
    }

    function uploadExcel() {
      document.getElementById('fileInput').click();
    }

    // 초기화
    async function initialize() {
      try {
        setStatus('🔄 라이브러리 확인 중...');
        await waitForLibraries();

        setStatus('🎨 스타일 엔진 초기화 중...');
        stylingEngine = new AdvancedStyleMapper();
        setProgress(50);

        setStatus('🔄 Univer 초기화 중...');
        univerAPI = UniverPresetSheetCore.default({
          container: 'univer',
          workbook: {
            id: 'msm_advanced',
            name: 'MSM Advanced Excel',
            sheetOrder: ['Sheet1'],
            sheets: {
              'Sheet1': {
                id: 'sheet1',
                name: 'Sheet1',
                rowCount: 1000,
                columnCount: 30,
                cellData: {},
                defaultColumnWidth: 73,
                defaultRowHeight: 19
              }
            },
            locale: 'en-US'
          }
        });

        if (univerAPI) {
          setProgress(100);
          setStatus('✅ 고급 서식 시스템 준비 완료');
          setTimeout(() => setProgress(0), 2000);
          console.log('🎉 고급 Excel 시스템 초기화 완료');
        } else {
          throw new Error('Univer 초기화 실패');
        }

      } catch (error) {
        console.error('❌ 초기화 실패:', error);
        setStatus('❌ 초기화 실패. 새로고침 필요.');
        setProgress(0);
      }
    }

    document.addEventListener('DOMContentLoaded', initialize);
  </script>
